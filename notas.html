  tableCtx.style.top = '0px';
  tableCtx.hidden = false;
  const menu = tableCtx.getBoundingClientRect();
  const vw = document.documentElement.clientWidth;
  const vh = document.documentElement.clientHeight;
  const fitsBelow = at.y + menu.height <= vh - 8;
  const top = fitsBelow ? at.y : Math.max(8, (at.above !== undefined ? at.above : at.y) - menu.height);
  tableCtx.style.left = `${clamp(at.x, 8, Math.max(8, vw - menu.width - 8))}px`;
  tableCtx.style.top = `${top}px`;
  paintTableHighlight(cell, scope);
  if (opener) opener.setAttribute('aria-expanded', 'true');
}

function closeTableCtx() {
  if (tableCtx.hidden) return;
  tableCtx.hidden = true;
  tableHl.hidden = true;
  delete tableCtx.dataset.scope;
  gripRow.setAttribute('aria-expanded', 'false');
  gripCol.setAttribute('aria-expanded', 'false');
}

function toggleGripMenu(scope, grip) {
  if (!tableCtx.hidden && tableCtx.dataset.scope === scope) { closeTableCtx(); return; }
  if (!gripCell || !body.contains(gripCell)) return;
  const rect = grip.getBoundingClientRect();
  openTableCtx(gripCell, scope, { x: rect.left, y: rect.bottom + 4, above: rect.top - 4 }, grip);
}

/* Tiradores: el borde entre dos columnas reparte el ancho entre ellas; el borde derecho cambia
   el de toda la tabla. Mientras se arrastra se ve en vivo, y al soltar se aplica con editTable
   para que Ctrl+Z lo deshaga. Escape cancela; doble clic vuelve a columnas iguales o al ancho completo. */

function tableEdgeAt(x, y, target) {
  let el = target && (target.nodeType === Node.ELEMENT_NODE ? target : target.parentElement);
  let table = el && el.closest('table');
  // Justo a la derecha de la tabla el puntero ya está fuera de ella.
  if (!table) {
    el = document.elementFromPoint(x - EDGE_GRAB - 1, y);
    table = el && el.closest('table');
  }
  if (!table || !body.contains(table) || !table.rows.length) return null;
  const rect = table.getBoundingClientRect();
  if (y < rect.top || y > rect.bottom) return null;
  const tr = (el.closest('tr') && table.contains(el.closest('tr'))) ? el.closest('tr') : table.rows[0];
  const cells = [...tr.cells];
  for (let i = 0; i < cells.length; i++) {
    const right = cells[i].getBoundingClientRect().right;
    if (Math.abs(x - right) <= EDGE_GRAB) return { table, index: i, outer: i === cells.length - 1 };
  }
  return null;
}

// El espacio que tiene la tabla: el ancho de su contenedor sin los márgenes interiores.
function availWidth(table) {
  const box = table.parentElement;
  const style = getComputedStyle(box);
  return box.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
}

function paintGuide(table, x, label) {
  const area = sheetArea();
  const rect = table.getBoundingClientRect();
  const top = Math.max(rect.top, area.top);
  const bottom = Math.min(rect.bottom, area.bottom);
  tableGuide.hidden = bottom <= top;
  Object.assign(tableGuide.style, { left: `${x}px`, top: `${top}px`, height: `${Math.max(0, bottom - top)}px` });
  if (label) tableGuide.dataset.label = label;
  else delete tableGuide.dataset.label;
}

function hoverTableEdge(e) {
  if (tableResize || e.buttons || e.pointerType === 'touch') return;
  const edge = tableEdgeAt(e.clientX, e.clientY, e.target);
  body.classList.toggle('nb-col-edge', !!edge);
  if (!edge) { tableGuide.hidden = true; return; }
  const cells = edge.table.rows[0].cells;
  paintGuide(edge.table, cells[Math.min(edge.index, cells.length - 1)].getBoundingClientRect().right);
}

function startTableResize(start, edge) {
  const { table, index, outer } = edge;
  const widths = [...table.rows[0].cells].map(c => c.getBoundingClientRect().width);
  const total = table.getBoundingClientRect().width;
  const avail = availWidth(table);
  const n = widths.length;
  const savedGroup = colGroup(table);
  const savedStyle = table.getAttribute('style');
  let preview = null;
  let result = null;
  tableResize = { table };
  closeTableCtx();
  paintTableGrips();
  document.body.classList.add('nb-col-resizing');
  trackPointer(body, start, {
    move(e) {
      const dx = e.clientX - start.clientX;
      if (!result && Math.abs(dx) < 2) return;
      if (outer) {
        const px = clamp(total + dx, Math.min(avail, Math.max(n * COL_MIN_PX, avail * TABLE_MIN_SHARE / 100)), avail);
        let share = Math.round(px / avail * 1000) / 10;
        if (share > 98.5) share = 100;
        result = { share };
        if (share >= 100) table.style.removeProperty('width');
        else table.style.width = `${share}%`;
        paintGuide(table, table.getBoundingClientRect().right, share >= 100 ? 'Ancho completo' : `${Math.round(share)} % de la hoja`);
      } else {
        const pair = widths[index] + widths[index + 1];
        const min = Math.min(COL_MIN_PX, pair / 2);
        const left = clamp(widths[index] + dx, min, pair - min);
        const px = widths.slice();
        px[index] = left;
        px[index + 1] = pair - left;
        result = { shares: px.map(w => w / total * 100) };
        if (!preview) {
          if (savedGroup) savedGroup.remove();
          preview = h('colgroup');
          table.prepend(preview);
        }
        preview.replaceChildren(...result.shares.map(w => h('col', { style: `width: ${w}%` })));
        paintGuide(table, table.rows[0].cells[index].getBoundingClientRect().right);
      }
    },
    end(commit) {
      // Lo de la vista previa se deshace: el cambio de verdad entra por editTable, con su Ctrl+Z.
      if (preview) {
        preview.remove();
        if (savedGroup) table.prepend(savedGroup);
      }
      if (savedStyle === null) table.removeAttribute('style');
      else table.setAttribute('style', savedStyle);
      tableResize = null;
      document.body.classList.remove('nb-col-resizing');
      tableGuide.hidden = true;
      delete tableGuide.dataset.label;
      if (commit && result && body.contains(table)) {
        const caret = caretCell();
        const cell = caret && caret.closest('table') === table ? caret : table.rows[0].cells[outer ? 0 : index];
        editTable((copy, row, col) => {
          if (outer) setTableShare(copy, result.share);
          else setColWidths(copy, result.shares);
          return [row, col];
        }, cell);
      }
      paintTableGrips();
    },
  });
}

body.addEventListener('pointermove', hoverTableEdge);
body.addEventListener('pointerleave', () => {
  if (tableResize) return;
  body.classList.remove('nb-col-edge');
  tableGuide.hidden = true;
});
body.addEventListener('pointerdown', e => {
  if (e.button !== 0 || !e.isPrimary || e.pointerType === 'touch' || tableResize || imgGesture) return;
  const edge = tableEdgeAt(e.clientX, e.clientY, e.target);
  if (!edge) return;
  e.preventDefault();
  startTableResize(e, edge);
});
// Agarrar el borde no debe poner el cursor ni empezar a seleccionar texto.
body.addEventListener('mousedown', e => { if (tableResize) e.preventDefault(); });
body.addEventListener('dblclick', e => {
  const edge = tableEdgeAt(e.clientX, e.clientY, e.target);
  if (!edge) return;
  e.preventDefault();
  const cell = edge.table.rows[0].cells[edge.outer ? 0 : edge.index];
  if (edge.outer) fullWidthTable(cell);
  else equalizeColumns(cell);
});

// Clic derecho en una celda: las opciones de la tabla. Con texto seleccionado, o con Mayús, el menú de siempre.
body.addEventListener('contextmenu', e => {
  const el = e.target.nodeType === Node.ELEMENT_NODE ? e.target : e.target.parentElement;
  const cell = el && el.closest('td, th');
  if (!cell || !body.contains(cell) || e.shiftKey) return;
  const sel = getSelection();
  if (sel.rangeCount && !sel.isCollapsed && cell.contains(sel.getRangeAt(0).commonAncestorContainer)) return;
  e.preventDefault();
  openTableCtx(cell, 'all', { x: e.clientX, y: e.clientY });
});

for (const [grip, scope] of [[gripRow, 'row'], [gripCol, 'col']]) {
  grip.addEventListener('mousedown', e => e.preventDefault());
  grip.addEventListener('click', () => toggleGripMenu(scope, grip));
}
tableCtx.addEventListener('mousedown', e => e.preventDefault());
tableCtx.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('pointerdown', e => {
  if (!tableCtx.hidden && !tableCtx.contains(e.target) && !gripRow.contains(e.target) && !gripCol.contains(e.target)) closeTableCtx();
}, true);
document.addEventListener('keydown', e => {
  if (tableCtx.hidden) return;
  if (e.key === 'Escape') e.preventDefault();
  closeTableCtx();
}, true);
$('pageScroller').addEventListener('scroll', () => { closeTableCtx(); paintTableGrips(); });
window.addEventListener('resize', () => { closeTableCtx(); paintTableGrips(); });
body.addEventListener('input', paintTableGrips);
new ResizeObserver(paintTableGrips).observe(body);

// Tab y Mayús+Tab pasan de celda en celda; Tab en la última agrega una fila, como en Word.
// Enter al principio de una tabla que está arriba del todo abre una línea encima para escribir.
// Ctrl+Enter agrega una fila debajo; Ctrl+Mayús+Retroceso elimina la del cursor.
function tableKey(e) {
  if (e.defaultPrevented || e.isComposing || picker) return;
  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const cell = caretCell();
    if (!cell) return;
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); insertRow(true, cell); }
    else if (e.key === 'Backspace' && e.shiftKey) { e.preventDefault(); deleteRow(cell); }
    return;
  }
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Backspace') { backspaceAfterTable(e); return; }
  const cell = (e.key === 'Tab' || e.key === 'Enter') && caretCell();
  if (!cell) return;
  const table = cell.closest('table');
  if (e.key === 'Tab') {
    const cells = [...table.querySelectorAll('td, th')];
    const next = cells[cells.indexOf(cell) + (e.shiftKey ? -1 : 1)];
    // En la primera celda, Mayús+Tab sigue su curso y saca el foco del texto.
    if (!next && e.shiftKey) return;
    e.preventDefault();
    if (next) caretInto(next, 'select');
    else editTable((copy, row) => { addRow(copy, row, true); return [row + 1, 0]; });
    return;
  }
  if (e.shiftKey || cell !== table.rows[0].cells[0]) return;
  const prev = table.previousElementSibling;
  if (table.parentNode !== body || (prev && prev.tagName !== 'TABLE')) return;
  const range = selectionRange();
  if (!range.collapsed || !caretAtStart(cell, range)) return;
  e.preventDefault();
  const line = h('p', {}, h('br'));
  table.before(line);
  caretInto(line);
  markDirty();
  paintEmptyBody();
}

// Chrome, al borrar hacia atrás al principio de la línea que sigue a una tabla, le quita el párrafo
// (y con él su marcador) o deja el cursor suelto fuera de cualquier línea. Aquí se entra a la última
// celda; si la línea está vacía y no es la última de la hoja, además se borra.
function backspaceAfterTable(e) {
  const range = selectionRange();
  if (!range || !range.collapsed) return;
  const block = caretBlock(range);
  const table = block && block.previousSibling;
  if (!table || table.nodeName !== 'TABLE' || !caretAtStart(block, range)) return;
  e.preventDefault();
  if (block.nextSibling && [...block.childNodes].every(node => node.nodeName === 'BR')) {
    const line = document.createRange();
    line.selectNode(block);
    restoreSelection(line);
    document.execCommand('delete');
  }
  const last = table.rows[table.rows.length - 1];
  if (last && last.cells.length) caretInto(last.cells[last.cells.length - 1], 'end');
}

/* ---------- Checklist ---------- */

const checkView = $('checkView');
const ICON_CHECKLIST = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="4" height="4" rx="1"/><rect x="2" y="9.5" width="4" height="4" rx="1"/><path d="M9 4.5h5M9 11.5h5"/></svg>';
const ICON_TEXT = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>';

const cleanLine = text => text.replace(/\s+/g, ' ').trim();
const checkItem = (text, done = false) => ({ id: uuid(), text, done });
const checkTexts = page => page.checklist.map(item => cleanLine(item.text)).filter(Boolean);

// Bloques, viñetas y <br> separan líneas; las líneas vacías no cuentan.
// Cada fila de una tabla es una línea, con sus celdas separadas por " · ".
function htmlLines(html) {
  const lines = [];
  let line = '';
  const breakLine = () => {
    const text = cleanLine(line);
    if (text) lines.push(text);
    line = '';
  };
  const walk = node => {
    for (const child of node.childNodes) {
      if (child.nodeType === Node.TEXT_NODE) line += child.data;
      else if (child.nodeType !== Node.ELEMENT_NODE) continue;
      else if (child.tagName === 'BR') breakLine();
      else if (INLINE_TAGS.has(child.tagName)) walk(child);
      else if (child.tagName === 'TR') {
        breakLine();
        line = [...child.children].map(flatText).filter(Boolean).join(' · ');
        breakLine();
      }
      else {
        breakLine();
        walk(child);
        breakLine();
      }
    }
  };
  walk(new DOMParser().parseFromString(String(html || ''), 'text/html').body);
  breakLine();
  return lines;
}

function pageText(page) {
  return page.mode === 'check' ? checkTexts(page).join(' ') : noteText(page.html);
}

// Antes la lista vivía aparte del texto: se unen en el checklist, sin perder marcas.
function settleMode(page) {
  if (page.mode === 'text' || page.mode === 'check') return false;
  page.checklist = Array.isArray(page.checklist) ? page.checklist : [];
  page.mode = page.checklist.length ? 'check' : 'text';
  if (page.mode === 'check') {
    page.checklist = [...htmlLines(page.html).map(text => checkItem(text)), ...page.checklist];
    page.text = pageText(page);
  }
  return true;
}

function saveChecklist() {
  const page = currentPage();
  page.text = pageText(page);
  page.updatedAt = Date.now();
  putPage(page);
  paintDate();
  renderPages();
}

// El texto original sigue en page.html y la lista en page.checklist: por eso ir y volver no pierde nada.
function toChecklist() {
  flush();
  const page = currentPage();
  const known = [...page.checklist];
  page.checklist = htmlLines(page.html).map(text => {
    const index = known.findIndex(item => cleanLine(item.text) === text);
    return index < 0 ? checkItem(text) : { ...known.splice(index, 1)[0], text };
  });
  page.mode = 'check';
  saveChecklist();
  paintMode(page.checklist.length ? null : { add: true });
}

function toText() {
  flush();
  const page = currentPage();
  const texts = checkTexts(page);
  if (JSON.stringify(texts) !== JSON.stringify(htmlLines(page.html))) {
    if (/<(b|strong|i|em|u|h2|h3|ul|ol|span|font|a|table)\b/i.test(page.html)) toast('La lista cambió: el texto vuelve sin formato, enlaces ni tablas');
    page.html = texts.map(text => h('p', { text }).outerHTML).join('');
  }
  body.innerHTML = sanitizeNote(page.html);
  paintEmptyBody();
  page.mode = 'text';
  saveChecklist();
  paintMode();
}

function paintMode(focus) {
  const isCheck = currentPage().mode === 'check';
  body.hidden = isCheck;
  checkView.hidden = !isCheck;
  const btn = $('btnCheck');
  btn.innerHTML = `${isCheck ? ICON_TEXT : ICON_CHECKLIST}<span>${isCheck ? 'Texto libre' : 'Checklist'}</span>`;
  btn.title = isCheck ? 'Volver al texto, una línea por elemento' : 'Convertir cada línea en un elemento';
  updateBar();
  if (isCheck) renderChecklist(focus);
  else checkView.replaceChildren();
}

function focusEditor() {
  if (currentPage().mode === 'check') {
    checkView.querySelector('.nb-check-new').focus({ preventScroll: true });
    return;
  }
  body.focus({ preventScroll: true });
  const sel = getSelection();
  sel.selectAllChildren(body);
  sel.collapseToEnd();
}

// `focus`: { id, at } lleva el cursor a esa fila; { add: true }, a la de agregar.
function renderChecklist(focus) {
  const page = currentPage();
  const rows = page.checklist.map(item => {
    const check = h('input', {
      type: 'checkbox',
      checked: item.done,
      'aria-label': `Marcar ${item.text}`,
      onchange: e => {
        item.done = e.target.checked;
        row.classList.toggle('done', item.done);
        saveChecklist();
      },
    });
    const remove = h('button', {
      class: 'nb-icon danger',
      text: '×',
      title: 'Eliminar elemento',
      'aria-label': `Eliminar ${item.text}`,
      onclick: () => {
        page.checklist = page.checklist.filter(i => i !== item);
        saveChecklist();
        renderChecklist();
      },
    });
    const grow = h('div', { class: 'nb-check-grow', 'data-value': item.text });
    grow.append(h('textarea', {
      class: 'nb-check-text',
      rows: 1,
      'aria-label': 'Texto del elemento',
      value: item.text,
      oninput: e => {
        item.text = e.target.value;
        grow.dataset.value = item.text;
        check.setAttribute('aria-label', `Marcar ${item.text}`);
        remove.setAttribute('aria-label', `Eliminar ${item.text}`);
        markDirty();
      },
      onkeydown: e => {
        if (e.isComposing) return;
        const index = page.checklist.indexOf(item);
        if (e.key === 'Enter') {
          e.preventDefault();
          const { selectionStart: start, selectionEnd: end, value } = e.target;
          item.text = value.slice(0, start);
          const next = checkItem(value.slice(end));
          page.checklist.splice(index + 1, 0, next);
          saveChecklist();
          renderChecklist({ id: next.id, at: 0 });
        } else if (e.key === 'Backspace' && !e.target.value) {
          e.preventDefault();
          page.checklist.splice(index, 1);
          saveChecklist();
          const previous = page.checklist[index - 1];
          renderChecklist(previous ? { id: previous.id, at: previous.text.length } : { add: true });
        }
      },
    }));
    const row = h('li', { class: item.done ? 'done' : null, 'data-id': item.id }, check, grow, remove);
    return row;
  });
  const add = h('input', {
    class: 'nb-check-new',
    placeholder: 'Agregar elemento...',
    'aria-label': 'Agregar elemento',
    onkeydown: e => {
      if (e.isComposing || e.key !== 'Enter') return;
      e.preventDefault();
      const text = cleanLine(add.value);
      if (!text) return;
      page.checklist.push(checkItem(text));
      saveChecklist();
      renderChecklist({ add: true });
    },
  });
  checkView.replaceChildren(h('ul', {}, ...rows), h('div', { class: 'nb-check-add' }, h('span', { class: 'nb-check-sign', text: '+', 'aria-hidden': 'true' }), add));
  if (focus && focus.add) add.focus();
  else if (focus) {
    const field = checkView.querySelector(`li[data-id="${focus.id}"] .nb-check-text`);
    field.focus();
    field.setSelectionRange(focus.at, focus.at);
  }
}

// Pegar varias líneas crea un elemento por línea; una sola se pega como cualquier texto.
function pasteLines(e) {
  const field = e.target;
  if (!field.matches('.nb-check-text, .nb-check-new')) return;
  const lines = e.clipboardData.getData('text/plain').split(/\r?\n/).map(cleanLine).filter(Boolean);
  if (lines.length < 2) return;
  e.preventDefault();
  const page = currentPage();
  lines[0] = field.value.slice(0, field.selectionStart) + lines[0];
  lines[lines.length - 1] += field.value.slice(field.selectionEnd);
  const row = field.closest('li');
  if (!row) {
    page.checklist.push(...lines.map(text => checkItem(text)));
    saveChecklist();
    renderChecklist({ add: true });
    return;
  }
  const item = page.checklist.find(i => i.id === row.dataset.id);
  item.text = lines[0];
  const added = lines.slice(1).map(text => checkItem(text));
  page.checklist.splice(page.checklist.indexOf(item) + 1, 0, ...added);
  saveChecklist();
  const last = added[added.length - 1];
  renderChecklist({ id: last.id, at: last.text.length });
}

/* ---------- Imágenes ---------- */

const IMAGE_MAX_WIDTH = 1600;
const IMAGE_MAX_HEIGHT = 8000;
const IMAGE_QUALITY = .88;
const IMAGE_MIN_WIDTH = 32;
const IMAGE_START_SHARE = .6;
const IMAGE_DRAG_TOLERANCE = 4;
const IMAGE_NUDGE = 10;

const scroller = $('pageScroller');
const imgLayer = $('imgLayer');
const imgBadges = $('imgBadges');
const imgFrame = $('imgFrame');
const imgTools = $('imgTools');
const imageUrls = new Map();  // id → promesa de la URL temporal, solo de la página abierta
const imageEntries = new WeakMap();  // elemento → su registro en page.images
const imageBadges = new WeakMap();  // registro → el distintivo de su enlace
let selectedImg = null;
let imgGesture = false;
let imageZ = 0;

const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const isNoteImage = node => node.nodeType === Node.ELEMENT_NODE && node.matches('img[data-img]');
const imageFiles = data => [...data.files].filter(file => IMAGE_TYPES.has(file.type));

// Una imagen puede llevar a otra página (y a uno de sus marcadores), igual que un enlace del texto.
function cleanImageLink(link) {
  if (!link || typeof link !== 'object' || !PAGE_ID.test(String(link.page || ''))) return null;
  return PAGE_ID.test(String(link.mark || '')) ? { page: link.page, mark: link.mark } : { page: link.page };
}

// `x` y `size` son porcentajes del ancho de la hoja; `y` son píxeles desde su borde superior.
function cleanEntries(list) {
  const entries = [];
  for (const item of Array.isArray(list) ? list : []) {
    if (!item || !IMAGE_ID.test(item.id)) continue;
    const size = Number(item.size);
    const safeSize = Number.isFinite(size) ? clamp(size, 1, 100) : 40;
    const link = cleanImageLink(item.link);
    entries.push({
      id: item.id,
      size: safeSize,
      x: clamp(Number(item.x) || 0, 0, 100 - safeSize),
      y: Math.max(0, Number(item.y) || 0),
      w: validSide(item.w) || 0,
      h: validSide(item.h) || 0,
      ...(link ? { link } : {}),
    });
  }
  return entries;
}

// Las primeras imágenes se guardaron dentro del texto: pasan a la capa, sin perder ninguna.
function liftInlineImages(html) {
  const doc = new DOMParser().parseFromString(String(html || ''), 'text/html');
  return cleanEntries([...doc.querySelectorAll('img[data-img]')].map((img, index) => {
    const size = parseFloat(img.style.width) || 40;
    const align = img.getAttribute('data-align');
    return {
      id: img.getAttribute('data-img'),
      size,
      x: align === 'left' ? 0 : align === 'right' ? 100 - size : (100 - size) / 2,
      y: 16 + index * 32,
      w: img.getAttribute('width'),
      h: img.getAttribute('height'),
    };
  }));
}

function upgradePage(page) {
  const lifted = liftInlineImages(page.html);
  page.images = [...cleanEntries(page.images), ...lifted];
  if (lifted.length) page.html = sanitizeNote(page.html);
  const settled = settleMode(page);
  return lifted.length > 0 || settled;
}

// Lo pegado se reduce y comprime: una captura ocupa poco y se sigue leyendo bien.
async function prepareImage(file) {
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, IMAGE_MAX_WIDTH / bitmap.width, IMAGE_MAX_HEIGHT / bitmap.height);
  const width = Math.max(1, Math.round(bitmap.width * scale));
  const height = Math.max(1, Math.round(bitmap.height * scale));
  let blob = file;
  // Volver a codificar un GIF le quitaría la animación.
  if (file.type !== 'image/gif') {
    const canvas = h('canvas', { width, height });
    const context = canvas.getContext('2d');
    context.imageSmoothingQuality = 'high';
    context.drawImage(bitmap, 0, 0, width, height);
    const encoded = await new Promise(resolve => canvas.toBlob(resolve, 'image/webp', IMAGE_QUALITY));
    if (encoded && (scale < 1 || encoded.size < file.size)) blob = encoded;
  }
  bitmap.close();
  return { id: uuid(), blob: new Blob([blob], { type: blob.type }), width, height };
}

// Una imagen pequeña no se estira y una grande no tapa toda la hoja al llegar.
function placeImage(page, { id, width, height }, at) {
  const sheet = imgLayer.clientWidth || 1;
  const ratio = width / height;
  const shown = clamp(Math.min(width / devicePixelRatio, sheet * IMAGE_START_SHARE, scroller.clientHeight * .8 * ratio), IMAGE_MIN_WIDTH, Math.max(IMAGE_MIN_WIDTH, sheet));
  const size = clamp(shown / sheet * 100, 1, 100);
  let top = at ? at.y - shown / ratio / 2 : scroller.scrollTop + 16;
  // Dos imágenes pegadas seguidas no deben quedar una justo encima de la otra.
  if (!at) while (page.images.some(entry => Math.abs(entry.y - top) < 1)) top += 24;
  const left = at ? at.x - shown / 2 : (sheet - shown) / 2;
  return { id, size, x: clamp(left / sheet * 100, 0, 100 - size), y: Math.max(0, top), w: width, h: height };
}

function addImages(page, entries) {
  page.images.push(...entries);
  if (currentPage() !== page) {
    page.updatedAt = Date.now();
    putPage(page);
    renderPages();
    return;
  }
  renderImages();
  markDirty();
  const last = [...imgLayer.children].pop();
  selectImage(last);
  last.scrollIntoView({ block: 'nearest' });
  updateImageFrame();
}

async function insertImages(files, at) {
  const page = currentPage();
  if (!page) return;
  const entries = [];
  for (const file of files) {
    try {
      const image = await prepareImage(file);
      if (await writeTx(['images'], s => s('images').put(image))) entries.push(placeImage(page, image, at));
    } catch (e) {
      toast('No se pudo leer esa imagen');
    }
  }
  if (entries.length) addImages(page, entries);
}

// Una imagen copiada dentro de Notas viaja como referencia a su almacén.
function copiedImages(html) {
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const page = currentPage();
  const entries = [];
  for (const img of doc.querySelectorAll('img[data-img]')) {
    const id = img.getAttribute('data-img');
    const width = validSide(img.getAttribute('width'));
    const height = validSide(img.getAttribute('height'));
    if (!IMAGE_ID.test(id) || !width || !height) continue;
    const entry = placeImage({ images: [...page.images, ...entries] }, { id, width, height });
    const link = cleanImageLink({ page: img.getAttribute('data-link-page'), mark: img.getAttribute('data-link-mark') });
    if (link) entry.link = link;
    entries.push(entry);
  }
  return entries;
}

function imageUrl(id) {
  if (!imageUrls.has(id)) {
    const url = getImage(id).then(record => (record ? URL.createObjectURL(record.blob) : null));
    url.catch(() => imageUrls.delete(id));
    imageUrls.set(id, url);
  }
  return imageUrls.get(id);
}

function releaseImageUrls() {
  for (const url of imageUrls.values()) url.then(value => { if (value) URL.revokeObjectURL(value); }).catch(() => {});
  imageUrls.clear();
}

function paintImage(img, entry) {
  img.style.left = `${entry.x}%`;
  img.style.top = `${entry.y}px`;
  img.style.width = `${entry.size}%`;
  const badge = imageBadges.get(entry);
  if (badge && badge.isConnected) paintBadge(badge, entry);
}

function paintBadge(badge, entry) {
  badge.style.left = `calc(${entry.x}% + 6px)`;
  badge.style.top = `${entry.y + 6}px`;
}

// Un distintivo por imagen enlazada de la página abierta; en gris si la página de destino ya no existe.
function paintImageBadges() {
  const page = currentPage();
  imgBadges.replaceChildren(...(page ? page.images : []).filter(entry => entry.link).map(entry => {
    const badge = h('span', { class: `nb-img-badge${pages.has(entry.link.page) ? '' : ' nb-img-badge-broken'}` });
    badge.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5l3-3M7.2 4.3l.9-.9a2.8 2.8 0 0 1 4 4l-.9.9M8.8 11.7l-.9.9a2.8 2.8 0 0 1-4-4l.9-.9"/></svg>';
    imageBadges.set(entry, badge);
    paintBadge(badge, entry);
    return badge;
  }));
}

function renderImages() {
  const page = currentPage();
  selectImage(null);
  imgLayer.replaceChildren(...(page ? page.images : []).map(entry => {
    const img = h('img', { class: 'nb-img', 'data-img': entry.id, alt: 'Imagen', width: entry.w || null, height: entry.h || null });
    imageEntries.set(img, entry);
    paintImage(img, entry);
    imageUrl(entry.id).then(url => {
      if (!img.isConnected) return;
      if (url) {
        img.src = url;
      } else {
        // Referencia a una imagen que no existe, por ejemplo de una copia manipulada.
        page.images.splice(page.images.indexOf(entry), 1);
        img.remove();
        markDirty();
        paintImageBadges();
        updateImageFrame();
      }
    }).catch(() => {});
    return img;
  }));
  paintImageBadges();
}

// Solo al arrancar: mientras la app está abierta, "Deshacer" aún puede devolver una imagen.
async function sweepImages() {
  const used = new Set();
  for (const page of pages.values()) page.images.forEach(entry => used.add(entry.id));
  const ids = await new Promise((resolve, reject) => {
    const req = db.transaction('images').objectStore('images').getAllKeys();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  const orphans = ids.filter(id => !used.has(id));
  if (orphans.length) await writeTx(['images'], s => orphans.forEach(id => s('images').delete(id)));
}

function selectImage(img) {
  if (selectedImg !== img) {
    if (selectedImg) selectedImg.classList.remove('nb-img-on');
    selectedImg = img;
    if (img) {
      img.classList.add('nb-img-on');
      hideBubble();  // su barra muestra lo mismo: nunca las dos a la vez
      // El foco sigue en el texto: pegar y escribir funcionan como siempre.
      body.focus({ preventScroll: true });
      const sel = getSelection();
      if (sel.rangeCount && !sel.isCollapsed) sel.collapseToEnd();
    }
  }
  updateImageFrame();
}

function updateImageFrame() {
  if (selectedImg && !imgLayer.contains(selectedImg)) selectedImg = null;
  const img = selectedImg;
  const rect = img && img.getBoundingClientRect();
  const area = scroller.getBoundingClientRect();
  const visible = !!img && rect.bottom > area.top && rect.top < area.bottom;
  imgFrame.hidden = !visible;
  imgTools.hidden = !visible || img.classList.contains('nb-img-moving');
  if (!visible) return;
  // Se recorta a la hoja para que el marco no pase por encima del título al desplazar.
  Object.assign(imgFrame.style, {
    left: `${rect.left}px`,
    top: `${rect.top}px`,
    width: `${rect.width}px`,
    height: `${rect.height}px`,
    clipPath: `inset(${Math.max(-12, area.top - rect.top)}px -12px ${Math.max(-12, rect.bottom - area.bottom)}px -12px)`,
  });
  if (imgTools.hidden) return;
  paintImageTools(imageEntries.get(img));
  const tools = imgTools.getBoundingClientRect();
  // Encima o debajo, para no tapar la imagen ni sus tiradores; dentro solo si la imagen llena la hoja.
  const above = rect.top - tools.height - 12;
  const below = rect.bottom + 12;
  const top = above >= area.top + 4 ? above
    : below + tools.height <= area.bottom - 4 ? below
    : Math.max(rect.top, area.top) + 12;
  imgTools.style.top = `${top}px`;
  imgTools.style.left = `${clamp(rect.left + rect.width / 2 - tools.width / 2, area.left + 4, Math.max(area.left + 4, area.right - tools.width - 4))}px`;
}

// Con una imagen enlazada elegida, su barra también deja abrir el destino o quitar el enlace.
function paintImageTools(entry) {
  const link = entry && entry.link;
  $('imgDest').hidden = $('imgOpen').hidden = $('imgUnlink').hidden = $('imgSep').hidden = !link;
  if (!link) return;
  const { dest, target } = describeLink(link.page, link.mark);
  $('imgDest').textContent = dest;
  $('imgOpen').disabled = !target;
}

// Al enlazar o desenlazar una imagen solo cambian su registro y su distintivo.
function afterImageLink() {
  markDirty();
  paintImageBadges();
  updateImageFrame();
}

function linkImage(entry, target, mark) {
  const page = currentPage();
  if (!page || !page.images.includes(entry)) { toast('Esa imagen ya no está en la página'); return; }
  entry.link = mark ? { page: target.id, mark: mark.id } : { page: target.id };
  afterImageLink();
  toast(`Imagen enlazada a ${linkLabel(target, mark)}`);
}

// Ctrl+Z no llega a las imágenes: el aviso trae su propio Deshacer.
function unlinkImage(entry) {
  const page = currentPage();
  if (!page || !entry.link) return;
  const link = entry.link;
  delete entry.link;
  afterImageLink();
  toast('Enlace de la imagen quitado', 'Deshacer', () => {
    if (!page.images.includes(entry) || entry.link) return;
    entry.link = link;
    if (currentPage() === page) {
      afterImageLink();
    } else if (pages.has(page.id)) {
      page.updatedAt = Date.now();
      putPage(page);
    }
  });
}

function deleteSelectedImage() {
  const img = selectedImg;
  const page = currentPage();
  if (!img || !page) return;
  const entry = imageEntries.get(img);
  const index = page.images.indexOf(entry);
  page.images.splice(index, 1);
  selectImage(null);
  img.remove();
  markDirty();
  paintImageBadges();
  toast('Imagen eliminada', 'Deshacer', () => {
    page.images.splice(Math.min(index, page.images.length), 0, entry);
    if (currentPage() === page) {
      renderImages();
      markDirty();
    } else if (pages.has(page.id)) {
      page.updatedAt = Date.now();
      putPage(page);
      renderPages();
    }
  });
}

function nudgeImage(img, dx, dy) {
  const entry = imageEntries.get(img);
  entry.x = clamp(entry.x + dx / imgLayer.clientWidth * 100, 0, 100 - entry.size);
  entry.y = Math.max(0, entry.y + dy);
  paintImage(img, entry);
  markDirty();
  img.scrollIntoView({ block: 'nearest' });
  updateImageFrame();
}

// Sigue un gesto hasta el final, aunque el puntero salga de la hoja o del marco del lanzador.
function trackPointer(target, start, { move, end }) {
  const id = start.pointerId;
  let done = false;
  const finish = commit => {
    if (done) return;
    done = true;
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onCancel);
    window.removeEventListener('keydown', onKey, true);
    window.removeEventListener('blur', onCancel);
    target.removeEventListener('lostpointercapture', onUp);
    try { target.releasePointerCapture(id); } catch (e) { /* ya liberado */ }
    imgGesture = false;
    end(commit);
  };
  function onMove(e) {
    if (e.pointerId !== id) return;
    // Se soltó donde esta página no pudo enterarse.
    if (e.pointerType === 'mouse' && e.buttons === 0) { finish(true); return; }
    move(e);
  }
  function onUp(e) { if (e.pointerId === id) finish(true); }
  function onCancel() { finish(false); }
  function onKey(e) {
    if (e.key !== 'Escape') return;
    e.preventDefault();
    e.stopPropagation();
    finish(false);
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onCancel);
  window.addEventListener('keydown', onKey, true);
  window.addEventListener('blur', onCancel);
  target.addEventListener('lostpointercapture', onUp);
  try { target.setPointerCapture(id); } catch (e) { /* el puntero ya no existe */ }
  imgGesture = true;
}

// La imagen sigue al puntero sin tocar el texto. Lo arrastrado queda encima de las demás.
function pressImage(start, img) {
  const page = currentPage();
  const entry = imageEntries.get(img);
  const original = { x: entry.x, y: entry.y };
  const rect = img.getBoundingClientRect();
  const grabX = start.clientX - rect.left;
  const grabY = start.clientY - rect.top;
  let moving = false;
  let pointerX = start.clientX;
  let pointerY = start.clientY;
  let frame = 0;
  const place = () => {
    const sheet = imgLayer.getBoundingClientRect();
    entry.x = clamp((pointerX - grabX - sheet.left) / sheet.width * 100, 0, 100 - entry.size);
    entry.y = Math.max(0, pointerY - grabY - sheet.top);
    paintImage(img, entry);
    updateImageFrame();
  };
  const autoScroll = () => {
    const area = scroller.getBoundingClientRect();
    const speed = pointerY < area.top + DRAG_SCROLL_EDGE ? -8 : pointerY > area.bottom - DRAG_SCROLL_EDGE ? 8 : 0;
    if (speed) {
      scroller.scrollTop += speed;
      place();
    }
    frame = requestAnimationFrame(autoScroll);
  };
  trackPointer(img, start, {
    move(e) {
      pointerX = e.clientX;
      pointerY = e.clientY;
      if (!moving) {
        if (Math.hypot(pointerX - start.clientX, pointerY - start.clientY) <= IMAGE_DRAG_TOLERANCE) return;
        moving = true;
        // Mientras dura el gesto la hoja conserva su altura: subir la imagen no debe mover lo que ves.
        imgLayer.style.height = `${scroller.scrollHeight}px`;
        img.classList.add('nb-img-moving');
        img.style.zIndex = ++imageZ;
        document.body.classList.add('nb-sorting');
        frame = requestAnimationFrame(autoScroll);
      }
      place();
    },
    end(commit) {
      if (!moving) return;
      cancelAnimationFrame(frame);
      imgLayer.style.height = '';
      img.classList.remove('nb-img-moving');
      document.body.classList.remove('nb-sorting');
      if (commit) {
        page.images.splice(page.images.indexOf(entry), 1);
        page.images.push(entry);
        if (entry.x !== original.x || entry.y !== original.y) markDirty();
      } else {
        Object.assign(entry, original);
        paintImage(img, entry);
      }
      updateImageFrame();
    },
  });
}

// La esquina contraria se queda quieta y la imagen no se sale de la hoja.
function startImageResize(start, handle) {
  const img = selectedImg;
  const entry = imageEntries.get(img);
  const original = { x: entry.x, y: entry.y, size: entry.size };
  const rect = img.getBoundingClientRect();
  const sheet = imgLayer.getBoundingClientRect();
  const west = handle.dataset.corner.endsWith('w');
  const north = handle.dataset.corner.startsWith('n');
  const ratio = rect.width / rect.height;
  const left = rect.left - sheet.left;
  const right = rect.right - sheet.left;
  const top = rect.top - sheet.top;
  const bottom = rect.bottom - sheet.top;
  const max = Math.max(IMAGE_MIN_WIDTH, Math.min(west ? right : sheet.width - left, north ? bottom * ratio : Infinity));
  trackPointer(handle, start, {
    move(e) {
      const outX = (e.clientX - start.clientX) * (west ? -1 : 1);
      const outY = (e.clientY - start.clientY) * (north ? -1 : 1) * ratio;
      const width = clamp(rect.width + (Math.abs(outX) >= Math.abs(outY) ? outX : outY), IMAGE_MIN_WIDTH, max);
      entry.size = clamp(width / sheet.width * 100, 1, 100);
      entry.x = clamp((west ? right - width : left) / sheet.width * 100, 0, 100);
      entry.y = Math.max(0, north ? bottom - width / ratio : top);
      paintImage(img, entry);
      updateImageFrame();
    },
    end(commit) {
      if (!commit) {
        Object.assign(entry, original);
        paintImage(img, entry);
      } else if (entry.size !== original.size) {
        markDirty();
      }
      updateImageFrame();
    },
  });
}

imgLayer.addEventListener('pointerdown', e => {
  if (!isNoteImage(e.target)) return;
  const img = e.target;
  if (e.pointerType === 'mouse') selectImage(img);
  // En táctil, arrastrar sobre una imagen sin seleccionar es desplazar la página.
  if (e.button === 0 && e.isPrimary && !imgGesture && selectedImg === img) pressImage(e, img);
});
imgLayer.addEventListener('mousedown', e => { if (e.button === 0 && isNoteImage(e.target)) e.preventDefault(); });
imgLayer.addEventListener('click', e => { if (isNoteImage(e.target)) selectImage(e.target); });
imgLayer.addEventListener('dragstart', e => e.preventDefault());
imgLayer.addEventListener('load', updateImageFrame, true);
scroller.addEventListener('scroll', updateImageFrame);
window.addEventListener('resize', updateImageFrame);
new ResizeObserver(updateImageFrame).observe(scroller);

// Una imagen puede alargar la hoja más allá del texto: un clic ahí sigue llevando a escribir.
scroller.addEventListener('click', e => {
  if (e.target === scroller) focusEditor();
});

imgFrame.addEventListener('mousedown', e => e.preventDefault());
imgFrame.addEventListener('pointerdown', e => {
  if (e.target.dataset.corner && e.button === 0 && selectedImg && !imgGesture) startImageResize(e, e.target);
});
imgTools.addEventListener('mousedown', e => e.preventDefault());
$('imgDelete').addEventListener('click', deleteSelectedImage);
$('imgOpen').addEventListener('click', () => {
  const entry = selectedImg && imageEntries.get(selectedImg);
  if (entry && entry.link) goToPage(entry.link.page, true, entry.link.mark);
});
$('imgUnlink').addEventListener('click', () => {
  const entry = selectedImg && imageEntries.get(selectedImg);
  if (entry) unlinkImage(entry);
});

// La imagen sigue elegida mientras se enlaza: el botón de la barra y el buscador son para ella.
const linkingImage = target => btnLink.contains(target) || linkPicker.contains(target);
document.addEventListener('pointerdown', e => {
  if (selectedImg && e.target !== selectedImg && !imgFrame.contains(e.target) && !imgTools.contains(e.target) && !linkingImage(e.target)) selectImage(null);
}, true);
document.addEventListener('focusin', e => {
  if (selectedImg && e.target !== body && !imgTools.contains(e.target) && !linkingImage(e.target)) selectImage(null);
});
document.addEventListener('keydown', e => {
  // Con el buscador abierto, las flechas y las letras son suyas, no de la imagen.
  if (!selectedImg || imgGesture || picker || e.key === 'Tab' || ['Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) return;
  const step = e.shiftKey ? 1 : IMAGE_NUDGE;
  const arrows = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if (e.key === 'Delete' || e.key === 'Backspace') {
    e.preventDefault();
    deleteSelectedImage();
  } else if (e.key === 'Escape') {
    e.preventDefault();
    selectImage(null);
  } else if (arrows[e.key]) {
    e.preventDefault();
    nudgeImage(selectedImg, ...arrows[e.key]);
  } else if (!imgTools.contains(document.activeElement) && !((e.ctrlKey || e.metaKey) && 'cxv'.includes(e.key.toLowerCase()))) {
    // Escribir deja de actuar sobre la imagen y sigue su curso normal.
    selectImage(null);
  }
}, true);

function copySelectedImage(e, cut) {
  if (!selectedImg) return;
  e.preventDefault();
  const entry = imageEntries.get(selectedImg);
  const link = entry.link ? ` data-link-page="${entry.link.page}"${entry.link.mark ? ` data-link-mark="${entry.link.mark}"` : ''}` : '';
  e.clipboardData.setData('text/html', `<img data-img="${entry.id}" width="${entry.w}" height="${entry.h}"${link}>`);
  if (cut) deleteSelectedImage();
}
document.addEventListener('copy', e => copySelectedImage(e, false));
document.addEventListener('cut', e => copySelectedImage(e, true));

/* ---------- Enlaces entre páginas ---------- */

const linkPicker = $('linkPicker');
const linkSearch = $('linkSearch');
const linkOptions = $('linkOptions');
const linkHead = $('linkHead');
const btnLink = $('btnLink');
const PICKER_RECENT = 8;
const PICKER_LIMIT = 20;
const PICKER_MAX_QUERY = 60;
const TRAIL_MAX = 50;
const BLOCK_TAGS = new Set(['P', 'DIV', 'LI', 'H2', 'H3', 'TD', 'TH']);

const pageName = page => page.title.trim() || 'Sin título';
const bookName = page => (books.get(page.notebookId) || { name: '' }).name;
const pagePlace = page => `${bookName(page)} › ${pageName(page)}`;

/* Marcadores: el id y el nombre viven en el propio bloque, así que no hay otra lista que mantener. */

const markCache = new Map();  // id de página → { html, marks }, para no releer páginas que no cambiaron

function readMarks(root) {
  const seen = new Set();
  const marks = [];
  for (const el of root.querySelectorAll('[data-mark-id]')) {
    const id = el.getAttribute('data-mark-id');
    if (seen.has(id) || !PAGE_ID.test(id)) continue;
    seen.add(id);
    marks.push({ id, name: el.getAttribute('data-mark-name') || 'Marcador', text: el.textContent.replace(/\s+/g, ' ').trim().slice(0, 80) });
  }
  return marks;
}

// La página abierta se lee del editor, tal como está ahora; las demás, de lo guardado.
function marksOf(page) {
  if (page.mode !== 'text') return [];
  if (page === currentPage()) return readMarks(body);
  const hit = markCache.get(page.id);
  if (hit && hit.html === page.html) return hit.marks;
  const marks = page.html.includes('data-mark-id') ? readMarks(new DOMParser().parseFromString(page.html, 'text/html').body) : [];
  markCache.set(page.id, { html: page.html, marks });
  return marks;
}

// Dentro de la misma página basta el nombre del marcador; desde otra, "Página › Marcador".
const linkLabel = (page, mark) => !mark ? pageName(page) : page.id === ui.pageId ? mark.name : `${pageName(page)} › ${mark.name}`;

// Adónde lleva un enlace, del texto o de una imagen, dicho para la burbuja.
function describeLink(pageId, markId) {
  const target = pages.get(pageId);
  const mark = target && markId ? marksOf(target).find(m => m.id === markId) || null : null;
  const lostMark = !!(target && markId && !mark);
  const dest = !target ? 'Esta página ya no existe'
    : mark ? `${pagePlace(target)} › ${mark.name}`
    : lostMark ? `${pagePlace(target)} (el marcador ya no existe: se abrirá la página)`
    : pagePlace(target);
  return { target, mark, lostMark, dest };
}

// El enlace guarda solo ids: el texto que se ve es siempre el actual, salvo si el texto es propio.
function paintLinks() {
  for (const link of body.querySelectorAll('a[data-page]')) {
    const { target, mark, lostMark, dest } = describeLink(link.dataset.page, link.dataset.mark);
    link.contentEditable = 'false';
    link.classList.toggle('nb-link-broken', !target);
    link.classList.toggle('nb-link-nomark', lostMark);
    // Adónde lleva, para la burbuja. No va en `title`: su tooltip taparía la burbuja. Al guardar se descarta.
    link.removeAttribute('title');
    link.dataset.dest = dest;
    // Sin su marcador, el enlace lleva a la página: muestra su título. Si el marcador vuelve, vuelve su nombre.
    if (target && !link.hasAttribute('data-own')) {
      const label = linkLabel(target, mark);
      if (link.textContent !== label) link.textContent = label;
    }
  }
}

function revealMark(markId) {
  const page = currentPage();
  const block = [...body.querySelectorAll('[data-mark-id]')].find(el => el.getAttribute('data-mark-id') === markId);
  if (!block || page.mode !== 'text') {
    toast(page.mode === 'text' ? 'Ese marcador ya no existe: se abrió la página' : 'La página está en modo checklist: el marcador no se ve');
    return;
  }
  // Si el editor tiene el foco, el cursor va al marcador: lo que escribas cae donde llegaste.
  if (document.activeElement === body) {
    const sel = getSelection();
    sel.removeAllRanges();
    const range = document.createRange();
    range.setStart(block, 0);
    sel.addRange(range);
  }
  block.scrollIntoView({ block: 'center' });
  block.classList.remove('nb-mark-flash');
  void block.offsetWidth;  // reinicia la animación si ya estaba en curso
  block.classList.add('nb-mark-flash');
  block.addEventListener('animationend', () => block.classList.remove('nb-mark-flash'), { once: true });
}

// Otra página apareció o desapareció sin cambiar la abierta: sus enlaces y backlinks se repintan.
function refreshLinks() {
  renderPages();
  paintLinks();
  renderBacklinks();
  paintTrail();
  paintImageBadges();
  updateImageFrame();
}

// Abre la página aunque esté en otro cuaderno. `remember` deja el botón para volver; `markId` lleva al marcador.
function goToPage(id, remember, markId) {
  const page = pages.get(id);
  if (!page) { toast('Esa página ya no existe'); return; }
  if (id === ui.pageId) {
    if (markId) revealMark(markId);
    else scroller.scrollTo({ top: 0 });
    return;
  }
  flush();
  if (remember && ui.pageId && ui.pageId !== id) {
    ui.trail.push(ui.pageId);
    if (ui.trail.length > TRAIL_MAX) ui.trail.shift();
  }
  ui.query = '';
  $('pageSearch').value = '';
  if (page.notebookId !== ui.bookId) {
    ui.bookId = page.notebookId;
    renderBooks();
  }
  showPage(id);
  if (markId) revealMark(markId);
}

function paintTrail() {
  const trail = ui.trail;
  while (trail.length && (!pages.has(trail[trail.length - 1]) || trail[trail.length - 1] === ui.pageId)) trail.pop();
  const back = pages.get(trail[trail.length - 1]);
  const btn = $('btnTrail');
  btn.hidden = !back;
  if (!back) return;
  btn.textContent = `← ${pageName(back)}`;
  btn.title = `Volver a ${pagePlace(back)}`;
  btn.setAttribute('aria-label', btn.title);
}

$('btnTrail').addEventListener('click', () => {
  const id = ui.trail.pop();
  if (id) goToPage(id, false);
});

// Si la página `p` enlaza a la página `id`, desde su texto o desde una imagen.
function linksTo(p, id) {
  return (p.mode === 'text' && p.html.includes(`data-page="${id}"`)) || p.images.some(i => i.link && i.link.page === id);
}

// Las demás páginas solo cambian cuando las editas, así que basta con calcularlo al abrir esta.
function renderBacklinks() {
  const page = currentPage();
  const box = $('backlinks');
  const from = page ? [...pages.values()]
    .filter(p => p.id !== page.id && linksTo(p, page.id))
    .sort((a, b) => b.updatedAt - a.updatedAt) : [];
  box.hidden = !from.length;
  if (!from.length) { box.replaceChildren(); return; }
  box.replaceChildren(
    h('h2', { text: 'Enlazado desde' }),
    h('ul', {}, ...from.map(p => h('li', {},
      h('button', { title: `Ir a ${pagePlace(p)}`, onclick: () => goToPage(p.id, true) },
        h('b', { text: pageName(p) }),
        h('small', { text: bookName(p) }),
      ),
    ))),
  );
}

body.addEventListener('click', e => {
  const link = e.target.closest('a[data-page]');
  if (!link || !body.contains(link)) return;
  e.preventDefault();
  // En táctil no hay "pasar por encima": el toque muestra la burbuja, y Abrir lleva a la página.
  if (lastPointer === 'touch') { showBubble(link); return; }
  hideBubble();
  goToPage(link.dataset.page, true, link.dataset.mark);
});

/* Buscador de páginas: con @ al escribir o con el botón de la barra. */

// { mode: 'inline', node, offset } marca dónde está la @; { mode: 'button', range } guarda la selección.
// `step`: 'pages' para elegir la página; 'marks' para elegir uno de sus marcadores (`page`).
// Con @, en el paso de marcadores filtra lo escrito desde `from`; con el botón, el campo, que se vacía al entrar.
let picker = null;
let pasting = false;

// Cada resultado es { page } en el primer paso y { page, mark } en el segundo (mark null: la página completa).
function linkResults(query) {
  const q = norm(query);
  // La página abierta solo sirve si tiene marcadores: para enlazar a uno de ellos.
  const all = [...pages.values()].filter(p => books.has(p.notebookId) && PAGE_ID.test(p.id) && (p.id !== ui.pageId || marksOf(p).length));
  const recent = (a, b) => b.updatedAt - a.updatedAt;
  if (!q) return all.sort(recent).slice(0, PICKER_RECENT).map(page => ({ page }));
  const scored = [];
  for (const p of all) {
    const title = norm(pageName(p));
    const rank = title.startsWith(q) ? 0 : title.includes(q) ? 1 : norm(`${bookName(p)} ${pageName(p)}`).includes(q) ? 2 : -1;
    if (rank >= 0) scored.push({ rank, p });
  }
  return scored.sort((a, b) => a.rank - b.rank || recent(a.p, b.p)).slice(0, PICKER_LIMIT).map(s => ({ page: s.p }));
}

function markResults(page, query) {
  const q = norm(query);
  const marks = marksOf(page).filter(m => !q || norm(m.name).includes(q) || norm(m.text).includes(q));
  return [{ page, mark: null }, ...marks.map(mark => ({ page, mark }))];
}

function optionContent({ page, mark }) {
  if (picker.step === 'marks') {
    return mark
      ? [h('b', { text: mark.name }), h('small', { text: mark.text || 'Bloque vacío' })]
      : [h('b', { text: 'Página completa' }), h('small', { text: 'Sin marcador: abre la página desde el inicio' })];
  }
  const count = marksOf(page).length;
  const where = page.id === ui.pageId ? `${bookName(page)} · esta página` : bookName(page);
  return [h('b', { text: pageName(page) }), h('small', { text: count ? `${where} · ${count} ${count === 1 ? 'marcador' : 'marcadores'} ›` : where })];
}

function paintPicker() {
  const { results } = picker;
  const marking = picker.step === 'marks';
  linkHead.hidden = !marking;
  if (marking) linkHead.replaceChildren(h('b', { text: pageName(picker.page) }), ' › elige un marcador (Esc para volver)');
  linkOptions.setAttribute('aria-label', marking ? 'Marcadores' : 'Páginas');
  linkOptions.replaceChildren(...(results.length ? results.map((entry, i) => h('li', {
    id: `linkOption${i}`,
    role: 'option',
    'aria-selected': 'false',
    onclick: () => choosePicker(i),
    onpointermove: () => { if (picker && picker.index !== i) { picker.index = i; markOption(false); } },
  }, ...optionContent(entry))) : [h('li', { class: 'nb-picker-empty', text: 'Sin resultados' })]));
  markOption(true);
}

function enterMarks(page) {
  picker.step = 'marks';
  picker.page = page;
  if (picker.mode === 'inline') {
    picker.from = (inlineQuery() || '').length;
    updateInline();
  } else {
    picker.pageQuery = linkSearch.value;
    linkSearch.value = '';
    searchPicker();
  }
}

function leaveMarks() {
  picker.step = 'pages';
  picker.page = null;
  if (picker.mode === 'inline') {
    updateInline();
  } else {
    linkSearch.value = picker.pageQuery || '';
    searchPicker();
  }
}

function markOption(reveal) {
  const options = linkOptions.querySelectorAll('[role="option"]');
  options.forEach((li, i) => li.setAttribute('aria-selected', String(i === picker.index)));
  const active = options[picker.index];
  if (active && reveal) active.scrollIntoView({ block: 'nearest' });
  const owner = picker.mode === 'inline' ? body : linkSearch;
  if (active) owner.setAttribute('aria-activedescendant', active.id);
  else owner.removeAttribute('aria-activedescendant');
}

function anchorRect() {
  if (picker.mode === 'button') return btnLink.getBoundingClientRect();
  const range = document.createRange();
  range.setStart(picker.node, picker.offset);
  range.setEnd(picker.node, picker.offset + 1);
  return range.getBoundingClientRect();
}

// Debajo de la @ o del botón; encima si abajo no cabe. Nunca fuera de la ventana.
function positionPicker() {
  if (!picker) return;
  if (picker.mode === 'inline' && !picker.node.isConnected) { closePicker(); return; }
  const rect = anchorRect();
  const box = linkPicker.getBoundingClientRect();
  const gap = 6;
  const edge = 8;
  const below = rect.bottom + gap;
  const above = rect.top - gap - box.height;
  const top = below + box.height <= innerHeight - edge || above < edge ? below : above;
  linkPicker.style.top = `${clamp(top, edge, Math.max(edge, innerHeight - box.height - edge))}px`;
  linkPicker.style.left = `${clamp(rect.left, edge, Math.max(edge, innerWidth - box.width - edge))}px`;
}

function openPicker(state) {
  closePicker();
  picker = { query: null, results: [], index: 0, step: 'pages', page: null, from: 0, ...state };
  const inline = picker.mode === 'inline';
  linkSearch.hidden = inline;
  linkPicker.hidden = false;
  if (inline) {
    body.setAttribute('aria-controls', 'linkOptions');
    updateInline();
    return;
  }
  btnLink.setAttribute('aria-expanded', 'true');
  linkSearch.placeholder = picker.image ? 'Enlazar la imagen a...' : 'Buscar página...';
  linkSearch.value = '';
  searchPicker();
  linkSearch.focus({ preventScroll: true });
}

function closePicker() {
  if (!picker) return;
  picker = null;
  linkPicker.hidden = true;
  linkHead.hidden = true;
  linkOptions.replaceChildren();
  body.removeAttribute('aria-activedescendant');
  body.removeAttribute('aria-controls');
  linkSearch.removeAttribute('aria-activedescendant');
  btnLink.setAttribute('aria-expanded', 'false');
}

function searchPicker() {
  picker.query = linkSearch.value;
  picker.results = picker.step === 'marks' ? markResults(picker.page, picker.query) : linkResults(picker.query);
  picker.index = 0;
  paintPicker();
  positionPicker();
}

// El carácter justo a la izquierda dentro de la misma línea; '' al empezar la línea.
function charBefore(node, offset) {
  if (offset > 0) return node.data[offset - 1];
  for (let current = node; current !== body && !BLOCK_TAGS.has(current.nodeName); current = current.parentNode) {
    for (let prev = current.previousSibling; prev; prev = prev.previousSibling) {
      if (prev.nodeName === 'BR') return '';
      const text = prev.textContent;
      if (text) return text[text.length - 1];
    }
  }
  return '';
}

// La @ pegada a otro carácter (un correo, por ejemplo) no abre el buscador: solo tras un blanco o al empezar la línea.
// `typed` es lo que acaba de entrar: una tecla o, en algunos teclados táctiles, una palabra entera.
function maybeOpenInline(typed) {
  const sel = getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return;
  const { startContainer: node, startOffset: caret } = sel.getRangeAt(0);
  if (node.nodeType !== Node.TEXT_NODE || !body.contains(node)) return;
  const at = caret - typed.length + typed.lastIndexOf('@');
  if (at < 0 || node.data[at] !== '@') return;
  const before = charBefore(node, at);
  if (before && !/\s/.test(before)) return;
  openPicker({ mode: 'inline', node, offset: at });
}

// Lo escrito entre la @ y el cursor; null si la @ ya no está o el cursor salió de ahí.
function inlineQuery() {
  const { node, offset } = picker;
  const sel = getSelection();
  if (!node.isConnected || node.data[offset] !== '@' || !sel.rangeCount || !sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  if (range.startContainer !== node || range.startOffset <= offset) return null;
  return node.data.slice(offset + 1, range.startOffset);
}

function updateInline() {
  const query = inlineQuery();
  if (query === null || query.length > PICKER_MAX_QUERY) { closePicker(); return; }
  // Borrar lo escrito antes de elegir la página vuelve al primer paso.
  if (picker.step === 'marks' && query.length < picker.from) {
    picker.step = 'pages';
    picker.page = null;
  }
  let results;
  if (picker.step === 'marks') {
    results = markResults(picker.page, query.slice(picker.from));
  } else {
    results = linkResults(query);
    // Si nada coincide y ya sigues con otra palabra, la @ era solo texto.
    if (!results.length && /\s$/.test(query)) { closePicker(); return; }
  }
  picker.query = query;
  picker.results = results;
  picker.index = 0;
  paintPicker();
  positionPicker();
}

const blockOf = node => {
  while (node && node !== body && !BLOCK_TAGS.has(node.nodeName)) node = node.parentNode;
  return node;
};

function restoreSelection(range) {
  body.focus({ preventScroll: true });
  const sel = getSelection();
  sel.removeAllRanges();
  if (range) sel.addRange(range);
  else { sel.selectAllChildren(body); sel.collapseToEnd(); }
}

function pickerKey(e) {
  const count = picker.results.length;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!count) return;
    picker.index = (picker.index + (e.key === 'ArrowDown' ? 1 : count - 1)) % count;
    markOption(true);
  } else if (e.key === 'Enter' || e.key === 'Tab') {
    if (!count) {
      if (picker.mode === 'button') e.preventDefault();
      else closePicker();
      return;
    }
    e.preventDefault();
    choosePicker(picker.index);
  } else if (e.key === 'Escape') {
    e.preventDefault();
    e.stopPropagation();
    if (picker.step === 'marks') { leaveMarks(); return; }
    const { mode, range } = picker;
    closePicker();
    if (mode === 'button') restoreSelection(range);
  } else if (e.key === 'Backspace' && picker.mode === 'button' && picker.step === 'marks' && !linkSearch.value) {
    e.preventDefault();
    leaveMarks();
  }
}

// Con @ se reemplaza "@búsqueda"; con el botón, el texto seleccionado pasa a ser el enlace.
// Una página con marcadores no se enlaza aún: primero se elige el marcador (o la página completa).
function choosePicker(index) {
  const entry = picker && picker.results[index];
  if (!entry) return;
  if (picker.step === 'pages' && marksOf(entry.page).length) { enterMarks(entry.page); return; }
  const { page: target, mark } = entry;
  if (picker.image) {
    const image = picker.image;
    closePicker();
    linkImage(image, target, mark);
    if (selectedImg) body.focus({ preventScroll: true });
    return;
  }
  let range = picker.range || null;
  if (picker.mode === 'inline') {
    const query = inlineQuery();
    if (query === null) { closePicker(); return; }
    range = document.createRange();
    range.setStart(picker.node, picker.offset);
    range.setEnd(picker.node, picker.offset + 1 + query.length);
  }
  const selected = picker.mode === 'button' && range && !range.collapsed ? range.toString().replace(/\s+/g, ' ').trim() : '';
  closePicker();
  if (selected && blockOf(range.startContainer) !== blockOf(range.endContainer)) {
    restoreSelection(range);
    toast('Selecciona texto de una sola línea');
    return;
  }
  restoreSelection(range);
  const link = h('a', { 'data-page': target.id, 'data-mark': mark ? mark.id : null, 'data-own': selected ? '' : null, text: selected || linkLabel(target, mark) });
  // Con execCommand, Ctrl+Z también deshace el enlace.
  document.execCommand('insertHTML', false, link.outerHTML + (selected ? '' : '&nbsp;'));
  paintLinks();
  paintEmptyBody();
  markDirty();
  updateBar();
}

btnLink.addEventListener('click', () => {
  if (picker && picker.mode === 'button') {
    const { range, image } = picker;
    closePicker();
    if (image) body.focus({ preventScroll: true });
    else restoreSelection(range);
    return;
  }
  // Con una imagen elegida, el enlace es para ella.
  const entry = selectedImg && imageEntries.get(selectedImg);
  if (entry) { openPicker({ mode: 'button', range: null, image: entry }); return; }
  const range = selectionRange();
  openPicker({ mode: 'button', range: range ? range.cloneRange() : null });
});
/* Crear, renombrar y quitar marcadores. */

const btnMark = $('btnMark');
const markEditor = $('markEditor');
const markName = $('markName');
let markEdit = null;  // { range }: la selección a la que vuelve el foco al cerrar

// El bloque del cursor, o null si el texto está suelto en la raíz de la hoja.
function caretBlock(range) {
  const block = range ? blockOf(range.startContainer) : null;
  return block && block !== body ? block : null;
}

function paintMarkButton() {
  const block = caretBlock(selectionRange());
  btnMark.setAttribute('aria-pressed', String(!!(block && block.hasAttribute('data-mark-id'))));
}

function nextMarkName() {
  // El primer número libre: con solo "Presupuesto", el siguiente es "Marcador 1".
  const used = new Set(readMarks(body).map(m => norm(m.name)));
  let n = 1;
  while (used.has(norm(`Marcador ${n}`))) n++;
  return `Marcador ${n}`;
}

// Un nombre por página, sin distinguir mayúsculas, tildes ni espacios: en el buscador se verían iguales.
// `block` es el que se está editando: conservar su propio nombre sí vale. Devuelve el nombre que ya existe.
function markNameTaken(name, block) {
  const key = norm(name);
  if (!key) return null;
  const other = [...body.querySelectorAll('[data-mark-id]')].find(el => el !== block && norm(el.getAttribute('data-mark-name') || '') === key);
  return other ? other.getAttribute('data-mark-name') : null;
}

// Avisa mientras escribes y no deja guardar un nombre repetido.
function checkMarkName() {
  const existing = markEdit ? markNameTaken(cleanMarkName(markName.value), caretBlock(markEdit.range)) : null;
  const taken = existing !== null;
  const error = $('markError');
  error.hidden = !taken;
  error.textContent = taken ? `Ya hay un marcador «${existing}» en esta página. Elige otro nombre.` : '';
  if (taken) markName.setAttribute('aria-invalid', 'true');
  else markName.removeAttribute('aria-invalid');
  $('markSave').disabled = taken;
  return !taken;
}

function openMarkEditor() {
  const range = selectionRange();
  if (!range) { toast('Pon el cursor en el párrafo que quieres marcar'); return; }
  closePicker();
  const block = caretBlock(range);
  const existing = block && block.hasAttribute('data-mark-id') ? block : null;
  markEdit = { range: range.cloneRange() };
  markName.value = existing ? existing.getAttribute('data-mark-name') : nextMarkName();
  $('markRemove').hidden = !existing;
  btnMark.setAttribute('aria-expanded', 'true');
  markEditor.hidden = false;
  const rect = btnMark.getBoundingClientRect();
  const box = markEditor.getBoundingClientRect();
  markEditor.style.top = `${clamp(rect.bottom + 6, 8, Math.max(8, innerHeight - box.height - 8))}px`;
  markEditor.style.left = `${clamp(rect.left, 8, Math.max(8, innerWidth - box.width - 8))}px`;
  checkMarkName();
  markName.focus({ preventScroll: true });
  markName.select();
}

function closeMarkEditor(restore) {
  if (!markEdit) return;
  const { range } = markEdit;
  markEdit = null;
  markEditor.hidden = true;
  btnMark.setAttribute('aria-expanded', 'false');
  if (restore) restoreSelection(range);
}

// El marcador es del bloque entero: sigue ahí aunque edites su texto.
function saveMark() {
  if (!markEdit) return;
  if (!checkMarkName()) { markName.focus({ preventScroll: true }); markName.select(); return; }
  const name = cleanMarkName(markName.value) || nextMarkName();
  const { range } = markEdit;
  closeMarkEditor(true);
  let block = caretBlock(range);
  if (!block) {
    // La primera línea de una página suele ir suelta: se envuelve en un párrafo para poder marcarla.
    document.execCommand('formatBlock', false, '<p>');
    const sel = getSelection();
    block = sel.rangeCount ? caretBlock(sel.getRangeAt(0)) : null;
    if (!block) { toast('No se pudo marcar ese texto'); return; }
  }
  if (!block.hasAttribute('data-mark-id')) block.setAttribute('data-mark-id', uuid());
  block.setAttribute('data-mark-name', name);
  afterMarkChange();
  toast(`Marcador "${name}" guardado. Enlázalo escribiendo @ y eligiendo esta página.`);
}

function removeMark() {
  const { range } = markEdit;
  closeMarkEditor(true);
  const block = caretBlock(range);
  if (!block || !block.hasAttribute('data-mark-id')) return;
  block.removeAttribute('data-mark-id');
  block.removeAttribute('data-mark-name');
  afterMarkChange();
}

function afterMarkChange() {
  markDirty();
  paintLinks();
  updateBar();
}

// Al unir dos párrafos, Chrome conserva el de arriba y le pasa el texto del de abajo: si el marcado
// era el de abajo, su marcador desaparecería con él. Se guarda antes de borrar y se devuelve al
// bloque unido. Solo con el cursor sin selección y si el párrafo tenía texto: borrarlo entero sí lo quita.
let marksBeforeDelete = null;

function rememberMarks(e) {
  const sel = getSelection();
  marksBeforeDelete = e.inputType.startsWith('delete') && sel.rangeCount && sel.isCollapsed ? readMarks(body) : null;
}

function keepMergedMark() {
  const before = marksBeforeDelete;
  marksBeforeDelete = null;
  if (!before || !before.length) return;
  const now = new Set(readMarks(body).map(m => m.id));
  const lost = before.filter(m => !now.has(m.id));
  if (lost.length !== 1 || !lost[0].text) return;
  const sel = getSelection();
  const block = sel.rangeCount ? caretBlock(sel.getRangeAt(0)) : null;
  if (!block || block.hasAttribute('data-mark-id')) return;
  block.setAttribute('data-mark-id', lost[0].id);
  block.setAttribute('data-mark-name', lost[0].name);
}

btnMark.addEventListener('click', () => {
  if (markEdit) closeMarkEditor(true);
  else openMarkEditor();
});
$('markSave').addEventListener('click', saveMark);
$('markRemove').addEventListener('click', removeMark);
markName.addEventListener('keydown', e => {
  if (e.isComposing) return;
  if (e.key === 'Enter') { e.preventDefault(); saveMark(); }
  else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeMarkEditor(true); }
});
markName.addEventListener('input', checkMarkName);
markName.addEventListener('blur', () => closeMarkEditor(false));
// Pulsar Guardar o Quitar no debe quitarle el foco al nombre: lo cerraría antes del clic.
markEditor.addEventListener('mousedown', e => { if (e.target !== markName) e.preventDefault(); });

linkSearch.addEventListener('input', searchPicker);
linkSearch.addEventListener('blur', () => { if (picker && picker.mode === 'button') closePicker(); });
linkSearch.addEventListener('keydown', e => { if (picker && !e.isComposing) pickerKey(e); });
// Elegir una opción no debe quitarle el foco al texto ni al buscador.
linkPicker.addEventListener('mousedown', e => { if (e.target !== linkSearch) e.preventDefault(); });

body.addEventListener('keydown', e => {
  if (picker && picker.mode === 'inline' && !e.isComposing) pickerKey(e);
  else tableKey(e);
});
body.addEventListener('blur', () => { if (picker && picker.mode === 'inline') closePicker(); });
document.addEventListener('selectionchange', () => {
  if (!picker || picker.mode !== 'inline') return;
  const query = inlineQuery();
  if (query === null) closePicker();
  else if (query !== picker.query) updateInline();
});
document.addEventListener('pointerdown', e => {
  if (picker && !linkPicker.contains(e.target) && !btnLink.contains(e.target)) closePicker();
}, true);
scroller.addEventListener('scroll', positionPicker);
window.addEventListener('resize', positionPicker);

/* Burbuja del enlace. Con ratón aparece al dejarlo encima un momento; en táctil, al tocar el enlace. */

const linkBubble = $('linkBubble');
const BUBBLE_SHOW_MS = 350;
const BUBBLE_HIDE_MS = 250;  // margen para llevar el ratón del enlace a la burbuja
let bubbleEl = null;  // el enlace o la imagen de la burbuja abierta
let bubbleTimer = 0;
let lastPointer = 'mouse';

// Lo que muestra la burbuja de un enlace del texto o de una imagen enlazada; null si no es ninguno.
function bubbleInfo(el) {
  if (!el || !el.isConnected) return null;
  if (el.matches('a[data-page]')) {
    return {
      dest: el.dataset.dest || pageName({ title: el.textContent }),
      page: el.dataset.page,
      mark: el.dataset.mark,
      broken: el.classList.contains('nb-link-broken'),
      unlink: () => unlink(el),
    };
  }
  const entry = isNoteImage(el) ? imageEntries.get(el) : null;
  if (!entry || !entry.link) return null;
  const { dest, target } = describeLink(entry.link.page, entry.link.mark);
  return { dest, page: entry.link.page, mark: entry.link.mark, broken: !target, image: true, unlink: () => unlinkImage(entry) };
}

function showBubble(el) {
  clearTimeout(bubbleTimer);
  const info = selectedImg ? null : bubbleInfo(el);
  if (!info) { hideBubble(); return; }
  bubbleEl = el;
  $('linkDest').textContent = info.dest;
  $('linkOpen').disabled = info.broken;
  $('linkUnlink').title = info.image ? 'Quita el enlace de la imagen' : 'Quita el enlace y deja el texto';
  linkBubble.hidden = false;
  positionBubble();
}

// Encima del enlace (de su primera línea) o de la imagen; debajo si no cabe. Se va si sale de la vista.
function positionBubble() {
  if (!bubbleEl) return;
  if (!bubbleEl.isConnected) { hideBubble(); return; }
  const rect = bubbleEl.getClientRects()[0] || bubbleEl.getBoundingClientRect();
  const view = scroller.getBoundingClientRect();
  if (rect.bottom < view.top || rect.top > view.bottom) { hideBubble(); return; }
  const box = linkBubble.getBoundingClientRect();
  if (isNoteImage(bubbleEl)) {
    // Donde sale la barra de la imagen elegida: al elegirla, una toma el sitio de la otra.
    const above = rect.top - box.height - 12;
    const below = rect.bottom + 12;
    const top = above >= view.top + 4 ? above
      : below + box.height <= view.bottom - 4 ? below
      : Math.max(rect.top, view.top) + 12;
    linkBubble.style.top = `${top}px`;
    linkBubble.style.left = `${clamp(rect.left + rect.width / 2 - box.width / 2, view.left + 4, Math.max(view.left + 4, view.right - box.width - 4))}px`;
    return;
  }
  const above = rect.top - box.height - 6;
  const top = above >= Math.max(8, view.top) ? above : rect.bottom + 6;
  linkBubble.style.top = `${clamp(top, 8, Math.max(8, innerHeight - box.height - 8))}px`;
  linkBubble.style.left = `${clamp(rect.left, 8, Math.max(8, innerWidth - box.width - 8))}px`;
}

function hideBubble() {
  clearTimeout(bubbleTimer);
  bubbleTimer = 0;
  if (!bubbleEl) return;
  bubbleEl = null;
  linkBubble.hidden = true;
}

function hideBubbleSoon() {
  clearTimeout(bubbleTimer);
  bubbleTimer = setTimeout(hideBubble, BUBBLE_HIDE_MS);
}

// El texto se queda donde estaba, ya sin enlace. Con execCommand, Ctrl+Z devuelve el enlace.
function unlink(link) {
  hideBubble();
  if (!body.contains(link)) return;
  const text = link.textContent;
  const range = document.createRange();
  range.selectNode(link);
  restoreSelection(range);
  pasting = true;  // el texto puede llevar una @: no debe abrir el buscador
  try {
    document.execCommand('insertText', false, text);
  } finally {
    pasting = false;
  }
  if (body.contains(link)) link.replaceWith(document.createTextNode(text));
  paintLinks();
  paintEmptyBody();
  markDirty();
  updateBar();
}

// Al pasar el ratón: un enlace del texto o una imagen enlazada que no esté elegida
// (la elegida ya muestra Abrir y Quitar enlace en su propia barra).
function bubbleTargetAt(target) {
  if (!target || !target.closest) return null;
  const link = target.closest('a[data-page]');
  if (link && body.contains(link)) return link;
  const entry = isNoteImage(target) && imgLayer.contains(target) ? imageEntries.get(target) : null;
  return entry && entry.link ? target : null;
}

body.addEventListener('pointerdown', e => { lastPointer = e.pointerType || 'mouse'; }, true);
scroller.addEventListener('pointerover', e => {
  if (e.pointerType === 'touch' || imgGesture || selectedImg) return;
  const el = bubbleTargetAt(e.target);
  if (!el) return;
  clearTimeout(bubbleTimer);
  if (el === bubbleEl) return;
  // Si ya había una burbuja abierta, pasa al otro enlace sin esperar.
  bubbleTimer = setTimeout(() => showBubble(el), bubbleEl ? 0 : BUBBLE_SHOW_MS);
});
scroller.addEventListener('pointerout', e => {
  if (e.pointerType === 'touch') return;
  const el = bubbleTargetAt(e.target);
  if (!el || el.contains(e.relatedTarget)) return;
  if (bubbleEl) hideBubbleSoon();
  else clearTimeout(bubbleTimer);
});
linkBubble.addEventListener('pointerenter', () => clearTimeout(bubbleTimer));
linkBubble.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') hideBubbleSoon(); });
// Pulsar la burbuja no debe quitarle el foco al editor: el blur guardaría y movería el cursor.
linkBubble.addEventListener('mousedown', e => e.preventDefault());
$('linkOpen').addEventListener('click', () => {
  const info = bubbleInfo(bubbleEl);
  hideBubble();
  if (info && !info.broken) goToPage(info.page, true, info.mark);
});
$('linkUnlink').addEventListener('click', () => {
  const info = bubbleInfo(bubbleEl);
  hideBubble();
  if (info) info.unlink();
});
// Cualquier toque fuera de la burbuja la cierra; en táctil, el clic del enlace la vuelve a abrir.
document.addEventListener('pointerdown', e => {
  if (!linkBubble.contains(e.target)) hideBubble();
}, true);
body.addEventListener('keydown', () => hideBubble());
scroller.addEventListener('scroll', positionBubble, { passive: true });
window.addEventListener('resize', positionBubble);

/* ---------- Copia de seguridad ---------- */

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(',') + 1));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
}

async function exportBackup() {
  flush();
  // Por partes: con muchas imágenes, el archivo no cabría en una sola cadena de texto.
  const parts = [];
  try {
    const head = JSON.stringify({
      app: 'notas',
      version: 2,
      exportedAt: new Date().toISOString(),
      notebooks: [...books.values()],
      pages: [...pages.values()],
    }, null, 1);
    parts.push(head.slice(0, head.lastIndexOf('}')), ',\n "images": [');
    const images = await getAll('images');
    for (const [index, image] of images.entries()) {
      parts.push(index ? ',\n' : '', JSON.stringify({ id: image.id, type: image.blob.type, width: image.width, height: image.height, data: await blobToBase64(image.blob) }));
    }
    parts.push(']\n}\n');
  } catch (e) {
    toast('No se pudo crear la copia de seguridad');
    return;
  }
  const url = URL.createObjectURL(new Blob(parts, { type: 'application/json' }));
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  h('a', { href: url, download: `notas-respaldo-${stamp}.json` }).click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

// El archivo no es de fiar: se reconstruye cada registro y se descarta lo que no encaje.
function normalizeBackup(data) {
  const notebooks = data.notebooks
    .filter(b => b && typeof b.id === 'string' && typeof b.name === 'string')
    .map(b => ({ id: b.id, name: b.name, createdAt: Number(b.createdAt) || Date.now(), order: Number.isFinite(b.order) ? b.order : undefined }));
  const ids = new Set(notebooks.map(b => b.id));
  const colors = new Set(PAGE_COLORS.map(c => c[0]));
  const importedPages = data.pages
    .filter(p => p && typeof p.id === 'string' && ids.has(p.notebookId))
    .map(p => {
      const html = sanitizeNote(p.html);
      const page = {
        id: p.id,
        notebookId: p.notebookId,
        title: String(p.title || ''),
        html,
        color: colors.has(p.color) ? p.color : 'blue',
        mode: p.mode,
        images: [...cleanEntries(p.images), ...liftInlineImages(p.html)],
        checklist: (Array.isArray(p.checklist) ? p.checklist : [])
          .filter(i => i && typeof i.text === 'string')
          .map(i => ({ id: typeof i.id === 'string' ? i.id : uuid(), text: i.text, done: !!i.done })),
        createdAt: Number(p.createdAt) || Date.now(),
        updatedAt: Number(p.updatedAt) || Date.now(),
        order: Number.isFinite(p.order) ? p.order : undefined,
      };
      settleMode(page);
      page.text = pageText(page);
      return page;
    });
  return { notebooks, pages: importedPages, images: normalizeImages(data.images) };
}

// Las copias de la versión 1 no traen imágenes.
function normalizeImages(list) {
  const images = [];
  for (const item of Array.isArray(list) ? list : []) {
    if (!item || !IMAGE_ID.test(item.id) || !IMAGE_TYPES.has(item.type) || typeof item.data !== 'string') continue;
    try {
      const binary = atob(item.data);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      images.push({ id: item.id, blob: new Blob([bytes], { type: item.type }), width: validSide(item.width) || 0, height: validSide(item.height) || 0 });
    } catch (e) {
      // Base64 no válido: se pierde esta imagen, no toda la copia.
    }
  }
  return images;
}

async function importBackup(file) {
  let backup;
  try {
    const data = JSON.parse(await file.text());
    if (data.app !== 'notas' || !Array.isArray(data.notebooks) || !Array.isArray(data.pages)) throw new Error('formato');
    backup = normalizeBackup(data);
  } catch (e) {
    toast('Ese archivo no es una copia de seguridad de Notas');
    return;
  }
  if (!confirm(`Se reemplazará todo lo guardado por la copia (${backup.notebooks.length} cuadernos, ${backup.pages.length} páginas, ${backup.images.length} imágenes). ¿Continuar?`)) return;
  dirty = false;
  clearTimeout(saveTimer);
  const stores = ['notebooks', 'pages', 'meta', 'images'];
  const saved = await writeTx(stores, s => {
    stores.forEach(name => s(name).clear());
    backup.notebooks.forEach(b => s('notebooks').put(b));
    backup.pages.forEach(p => s('pages').put(p));
    backup.images.forEach(i => s('images').put(i));
  });
  if (saved) location.reload();
}

/* ---------- Eventos ---------- */

$('btnAddBook').addEventListener('click', () => { ui.editingBook = 'new'; renderBooks(); });
$('btnAddPage').addEventListener('click', addPage);
