  if (e.key === 'Enter') { e.preventDefault(); focusEditor(); }
});
body.addEventListener('input', () => { markDirty(); paintEmptyBody(); });
body.addEventListener('blur', flush);
// Excel y Word añaden una foto de lo copiado: si hay texto, lo que quieres es el texto.
function pasteImages(data) {
  const html = data.getData('text/html');
  if (noteText(html ? sanitizeNote(html) : '')) return false;
  const files = imageFiles(data);
  if (files.length) {
    insertImages(files);
    return true;
  }
  const copied = html ? copiedImages(html) : [];
  if (copied.length) addImages(currentPage(), copied);
  return copied.length > 0;
}
body.addEventListener('paste', e => {
  e.preventDefault();
  const data = e.clipboardData;
  if (pasteImages(data)) return;
  const html = data.getData('text/html');
  const clean = html ? sanitizeNote(html) : '';
  selectImage(null);
  const plain = data.getData('text/plain');
  if (clean) document.execCommand('insertHTML', false, clean);
  else if (plain) document.execCommand('insertText', false, plain);
  else if (/<img/i.test(html)) toast('Esa imagen está en internet. Cópiala con "Copiar imagen" para pegarla.');
});
scroller.addEventListener('dragover', e => e.preventDefault());
scroller.addEventListener('drop', e => {
  e.preventDefault();
  const files = imageFiles(e.dataTransfer);
  if (!files.length) return;
  const sheet = imgLayer.getBoundingClientRect();
  insertImages(files, { x: e.clientX - sheet.left, y: e.clientY - sheet.top });
});
$('btnCheck').addEventListener('click', () => {
  if (currentPage().mode === 'check') toText();
  else toChecklist();
});
checkView.addEventListener('click', e => { if (e.target === checkView) focusEditor(); });
checkView.addEventListener('paste', e => {
  if (pasteImages(e.clipboardData)) {
    e.preventDefault();
    return;
  }
  pasteLines(e);
});
$('btnExport').addEventListener('click', exportBackup);
$('btnImport').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (file) importBackup(file);
});
$('blockerRetry').addEventListener('click', () => location.reload());
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
window.addEventListener('pagehide', flush);

// Las fechas relativas envejecen; la lista no se toca si el usuario está navegando por ella.
setInterval(() => {
  paintDate();
  if (!$('pageList').contains(document.activeElement)) renderPages();
}, 60000);

/* ---------- Lanzador (opcional) ---------- */

// Dentro del lanzador, la aplicación le cuenta su título. Abierta sola, esto no hace nada.
const embedded = window.parent !== window;

function tellLauncher(message) {
  if (embedded) parent.postMessage({ launcher: true, ...message }, location.protocol === 'file:' ? '*' : location.origin);
}

if (embedded) {
  const sendTitle = () => tellLauncher({ type: 'title', title: document.title });
  new MutationObserver(sendTitle).observe(document.querySelector('title'), { childList: true, characterData: true, subtree: true });
  sendTitle();
}

/* ---------- Arranque ---------- */

function block(title, text) {
  $('blockerTitle').textContent = title;
  $('blockerText').textContent = text;
  $('blocker').hidden = false;
}

// Dos pestañas editando la misma página se pisarían los cambios.
function acquireLock() {
  if (!navigator.locks) return Promise.resolve(true);
  return new Promise(resolve => {
    navigator.locks.request('notas-writer', { ifAvailable: true }, lock => {
      resolve(!!lock);
      return lock ? new Promise(() => {}) : undefined;
    }).catch(() => resolve(true));
  });
}

async function init() {
  if (!(await acquireLock())) {
    block('Notas ya está abierto', 'Usa la otra pestaña o ciérrala y reintenta. Así los cambios no se pisan entre sí.');
    return;
  }
  let meta;
  try {
    db = await openDb();
    const [b, p, m] = await Promise.all(['notebooks', 'pages', 'meta'].map(getAll));
    b.forEach(x => books.set(x.id, x));
    p.forEach(x => pages.set(x.id, x));
    const upgraded = p.filter(upgradePage);
    if (upgraded.length) await writeTx(['pages'], s => upgraded.forEach(x => s('pages').put(x)));
    meta = m.find(x => x.key === 'ui');
    await sweepImages();
  } catch (e) {
    block('No se pudo abrir la base de datos', 'Revisa que este navegador permita guardar datos en este sitio y reintenta.');
    return;
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  document.execCommand('defaultParagraphSeparator', false, 'p');
  ensureBook();
  ui.bookId = meta && books.has(meta.bookId) ? meta.bookId : sortedBooks()[0].id;
  const saved = meta && pages.get(meta.pageId);
  const first = bookPages(ui.bookId)[0];
  ui.pageId = saved && saved.notebookId === ui.bookId ? saved.id : first ? first.id : null;
  renderBooks();
  renderPages();
  renderEditor();
  setPane('pages');
}

init();
