        panel('Color', h('div', { class: 'row' }, picker, h('div', { style: 'flex:1;min-width:180px' }, text)), status, h('div', { class: 'swatch' }, swatch), formats),
        panel('Tonos', tones, h('p', { class: 'note', text: 'Del más claro al más oscuro, con el mismo matiz y saturación. Haz clic en uno para copiarlo.' }),
          row(btn('Usar como texto del contraste', () => setValue(fgText, toHex(parseColor(text.value) || { r: 0, g: 0, b: 0, a: 1 })), { small: true }),
            btn('Usar como fondo del contraste', () => setValue(bgText, toHex(parseColor(text.value) || { r: 0, g: 0, b: 0, a: 1 })), { small: true }))),
      ),
      panel('Contraste WCAG', h('div', { class: 'fields' }, field('Texto', fgText), field('Fondo', bgText)), demo, ratio, badges,
        row(btn('Intercambiar', () => { const t = fgText.value; setValue(fgText, bgText.value); setValue(bgText, t); }, { icon: 'swap', small: true }))),
    );
    paint();
    contrast();
  },
});

/* ---------- Tablero y navegación ---------- */

const ARROW = '<path d="M5 12h14M13 6l6 6-6 6"/>';
let cleanup = null;

function card(t) {
  const a = h('a', { class: 'card glow', href: `#${t.id}`, style: `--c:${t.color}`, 'data-id': t.id },
    h('span', { class: 'face' },
      h('span', { class: 'tile' }, svg(t.icon)),
      h('b', { text: t.name }),
      h('small', { text: t.desc }),
      svg(ARROW, 'go')));
  return a;
}

function buildBoard() {
  const query = $('search').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const board = $('board');
  board.replaceChildren();
  const matches = t => !query || `${t.name} ${t.desc} ${t.keywords}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(query);
  let shown = 0;
  if (!query) {
    const recent = loadPref('recent', []).map(id => TOOLS.find(t => t.id === id)).filter(Boolean).slice(0, 4);
    if (recent.length) board.append(h('section', { class: 'cat' }, h('h2', { text: 'Recientes' }), h('div', { class: 'cards' }, recent.map(card))));
  }
  for (const [id, name] of CATS) {
    const list = TOOLS.filter(t => t.cat === id && matches(t));
    if (!list.length) continue;
    shown += list.length;
    board.append(h('section', { class: 'cat' }, h('h2', { text: name }), h('div', { class: 'cards' }, list.map(card))));
  }
  $('empty').hidden = shown > 0;
}

function remember(id) {
  const recent = [id, ...loadPref('recent', []).filter(x => x !== id)].slice(0, 4);
  savePref('recent', recent);
}

function route() {
  if (cleanup) { try { cleanup(); } catch (e) { /* nada que limpiar */ } cleanup = null; }
  const id = location.hash.slice(1);
  const t = TOOLS.find(x => x.id === id);
  if (!t) {
    $('view').hidden = true;
    $('viewBody').replaceChildren();
    $('home').hidden = false;
    buildBoard();
    $('home').classList.remove('view-enter');
    void $('home').offsetWidth;
    $('home').classList.add('view-enter');
    document.title = 'Navaja suiza';
    const last = document.querySelector(`.card[data-id="${CSS.escape(loadPref('last', ''))}"]`);
    if (last) last.focus({ preventScroll: false });
    return;
  }
  remember(t.id);
  savePref('last', t.id);
  $('home').hidden = true;
  $('view').hidden = false;
  $('view').style.setProperty('--c', t.color);
  $('viewTile').replaceChildren(svg(t.icon));
  $('viewTitle').textContent = t.name;
  $('viewDesc').textContent = t.desc;
  const body = $('viewBody');
  body.replaceChildren();
  body.classList.remove('view-enter');
  void body.offsetWidth;
  body.classList.add('view-enter');
  document.title = `${t.name} · Navaja suiza`;
  window.scrollTo(0, 0);
  try {
    cleanup = t.render(body, makeCtx(t.id)) || null;
  } catch (e) {
    body.append(panel('Error', h('p', { class: 'status bad', text: `No se pudo abrir la herramienta: ${e.message}` })));
  }
  $('btnBack').focus({ preventScroll: true });
}

// Onda al pulsar cualquier botón o card iluminada.
document.addEventListener('pointerdown', e => {
  const target = e.target.closest('.glow');
  if (!target || target.classList.contains('search')) return;
  const face = target.querySelector('.face');
  if (!face) return;
  const rect = face.getBoundingClientRect();
  const dot = h('span', { class: 'ripple', style: `left:${e.clientX - rect.left}px;top:${e.clientY - rect.top}px;--r:${Math.ceil(Math.hypot(rect.width, rect.height) / 10)}` });
  face.append(dot);
  dot.addEventListener('animationend', () => dot.remove());
});

// Brillo de la card que sigue al cursor.
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card');
  if (!c) return;
  const face = c.firstElementChild;
  const rect = face.getBoundingClientRect();
  face.style.setProperty('--mx', `${e.clientX - rect.left}px`);
  face.style.setProperty('--my', `${e.clientY - rect.top}px`);
});

const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (e.key === '/' && !$('home').hidden && !isTyping(document.activeElement)) {
    e.preventDefault();
    $('search').focus();
    $('search').select();
  } else if (e.key === 'Escape' && !$('view').hidden && !isTyping(document.activeElement)) {
    location.hash = '';
  } else if (e.key === 'Escape' && document.activeElement === $('search')) {
    $('search').value = '';
    buildBoard();
  }
});
$('search').addEventListener('input', buildBoard);
$('search').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = $('board').querySelector('.cat:not(:first-child) .card, .card');
    const all = [...$('board').querySelectorAll('.card')];
    const pick = $('search').value.trim() ? all[0] : first;
    if (pick) location.hash = pick.getAttribute('href');
  }
});
window.addEventListener('hashchange', route);

/* ---------- Lanzador (opcional) ---------- */

// Dentro del lanzador, la aplicación le cuenta su título. Abierta sola, esto no hace nada.
const embedded = window.parent !== window;
if (embedded) {
  const tell = () => parent.postMessage({ launcher: true, type: 'title', title: document.title, busy: false }, location.protocol === 'file:' ? '*' : location.origin);
  new MutationObserver(tell).observe(document.querySelector('title'), { childList: true, characterData: true, subtree: true });
  tell();
}

/* ---------- Arranque ---------- */

$('heroText').textContent = `${TOOLS.length} herramientas para el día a día de un programador. Funcionan sin conexión y nada sale de tu navegador.`;
route();
</script>
</body>
</html>
