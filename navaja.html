<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navaja suiza</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --surface: #ffffff;
  --field: #fbfaf7;
  --line: #e0ddd5;
  --line-strong: #cbc7bd;
  --hover: #eeebe4;
  --text: #1e1f1c;
  --muted: #6a6b64;
  --accent: #1a73e8;
  --accent-text: #ffffff;
  --ok: #188038;
  --ok-bg: #e6f4ea;
  --bad: #c5221f;
  --bad-bg: #fce8e6;
  --add-bg: #e6f4ea;
  --add-mark: #a8dab5;
  --del-bg: #fce8e6;
  --del-mark: #f6aea9;
  --mark1: #fde68a;
  --mark2: #bfdbfe;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 14px -6px rgb(0 0 0 / .12);
  --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --g1: #4285f4; --g2: #ea4335; --g3: #fbbc05; --g4: #34a853;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101214;
    --surface: #17191c;
    --field: #121417;
    --line: #2a2e33;
    --line-strong: #3a3f46;
    --hover: #20242a;
    --text: #eceded;
    --muted: #9ba0a6;
    --accent: #8ab4f8;
    --accent-text: #0b1220;
    --ok: #81c995;
    --ok-bg: #12301d;
    --bad: #f28b82;
    --bad-bg: #3a1714;
    --add-bg: #11301c;
    --add-mark: #1f6b3a;
    --del-bg: #3a1714;
    --del-mark: #7a2a24;
    --mark1: #6b5310;
    --mark2: #1e3a66;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px -8px rgb(0 0 0 / .6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .875rem; }
.wrap { width: min(1180px, 100%); margin: 0 auto; padding: 28px 24px 56px; }
/* Dentro de una herramienta se usa casi todo el ancho de la pantalla. */
.wrap.wide { width: min(1840px, 100%); }

/* ---------- Borde iluminado ---------- */
@property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@property --fill { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
.glow {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  padding: 1.5px;
  border: 0;
  border-radius: 12px;
  background: var(--line);
  text-decoration: none;
  transition: transform .18s ease, box-shadow .25s ease, background .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.glow::before, .glow::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: conic-gradient(from var(--angle),
    var(--g1) 0%,
    var(--g2) calc(var(--fill) * .28),
    var(--g3) calc(var(--fill) * .52),
    var(--g4) calc(var(--fill) * .78),
    var(--g1) var(--fill),
    transparent var(--fill));
  opacity: 0;
  transition: opacity .3s ease;
}
.glow::before { z-index: -1; }
.glow::after { z-index: -2; filter: blur(12px); }
.glow:hover::before, .glow:focus-visible::before, .glow.lit::before { opacity: 1; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }
.glow:hover::after, .glow:focus-visible::after, .glow.lit::after { opacity: .5; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }
.glow:focus-visible { outline: none; }
@keyframes draw { from { --fill: 0%; } to { --fill: 100%; } }
@keyframes spin { from { --angle: 0deg; } to { --angle: 360deg; } }
.face {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  border-radius: calc(12px - 1.5px);
  background: var(--surface);
}
.ripple {
  position: absolute;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  background: currentColor;
  opacity: .22;
  pointer-events: none;
  transform: scale(0);
  animation: ripple .6s ease-out forwards;
}
@keyframes ripple { to { transform: scale(var(--r, 20)); opacity: 0; } }

/* ---------- Botones ---------- */
.btn { border-radius: 10px; }
.btn .face {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  padding: 7px 14px;
  border-radius: 8.5px;
  font-size: .875rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background .2s ease;
}
.btn:hover .face { background: var(--hover); }
.btn:active { transform: scale(.96); }
.btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: transparent; }
.btn.primary .face { background: var(--accent); color: var(--accent-text); }
.btn.primary:hover .face { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
.btn.small .face { min-height: 30px; padding: 4px 10px; font-size: .8125rem; }
.btn.icon .face { padding: 7px 9px; }
.btn:disabled { opacity: .45; pointer-events: none; }

/* ---------- Cabecera ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
.hero h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.375rem); line-height: 1.1; letter-spacing: -.025em; }
.hero h1 span {
  background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.search { width: min(360px, 100%); border-radius: 14px; }
.search .face { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12.5px; }
.search svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.search input { flex: 1; min-width: 0; min-height: 46px; padding: 0; background: none; border: 0; outline: none; }
.search kbd { padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font: .75rem var(--mono); }
.search:focus-within::before { opacity: 1; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }
.search:focus-within::after { opacity: .45; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }

/* ---------- Tablero ---------- */
.cat { margin: 0 0 30px; }
.cat h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: .75rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.cat h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.card { display: flex; border-radius: 18px; box-shadow: var(--shadow); }
.card .face {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 162px;
  padding: 18px 18px 16px;
  border-radius: 16.5px;
  background:
    radial-gradient(260px circle at var(--mx, 50%) var(--my, -40%), color-mix(in srgb, var(--c) 14%, transparent), transparent 70%),
    var(--surface);
}
.card:hover { transform: translateY(-4px); box-shadow: 0 18px 34px -16px color-mix(in srgb, var(--c) 55%, transparent); }
.card:active { transform: translateY(-1px) scale(.975); }
.tile {
  display: grid;
  place-items: center;
  flex: none;
  width: 46px;
  height: 46px;
  margin-bottom: 10px;
  border-radius: 13px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
  box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--c) 80%, transparent), inset 0 1px 0 rgb(255 255 255 / .35);
  color: #fff;
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
}
.tile svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card:hover .tile { transform: scale(1.1) rotate(-6deg); }
.card b { font-size: 1.0625rem; letter-spacing: -.01em; }
.card small { color: var(--muted); font-size: .8125rem; line-height: 1.4; }
.card .go {
  position: absolute;
  right: 16px;
  top: 20px;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: var(--c);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity .2s ease, transform .2s ease;
}
.card:hover .go, .card:focus-visible .go { opacity: 1; transform: none; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* ---------- Vista de herramienta ---------- */
.tool-head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
.tool-head .tile { margin: 0; }
.tool-head .tool-reset { flex: none; margin-left: auto; }
.tool-reset.armed .face { color: var(--bad); }
.tool-head h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.02em; }
.tool-head p { margin: 2px 0 0; color: var(--muted); font-size: .9375rem; }
.tool-body { display: grid; gap: 18px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; align-items: start; }
/* Editor y vista previa: la vista previa se queda con más ancho. */
.cols.split { grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); }
.cols.split.lead { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1000px) { .cols.split, .cols.split.lead { grid-template-columns: minmax(0, 1fr); } }
.panel {
  min-width: 0;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
}
.panel > h2 { margin: 0 0 14px; font-size: .9375rem; font-weight: 700; }
.panel > * + * { margin-top: 12px; }
.panel > h2 + * { margin-top: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.input {
  width: 100%;
  min-height: 42px;
  padding: 9px 12px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea.input { display: block; resize: vertical; line-height: 1.5; }
textarea.input[readonly] { background: color-mix(in srgb, var(--field) 60%, var(--hover)); }
select.input { padding-right: 30px; }
input[type="color"].input { width: 52px; padding: 4px; cursor: pointer; }
input[type="range"] { accent-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; font-size: .875rem; cursor: pointer; user-select: none; }
.check input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--hover); border-radius: 11px; }
.seg button { min-height: 32px; padding: 4px 12px; background: none; border: 0; border-radius: 8px; color: var(--muted); font-size: .8125rem; font-weight: 600; transition: background .15s ease, color .15s ease; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.note { margin: 0; color: var(--muted); font-size: .8125rem; }
.status { margin: 0; padding: 9px 12px; border-radius: 10px; font-size: .875rem; font-weight: 500; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.bad { background: var(--bad-bg); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat { padding: 12px 14px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; }
.stat b { display: block; font-size: 1.5rem; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; overflow-wrap: anywhere; }
.stat span { font-size: .75rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; background: var(--hover); border: 0; border-radius: 99px; font-size: .8125rem; }
button.chip { transition: background .15s ease; }
button.chip:hover { background: var(--line); }
.chip em { font-style: normal; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; margin: 0; }
.kv dt { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: .875rem; overflow-wrap: anywhere; }
.code {
  margin: 0;
  padding: 12px 14px;
  overflow: auto;
  max-height: 460px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  font: .875rem/1.55 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.j-key { color: #a142f4; } .j-str { color: #188038; } .j-num { color: #1a73e8; } .j-lit { color: #e8710a; }
@media (prefers-color-scheme: dark) { .j-key { color: #d7aefb; } .j-str { color: #81c995; } .j-num { color: #8ab4f8; } .j-lit { color: #fcad70; } }
.drop {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 150px;
  padding: 20px;
  border: 2px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--muted);
  text-align: center;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); color: var(--text); }
.drop svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.preview { display: grid; place-items: center; min-height: 120px; padding: 12px; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 12px; }
.preview img { max-width: 100%; max-height: 300px; }
.meter { height: 8px; background: var(--hover); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; transition: width .25s ease, background .25s ease; }
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
.list li > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list li.match { border-color: var(--ok); background: var(--ok-bg); }
.list li.miss { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
.hash-name { font-size: .8125rem; font-weight: 700; color: var(--muted); }
.hashes li { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; padding: 9px 10px 9px 14px; }
.hashes .mono { word-break: break-all; line-height: 1.5; }
.verdict { flex: none; font-size: .8125rem; font-weight: 700; white-space: nowrap; }
.match .verdict { color: var(--ok); }
.miss .verdict { color: var(--bad); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: paso; }
.steps li { position: relative; padding: 10px 12px 10px 44px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; font-size: .875rem; counter-increment: paso; }
.steps li::before { content: counter(paso); position: absolute; left: 12px; top: 10px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--accent)); color: #fff; font-size: .75rem; font-weight: 700; }
table.grid { width: 100%; border-collapse: collapse; font-size: .875rem; }
table.grid th, table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.grid th { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
table.grid td.mono { overflow-wrap: anywhere; }
.scroll { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 10px; }
.scroll table.grid th { position: sticky; top: 0; background: var(--surface); }
mark { padding: 0 1px; border-radius: 3px; background: var(--mark1); color: inherit; }
mark.alt { background: var(--mark2); }

/* Diferencias */
.diff-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; }
table.diff { width: 100%; border-collapse: collapse; font: .8125rem/1.5 var(--mono); }
table.diff td { padding: 1px 8px; vertical-align: top; }
table.diff td.n { width: 1%; padding: 1px 6px; color: var(--muted); text-align: right; user-select: none; white-space: nowrap; background: color-mix(in srgb, var(--hover) 60%, transparent); }
table.diff td.s { width: 1%; padding: 1px 4px; color: var(--muted); user-select: none; }
table.diff td.c { white-space: pre-wrap; overflow-wrap: anywhere; }
table.diff.side td.c { width: 49%; }
table.diff .del { background: var(--del-bg); }
table.diff .add { background: var(--add-bg); }
table.diff del { background: var(--del-mark); text-decoration: none; border-radius: 2px; }
table.diff ins { background: var(--add-mark); text-decoration: none; border-radius: 2px; }
table.diff tr.fold td { padding: 4px 10px; color: var(--muted); text-align: center; background: var(--hover); font-family: system-ui, sans-serif; }
table.diff td.blank { background: repeating-linear-gradient(-45deg, transparent 0 5px, var(--hover) 5px 7px); }

/* Colores */
.swatch { height: 120px; border-radius: 14px; border: 1px solid var(--line); background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px; overflow: hidden; }
.swatch i { display: block; height: 100%; }
.tones { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.tones button { aspect-ratio: 1; min-width: 0; border: 1px solid rgb(0 0 0 / .08); border-radius: 9px; transition: transform .15s ease; }
.tones button:hover { transform: scale(1.12); }
.contrast-demo { padding: 18px; border-radius: 12px; border: 1px solid var(--line); }
.contrast-demo b { display: block; font-size: 1.375rem; }
.badge { display: inline-flex; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: .8125rem; font-weight: 600; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }

/* QR */
.qr-box { display: grid; place-items: center; padding: 16px; background: var(--field); border: 1px solid var(--line); border-radius: 14px; }
.qr-box canvas { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }

/* JWT */
.jwt { margin: 0; padding: 12px 14px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; font: .875rem/1.55 var(--mono); overflow-wrap: anywhere; }
.jwt .p0 { color: #d93025; } .jwt .p1 { color: #a142f4; } .jwt .p2 { color: #1a73e8; }
@media (prefers-color-scheme: dark) { .jwt .p0 { color: #f28b82; } .jwt .p1 { color: #d7aefb; } .jwt .p2 { color: #8ab4f8; } }

/* Aviso */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 10;
  padding: 10px 18px;
  background: var(--text);
  color: var(--bg);
  border-radius: 99px;
  font-size: .875rem;
  font-weight: 600;
  box-shadow: 0 10px 30px -10px rgb(0 0 0 / .5);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Imágenes */
.stack { display: grid; gap: 18px; min-width: 0; }
.stack.small { gap: 12px; }
.sub { margin: 18px 0 0; font-size: .75rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.panel > .sub + * { margin-top: 8px; }
.row.opts { gap: 14px 26px; align-items: flex-end; }
.checker { background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
.img-source .drop { min-height: 170px; }
.img-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; min-width: 0; }
.img-thumb { display: grid; place-items: center; flex: none; width: 54px; height: 54px; overflow: hidden; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0 / 12px 12px; border: 1px solid var(--line); border-radius: 10px; color: var(--muted); }
.img-thumb img { max-width: 100%; max-height: 100%; }
.img-thumb svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.img-name { display: grid; flex: 1 1 170px; min-width: 0; }
.img-name b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.editor { display: grid; gap: 18px; min-width: 0; }
.ed-tabs { justify-self: start; max-width: 100%; }
.ed-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); gap: 18px; align-items: start; }

.lock[aria-pressed="true"] { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.lock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.ed-stage { display: grid; place-items: center; min-height: 280px; padding: 14px; overflow: hidden; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 12px; outline: none; }

.ed-inner { position: relative; max-width: 100%; line-height: 0; }
.ed-inner canvas, .ed-inner img { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; box-shadow: 0 2px 14px rgb(0 0 0 / .2); }
.ed-inner canvas.pixel { image-rendering: pixelated; }
.crop-layer { position: absolute; inset: 0; overflow: hidden; cursor: crosshair; touch-action: none; }
.crop-box {
  position: absolute;
  outline: 1.5px solid #fff;
  box-shadow: 0 0 0 100vmax rgb(0 0 0 / .55);
  cursor: move;
  background:
    linear-gradient(to right, transparent calc(33.33% - .5px), rgb(255 255 255 / .45) 0 calc(33.33% + .5px), transparent 0 calc(66.67% - .5px), rgb(255 255 255 / .45) 0 calc(66.67% + .5px), transparent 0),
    linear-gradient(to bottom, transparent calc(33.33% - .5px), rgb(255 255 255 / .45) 0 calc(33.33% + .5px), transparent 0 calc(66.67% - .5px), rgb(255 255 255 / .45) 0 calc(66.67% + .5px), transparent 0);
}
.crop-h { position: absolute; width: 20px; height: 20px; border: 0 solid #fff; filter: drop-shadow(0 0 1px rgb(0 0 0 / .6)); }
.crop-h::before { content: ""; position: absolute; inset: -10px; }
.crop-h.nw { left: -3px; top: -3px; border-width: 4px 0 0 4px; cursor: nwse-resize; }
.crop-h.ne { right: -3px; top: -3px; border-width: 4px 4px 0 0; cursor: nesw-resize; }
.crop-h.sw { left: -3px; bottom: -3px; border-width: 0 0 4px 4px; cursor: nesw-resize; }
.crop-h.se { right: -3px; bottom: -3px; border-width: 0 4px 4px 0; cursor: nwse-resize; }

.ed-sizes { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; }

.pos-row { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; }

.pos-grid { display: grid; grid-template-columns: repeat(3, 34px); gap: 4px; padding: 4px; background: var(--hover); border-radius: 11px; }

.cmp { --x: 50%; position: relative; width: 100%; max-height: 62vh; overflow: hidden; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 12px; cursor: ew-resize; touch-action: none; user-select: none; }

.loupe-tag { position: absolute; z-index: 2; width: 127px; padding: 1px 0; border-radius: 99px; background: rgb(0 0 0 / .72); color: #fff; font: 600 .75rem/1.6 var(--mono); text-align: center; pointer-events: none; }

/* Collage */
.cl-layouts { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }

.cl-layout:hover { border-color: var(--line-strong); color: var(--muted); }
.cl-layout[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--field)); }
.cl-layout svg { width: 100%; height: 100%; fill: currentColor; }
.cl-canvas { display: block; max-width: 100%; border-radius: 4px; box-shadow: 0 2px 14px rgb(0 0 0 / .2); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
.cl-canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.cl-stage.over { border-color: var(--accent); background-color: color-mix(in srgb, var(--accent) 8%, transparent); }

/* SQL */
.sql-out { min-height: 220px; white-space: pre; overflow-wrap: normal; tab-size: 4; }
.sq-k { color: #a142f4; font-weight: 600; } .sq-f { color: #1a73e8; } .sq-s { color: #188038; } .sq-n { color: #e8710a; } .sq-i { color: #c5221f; } .sq-c { color: var(--muted); font-style: italic; }
@media (prefers-color-scheme: dark) { .sq-k { color: #d7aefb; } .sq-f { color: #8ab4f8; } .sq-s { color: #81c995; } .sq-n { color: #fcad70; } .sq-i { color: #f28b82; } }

/* Markdown */
.md-tools { display: flex; flex-wrap: wrap; gap: 4px; }
.md-tools .btn.small .face { min-height: 32px; padding: 4px 8px; }
textarea.md-src { height: clamp(420px, 68vh, 920px); }
.md-preview { height: calc(clamp(420px, 68vh, 920px) + 44px); overflow: auto; padding: 2px 16px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; line-height: 1.6; overflow-wrap: anywhere; }
.md-preview :is(h1, h2, h3, h4, h5, h6) { margin: 1.2em 0 .5em; line-height: 1.25; letter-spacing: -.01em; }
.md-preview :is(h1, h2) { padding-bottom: .3em; border-bottom: 1px solid var(--line); }
.md-preview h1 { font-size: 1.75rem; }
.md-preview h2 { font-size: 1.375rem; }
.md-preview h3 { font-size: 1.125rem; }
.md-preview h4, .md-preview h5, .md-preview h6 { font-size: 1rem; }
.md-preview :is(p, ul, ol, blockquote, pre, table) { margin: 0 0 .9em; }
.md-preview :is(ul, ol) { padding-left: 1.6em; }

.md-preview li > :is(ul, ol) { margin: .2em 0 0; }
.md-preview li.task { list-style: none; }
.md-preview li.task input { margin: 0 .45em 0 -1.35em; vertical-align: -1px; }
.md-preview code { padding: .12em .4em; background: var(--hover); border-radius: 6px; font: .875em var(--mono); }
.md-preview pre { padding: 12px 14px; overflow: auto; background: var(--hover); border-radius: 10px; }

.md-preview table { display: block; max-width: 100%; overflow: auto; border-collapse: collapse; }
.md-preview :is(th, td) { padding: 6px 12px; border: 1px solid var(--line); }
.md-preview th { background: var(--hover); }
.md-preview hr { height: 2px; margin: 1.4em 0; border: 0; background: var(--line); }
.md-preview img { max-width: 100%; }
.md-preview a { color: var(--accent); }
.md-img-off, .md-blocked { display: inline-block; padding: 1px 9px; border: 1px dashed var(--line-strong); border-radius: 8px; color: var(--muted); font-size: .8125rem; }
.hv-view { display: grid; gap: 10px; }
.hv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
textarea.hv-src { height: calc(clamp(380px, 68vh, 920px) + 42px); }
.hv-stage { position: relative; height: clamp(380px, 68vh, 920px); overflow: hidden; background: var(--hover); border: 1px solid var(--line); border-radius: 10px; }
.hv-box { position: relative; height: 100%; margin: 0 auto; overflow: hidden; }

.hv-frame { position: absolute; top: 0; left: 0; display: block; width: 100%; height: 100%; border: 0; background: #fff; transform-origin: 0 0; }
.hv-tag { position: absolute; right: 8px; bottom: 8px; padding: 1px 8px; background: rgb(0 0 0 / .6); border-radius: 7px; color: #fff; font: 600 .6875rem/1.6 var(--mono); pointer-events: none; }
.hv-full { position: fixed; inset: 0; z-index: 60; grid-template-rows: auto minmax(0, 1fr); margin: 0 !important; padding: 12px; background: var(--bg); }
.hv-full .hv-stage { height: auto; }
.hv-lock, .hv-lock body { overflow: hidden; }
.hv-drop.over { outline: 2px dashed var(--accent); outline-offset: -8px; }
.hv-console { overflow: hidden; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
.hv-con-head { display: flex; align-items: center; gap: 10px; padding: 5px 6px 5px 12px; border-bottom: 1px solid var(--line); font-size: .8125rem; }

.hv-log .info { color: var(--accent); }

@media (max-width: 860px) {
  .ed-grid { grid-template-columns: minmax(0, 1fr); }

}

@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

@media (max-width: 600px) {
  .wrap { padding: 20px 16px 48px; }

  .search kbd { display: none; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card .face { min-height: 140px; padding: 14px; }

<body>
<div class="wrap">
  <main id="home">
    <header class="hero">
      <div>
        <h1>Navaja <span>suiza</span></h1>
        <p id="heroText"></p>
      </div>
      <label class="search glow">
        <span class="face">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Buscar herramienta…" autocomplete="off" aria-label="Buscar herramienta">
          <kbd>/</kbd>
        </span>
      </label>
    </header>
    <div id="board"></div>
    <p class="empty" id="empty" hidden>No hay herramientas que coincidan con tu búsqueda.</p>
  </main>

  <main id="view" hidden>
    <header class="tool-head">
      <a class="btn glow icon" href="#" id="btnBack" aria-label="Volver a las herramientas" title="Volver (Esc)">
        <span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
      </a>
      <span class="tile" id="viewTile"></span>
      <div>
        <h1 id="viewTitle"></h1>
        <p id="viewDesc"></p>
      </div>

    <div class="tool-body" id="viewBody"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- Utilidades generales ---------- */

const $ = id => document.getElementById(id);

function h(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'style') node.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'readOnly' || k === 'rows' || k === 'spellcheck') node[k] = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) node.append(kid);
  return node;
}

function svg(paths, cls) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  node.setAttribute('viewBox', '0 0 24 24');
  node.setAttribute('aria-hidden', 'true');
  if (cls) node.setAttribute('class', cls);
  node.innerHTML = paths;
  return node;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtNum = n => new Intl.NumberFormat('es').format(n);
function fmtBytes(n) {
  if (n < 1024) return `${fmtNum(n)} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1).replace('.', ',')} KB`;
  return `${(n / 1024 / 1024).toFixed(2).replace('.', ',')} MB`;
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
const joinY = list => list.length <= 1 ? list.join('') : `${list.slice(0, -1).join(', ')} y ${list[list.length - 1]}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const enc = new TextEncoder();
const bytesToHex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

let toastTimer;
function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), Math.max(1800, message.length * 60));
}

async function copyText(text) {
  if (!text) { toast('No hay nada para copiar'); return; }
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const t = h('textarea', { value: text, style: 'position:fixed;opacity:0' });
    document.body.append(t);
    t.select();
    document.execCommand('copy');
    t.remove();
  }
  toast('Copiado al portapapeles');
}

/*
  Guardar archivos.
  - Donde se puede (Chrome y Edge), se abre la ventana «Guardar como» y la página escribe el archivo
    ella misma. No pasa por el gestor de descargas, que en algunos equipos tarda 15–20 s en mostrar
    la descarga mientras la revisa, y se sabe cuándo terminó.
  - Si no se puede, se usa la descarga normal. Como ahí no se sabe cuándo aparece, el mismo archivo
    pedido otra vez en menos de 30 s se ignora, para no bajar copias por los clics repetidos.
  - Dentro del lanzador lo hace la página principal: el navegador no deja abrir «Guardar como» ni
    descargar desde un marco de otro origen (como pasa al abrir los archivos con file://).
  Resultado: 'saved' (guardado), 'cancelled' (cerró la ventana), 'started' (descarga normal enviada)
  o 'repeated' (ignorado por repetido).
*/
const REPEAT_MS = 30000;
let lastFallback = { key: '', at: 0 };

function pickSaveFile(name, blob) {
  const ext = (/\.([a-z0-9]+)$/i.exec(name) || [])[1];
  const mime = (blob.type || 'application/octet-stream').split(';')[0];
  const opts = { suggestedName: name };
  if (ext) opts.types = [{ description: `Archivo .${ext.toLowerCase()}`, accept: { [mime]: [`.${ext.toLowerCase()}`] } }];
  return window.showSaveFilePicker(opts).catch(e => {
    if (e.name === 'TypeError' && opts.types) return window.showSaveFilePicker({ suggestedName: name });
    throw e;
  });
}

async function saveHere(name, blob) {
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await pickSaveFile(name, blob);
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return 'saved';
    } catch (e) {
      if (e.name === 'AbortError') return 'cancelled';
      // Sin permiso para la ventana (por ejemplo, sin clic reciente): se usa la descarga normal.
    }
  }
  const key = `${name}|${blob.size}|${blob.type}`;
  if (key === lastFallback.key && Date.now() - lastFallback.at < REPEAT_MS) return 'repeated';
  lastFallback = { key, at: Date.now() };
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'started';
}

let downloadSeq = 0;
const pendingDownloads = new Map();
window.addEventListener('message', e => {
  const d = e.data;
  if (e.source !== window.parent || !d || d.launcher !== true) return;
  const pending = pendingDownloads.get(d.id);
  if (!pending) return;
  if (d.type === 'download-ack') {
    clearTimeout(pending.timer);
    pending.timer = setTimeout(() => pending.finish('started'), 600000);
  } else if (d.type === 'download-result') {
    pending.finish(String(d.status));
  }
});

function download(name, data, type = 'text/plain') {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  if (window.parent === window) return saveHere(name, blob);
  return new Promise(resolve => {
    const id = ++downloadSeq;
    const pending = {
      finish(status) { clearTimeout(pending.timer); pendingDownloads.delete(id); resolve(status); },
      // Si el lanzador no confirma enseguida (una versión antigua en caché), se da por enviada.
      timer: setTimeout(() => pending.finish('started'), 1500),
    };
    pendingDownloads.set(id, pending);
    parent.postMessage({ launcher: true, type: 'download', id, name, blob }, location.protocol === 'file:' ? '*' : location.origin);
  });
}

/* ---------- Almacenamiento por herramienta ---------- */

const pendingSaves = new Map();
const liveCtx = new Map();
function makeCtx(id) {
  const key = `navaja.tool.${id}`;
  let data = {};
  try { data = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { data = {}; }
  const write = () => {
    pendingSaves.delete(key);
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { /* sin espacio o sin almacenamiento */ }
  };
  let timer;
  const api = {
    get: (k, fallback) => (k in data ? data[k] : fallback),
    set(k, v) {
      if (typeof v === 'string' && v.length > 200000) v = '';
      data[k] = v;
      clearTimeout(timer);
      pendingSaves.set(key, write);
      timer = setTimeout(write, 300);
    },
    // Olvida todo lo guardado, también lo que estaba por escribirse.
    clear() {
      clearTimeout(timer);
      pendingSaves.delete(key);
      data = {};
      try { localStorage.removeItem(key); } catch (e) { /* sin almacenamiento */ }
    },
  };
  liveCtx.set(key, api);
  return api;
}
function forgetTool(id) {
  const key = `navaja.tool.${id}`;
  const live = liveCtx.get(key);
  if (live) live.clear();
  else { pendingSaves.delete(key); try { localStorage.removeItem(key); } catch (e) { /* sin almacenamiento */ } }
}
window.addEventListener('pagehide', () => { for (const write of [...pendingSaves.values()]) write(); });

function loadPref(k, fallback) {
  try { const v = localStorage.getItem(`navaja.${k}`); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function savePref(k, v) {
  try { localStorage.setItem(`navaja.${k}`, JSON.stringify(v)); } catch (e) { /* sin preferencia guardada */ }
}

function downloadBtn(label, getFile, opts = {}) {

  box.addEventListener('change', () => { if (ctx && key) ctx.set(key, box.checked); if (onchange) onchange(box.checked); });
  const node = h('label', { class: 'check' }, box, label);
  node.input = box;
  return node;

function seg(ctx, key, options, value, onchange) {
  const node = h('div', { class: 'seg', role: 'group' });
  let current = ctx && key ? ctx.get(key, value) : value;
  if (!options.some(([v]) => v === current)) current = value;
  const paint = () => { for (const b of node.children) b.setAttribute('aria-pressed', String(b.dataset.v === current)); };
  for (const [v, label] of options) {
    node.append(h('button', { type: 'button', 'data-v': v, text: label, onclick: () => {
      current = v;
      if (ctx && key) ctx.set(key, v);
      paint();
      if (onchange) onchange(v);
    } }));
  }
  paint();
  Object.defineProperty(node, 'value', { get: () => current });
  return node;
}

  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });

}

function highlightJson(s) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let out = '';
  let last = 0;
  for (const m of s.matchAll(re)) {
    out += esc(s.slice(last, m.index));
    if (m[1]) out += m[2] ? `<span class="j-key">${esc(m[1])}</span>${esc(m[2])}` : `<span class="j-str">${esc(m[1])}</span>`;
    else if (m[3]) out += `<span class="j-lit">${m[3]}</span>`;
    else out += `<span class="j-num">${m[4]}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

// Diferencia mínima entre dos secuencias (LCS), con atajo por prefijo y sufijo comunes.
function diffSeq(a, b, eq = (x, y) => x === y) {
  let start = 0;
  while (start < a.length && start < b.length && eq(a[start], b[start])) start++;
  let endA = a.length;
  let endB = b.length;
  while (endA > start && endB > start && eq(a[endA - 1], b[endB - 1])) { endA--; endB--; }
  const n = endA - start;
  const m = endB - start;
  if (n * m > 8e6) return null;
  const w = m + 1;
  const L = new Uint32Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      L[i * w + j] = eq(a[start + i], b[start + j]) ? L[(i + 1) * w + j + 1] + 1 : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
    }
  }
  const ops = [];
  for (let k = 0; k < start; k++) ops.push({ t: '=', a: k, b: k });
  let i = 0;
  let j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && eq(a[start + i], b[start + j])) { ops.push({ t: '=', a: start + i, b: start + j }); i++; j++; }
    else if (i < n && (j >= m || L[(i + 1) * w + j] >= L[i * w + j + 1])) { ops.push({ t: '-', a: start + i }); i++; }
    else { ops.push({ t: '+', b: start + j }); j++; }
  }
  for (let k = 0; k < a.length - endA; k++) ops.push({ t: '=', a: endA + k, b: endB + k });
  return ops;
}

const diffTokens = s => s.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]/gu) || [];
function wordDiff(x, y) {
  const ta = diffTokens(x);
  const tb = diffTokens(y);
  const ops = diffSeq(ta, tb);
  if (!ops) return [esc(x), esc(y)];
  let l = '';
  let r = '';
  for (const o of ops) {
    if (o.t === '=') { l += esc(ta[o.a]); r += esc(tb[o.b]); }
    else if (o.t === '-') l += `<del>${esc(ta[o.a])}</del>`;
    else r += `<ins>${esc(tb[o.b])}</ins>`;
  }
  return [l.replaceAll('</del><del>', ''), r.replaceAll('</ins><ins>', '')];
}

function buildDiff(aText, bText, opts) {
  const a = aText.split(/\r?\n/);
  const b = bText.split(/\r?\n/);
  const norm = s => {
    if (opts.ws) s = s.replace(/\s+/g, ' ').trim();
    if (opts.ci) s = s.toLowerCase();
    return s;
  };
  const ops = diffSeq(a.map(norm), b.map(norm));
  if (!ops) return { html: '<p class="note" style="padding:12px">Los textos son demasiado grandes para compararlos aquí.</p>', added: 0, removed: 0 };
  const rows = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k].t === '=') { rows.push({ t: 'eq', ai: ops[k].a, bi: ops[k].b }); k++; continue; }
    const dels = [];
    const adds = [];
    while (k < ops.length && ops[k].t !== '=') { (ops[k].t === '-' ? dels : adds).push(ops[k]); k++; }
    for (let i = 0; i < Math.max(dels.length, adds.length); i++) {
      rows.push({ t: dels[i] && adds[i] ? 'mod' : dels[i] ? 'del' : 'add', ai: dels[i] ? dels[i].a : null, bi: adds[i] ? adds[i].b : null });
    }
  }
  const added = rows.filter(r => r.bi != null && r.t !== 'eq').length;
  const removed = rows.filter(r => r.ai != null && r.t !== 'eq').length;
  // Solo cambios: se dejan 3 líneas de contexto alrededor de cada cambio.
  const keep = rows.map(() => !opts.fold);
  if (opts.fold) rows.forEach((r, i) => { if (r.t !== 'eq') for (let d = -3; d <= 3; d++) if (rows[i + d]) keep[i + d] = true; });
  let html = `<table class="diff ${opts.view === 'side' ? 'side' : 'uni'}">`;
  const td = (cls, content) => `<td class="${cls}">${content}</td>`;
  for (let i = 0; i < rows.length; i++) {
    if (!keep[i]) {
      let j = i;
      while (j < rows.length && !keep[j]) j++;
      html += `<tr class="fold"><td colspan="4">··· ${fmtNum(j - i)} líneas sin cambios ···</td></tr>`;
      i = j - 1;
      continue;
    }
    const r = rows[i];
    const la = r.ai != null ? a[r.ai] : '';
    const lb = r.bi != null ? b[r.bi] : '';
    const [wa, wb] = r.t === 'mod' ? wordDiff(la, lb) : [esc(la), esc(lb)];
    const na = r.ai != null ? r.ai + 1 : '';
    const nb = r.bi != null ? r.bi + 1 : '';
    if (opts.view === 'side') {
      const left = r.t === 'add' ? td('n blank', '') + td('c blank', '') : td(`n${r.t === 'eq' ? '' : ' del'}`, na) + td(`c${r.t === 'eq' ? '' : ' del'}`, wa);
      const right = r.t === 'del' ? td('n blank', '') + td('c blank', '') : td(`n${r.t === 'eq' ? '' : ' add'}`, nb) + td(`c${r.t === 'eq' ? '' : ' add'}`, wb);
      html += `<tr>${left}${right}</tr>`;
    } else if (r.t === 'eq') {
      html += `<tr>${td('n', na)}${td('n', nb)}${td('s', ' ')}${td('c', wa)}</tr>`;
    } else {
      if (r.ai != null) html += `<tr class="del">${td('n', na)}${td('n', '')}${td('s', '−')}${td('c', wa)}</tr>`;
      if (r.bi != null) html += `<tr class="add">${td('n', '')}${td('n', nb)}${td('s', '+')}${td('c', wb)}</tr>`;
    }
  }
  return { html: `${html}</table>`, added, removed };
}

/* ---------- Markdown ----------
   Parser propio (CommonMark y GFM en lo esencial). Todo el texto se escapa: el HTML escrito a mano se
   ve como texto y solo se aceptan enlaces http(s), mailto, anclas # y rutas relativas. */

const MD_LIST = /^( {0,3})([-*+]|\d{1,9}[.)])(?:( +)(.*))?$/;
const MD_HR = /^ {0,3}([-*_])(?:[ \t]*\1){2,}[ \t]*$/;
const MD_TABLE_SEP = /^ {0,3}\|?[ \t]*:?-+:?[ \t]*(?:\|[ \t]*:?-+:?[ \t]*)*\|?[ \t]*$/;
const mdBlockStart = l => /^ {0,3}(#{1,6}(\s|$)|>|```|~~~)/.test(l) || MD_HR.test(l) || MD_LIST.test(l);

function mdUrl(url, image) {
  const u = url.trim().replace(/[\u0000-\u001f\u007f]/g, '');
  const scheme = /^([a-z][a-z0-9+.-]*):/i.exec(u.replace(/\s/g, ''));
  if (!scheme) return u;
  const s = scheme[1].toLowerCase();
  if (s === 'http' || s === 'https' || (!image && s === 'mailto')) return u;
  if (image && /^data:image\/(png|jpe?g|gif|webp|avif);base64,/i.test(u)) return u;
  return null;
}
function mdSlug(text, used) {
  const s = text.toLowerCase().replace(/\[([^\]]*)\]\([^)]*\)/g, '$1').replace(/[^\p{L}\p{N}\s_-]/gu, '').trim().replace(/\s+/g, '-') || 'seccion';
  let out = s;
  for (let n = 1; used.has(out); n++) out = `${s}-${n}`;
  used.add(out);
  return out;
}
function mdCells(line) {
  let s = line.trim();
  if (s.startsWith('|')) s = s.slice(1);
  if (s.endsWith('|') && !s.endsWith('\\|')) s = s.slice(0, -1);
  const cells = [];
  let cur = '';
  for (let i = 0; i < s.length; i++) {
    if (s[i] === '\\' && s[i + 1] === '|') { cur += '\\|'; i++; }
    else if (s[i] === '|') { cells.push(cur.trim()); cur = ''; }
    else cur += s[i];
  }
  cells.push(cur.trim());
  return cells;
}

// Lo que ya está convertido se aparta en «huecos» (\u0001n\u0002) para que los pasos siguientes no lo toquen.
const MD_LINK = /(!?)\[((?:[^[\]\\]|\\.|\[[^[\]]*\])*)\]\(\s*(<[^<>\n]*>|[^\s()<>]*(?:\([^\s()<>]*\)[^\s()<>]*)*)(?:\s+("[^"]*"|'[^']*'))?\s*\)/g;
function mdSpan(src, env, slots, inLink) {
  const keep = html => `\u0001${slots.push(html) - 1}\u0002`;
  let s = src;
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, ticks, code) => keep(`<code>${esc(code.replace(/\n/g, ' ').replace(/^ ([\s\S]*[^ ][\s\S]*) $/, '$1'))}</code>`));
  s = s.replace(/\\([\\`*_{}[\]()#+\-.!|~<>"'$&])/g, (_, c) => keep(esc(c)));
  s = s.replace(MD_LINK, (all, bang, text, url, title) => {
    const href = mdUrl(url.startsWith('<') ? url.slice(1, -1) : url, !!bang);
    const tt = title ? ` title="${esc(title.slice(1, -1))}"` : '';
    if (bang) {
      const alt = esc(text.replace(/\u0001\d+\u0002/g, ''));
      if (!href) return keep(`<span class="md-blocked">[imagen bloqueada: ${alt}]</span>`);
      if (env.preview && !env.remote && /^(https?:)?\/\//i.test(href)) return keep(`<span class="md-img-off" title="${esc(href)}">Imagen de internet: ${alt || 'sin texto'}</span>`);
      return keep(`<img src="${esc(href)}" alt="${alt}"${tt}>`);
    }
    if (inLink) return all;
    const inner = mdSpan(text, env, slots, true);
    if (!href) return keep(`<span class="md-blocked" title="Enlace bloqueado por seguridad">${inner}</span>`);
    const target = env.preview && !href.startsWith('#') ? ' target="_blank" rel="noopener noreferrer"' : '';
    return keep(`<a href="${esc(href)}"${tt}${target}>${inner}</a>`);
  });
  if (!inLink) {
    const target = env.preview ? ' target="_blank" rel="noopener noreferrer"' : '';
    s = s.replace(/<((?:https?|mailto):[^\s<>]*|[\w.+-]+@[\w-]+(?:\.[\w-]+)+)>/gi, (all, u) => {
      const href = mdUrl(/^[\w.+-]+@/.test(u) ? `mailto:${u}` : u);
      return href ? keep(`<a href="${esc(href)}"${target}>${esc(u)}</a>`) : all;
    });
    s = s.replace(/\bhttps?:\/\/[^\s<>\u0001\u0002]*[^\s<>\u0001\u0002.,:;"')\]!?*_~]/g, u => keep(`<a href="${esc(u)}"${target}>${esc(u)}</a>`));
  }
  s = esc(s);
  s = s.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^\p{L}\p{N}_])__(?=\S)([\s\S]*?\S)__(?![\p{L}\p{N}_])/gu, '$1<strong>$2</strong>');
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>');
  s = s.replace(/\*(?=\S)([\s\S]*?\S)\*/g, '<em>$1</em>');
  s = s.replace(/(^|[^\p{L}\p{N}_])_(?=\S)([\s\S]*?\S)_(?![\p{L}\p{N}_])/gu, '$1<em>$2</em>');
  s = s.replace(/(?: {2,}|\\)\n/g, '<br>\n');
  return s;
}
function mdInline(src, env) {
  const slots = [];
  let s = mdSpan(src.replace(/[\u0001\u0002]/g, ''), env, slots, false);
  for (let i = 0; i < 6 && /\u0001\d+\u0002/.test(s); i++) s = s.replace(/\u0001(\d+)\u0002/g, (_, n) => slots[n] ?? '');
  return s;
}

function mdList(lines, start, env) {
  const first = MD_LIST.exec(lines[start]);
  const ordered = /\d/.test(first[2]);
  const mark = first[2].slice(-1);
  const items = [];
  let loose = false;
  let i = start;
  while (i < lines.length) {
    const m = MD_LIST.exec(lines[i]);
    if (!m || /\d/.test(m[2]) !== ordered || m[2].slice(-1) !== mark) break;
    const spaces = m[3] ? m[3].length : 1;
    const offset = m[1].length + m[2].length + (spaces > 4 ? 1 : spaces);
    const body = [spaces > 4 ? ' '.repeat(spaces - 1) + (m[4] || '') : (m[4] || '')];
    i++;
    let blank = false;
    while (i < lines.length) {
      const l = lines[i];
      if (!l.trim()) { body.push(''); blank = true; i++; continue; }
      if (l.match(/^ */)[0].length >= offset) { body.push(l.slice(offset)); blank = false; i++; continue; }
      if (!blank && !mdBlockStart(l)) { body.push(l.trim()); i++; continue; }
      break;
    }
    let trailing = 0;
    while (body.length > 1 && !body[body.length - 1].trim()) { body.pop(); trailing++; }
    if (body.some(l => !l.trim())) loose = true;
    items.push(body);
    const next = i < lines.length && MD_LIST.exec(lines[i]);
    const sibling = next && /\d/.test(next[2]) === ordered && next[2].slice(-1) === mark;
    if (trailing && sibling) loose = true;
    if (!sibling) break;
  }
  const html = items.map(body => {
    const task = /^\[([ xX])\](?:[ \t]+|$)/.exec(body[0]);
    const lines2 = task ? [body[0].slice(task[0].length), ...body.slice(1)] : body;
    let inner = mdBlocks(lines2, env, !loose).trim();
    if (task) {
      const box = `<input type="checkbox" disabled${task[1] !== ' ' ? ' checked' : ''}> `;
      inner = inner.startsWith('<p>') ? `<p>${box}${inner.slice(3)}` : box + inner;
    }
    return `<li${task ? ' class="task"' : ''}>${inner}</li>`;
  }).join('\n');
  const num = ordered ? parseInt(first[2], 10) : 1;
  const tag = ordered ? 'ol' : 'ul';
  return { html: `<${tag}${ordered && num !== 1 ? ` start="${num}"` : ''}>\n${html}\n</${tag}>\n`, next: i };
}

function mdBlocks(lines, env, tight = false) {
  let out = '';
  let para = [];
  const heading = (n, text) => `<h${n} id="${env.idPrefix}${mdSlug(text, env.slugs)}">${mdInline(text, env)}</h${n}>\n`;
  const flush = () => {
    if (!para.length) return;
    const html = mdInline(para.map(l => l.replace(/^[ \t]+/, '')).join('\n').replace(/[ \t]+$/, ''), env);
    out += tight ? `${html}\n` : `<p>${html}</p>\n`;
    para = [];
  };
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    let m;
    if (!line.trim()) { flush(); i++; continue; }
    if ((m = /^( {0,3})(`{3,}|~{3,})[ \t]*([^`\s]*)[^`]*$/.exec(line))) {
      flush();
      const fence = m[2];
      const close = new RegExp(`^ {0,3}${fence[0] === '`' ? '`' : '~'}{${fence.length},}[ \\t]*$`);
      const code = [];
      for (i++; i < lines.length && !close.test(lines[i]); i++) code.push(lines[i].replace(new RegExp(`^ {0,${m[1].length}}`), ''));
      i++;
      const lang = m[3].replace(/[^\w+#.-]/g, '');
      out += `<pre><code${lang ? ` class="language-${esc(lang)}"` : ''}>${esc(code.join('\n'))}${code.length ? '\n' : ''}</code></pre>\n`;
      continue;
    }
    if ((m = /^ {0,3}(#{1,6})(?:[ \t]+(.*?))?(?:[ \t]+#+)?[ \t]*$/.exec(line))) {
      flush();
      out += heading(m[1].length, (m[2] || '').trim());
      i++;
      continue;
    }
    if (para.length && /^ {0,3}(=+|-+)[ \t]*$/.test(line)) {
      const text = para.map(l => l.trim()).join(' ');
      para = [];
      out += heading(line.trim()[0] === '=' ? 1 : 2, text);
      i++;
      continue;
    }
    if (MD_HR.test(line)) { flush(); out += '<hr>\n'; i++; continue; }
    if (/^ {0,3}>/.test(line)) {
      flush();
      const inner = [];
      while (i < lines.length && /^ {0,3}>/.test(lines[i])) inner.push(lines[i++].replace(/^ {0,3}> ?/, ''));
      out += `<blockquote>\n${mdBlocks(inner, env)}</blockquote>\n`;
      continue;
    }
    // Una lista puede cortar un párrafo, pero una numerada solo si empieza por 1.
    if (MD_LIST.test(line) && (!para.length || /^ {0,3}([-*+]|1[.)]) +\S/.test(line))) {
      flush();
      const r = mdList(lines, i, env);
      out += r.html;
      i = r.next;
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && MD_TABLE_SEP.test(lines[i + 1])) {
      const head = mdCells(line);
      const aligns = mdCells(lines[i + 1]).map(c => (/^:-+:$/.test(c) ? 'center' : /^-+:$/.test(c) ? 'right' : /^:-+$/.test(c) ? 'left' : ''));
      if (head.length === aligns.length) {
        flush();
        const rows = [];
        for (i += 2; i < lines.length && lines[i].trim() && lines[i].includes('|') && !mdBlockStart(lines[i]); i++) rows.push(mdCells(lines[i]));
        const cell = (tag, text, k) => `<${tag}${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${mdInline(text, env)}</${tag}>`;
        out += `<table>\n<thead>\n<tr>${head.map((c, k) => cell('th', c, k)).join('')}</tr>\n</thead>\n`;
        if (rows.length) out += `<tbody>\n${rows.map(r => `<tr>${head.map((_, k) => cell('td', r[k] ?? '', k)).join('')}</tr>`).join('\n')}\n</tbody>\n`;
        out += '</table>\n';
        continue;
      }
    }
    para.push(line);
    i++;
  }
  flush();
  return out;
}

function mdToHtml(src, opts = {}) {
  const env = { idPrefix: opts.idPrefix || '', preview: !!opts.preview, remote: !!opts.remote, slugs: new Set() };
  return mdBlocks(src.replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n'), env);
}

tool({
  id: 'markdown', cat: 'texto', name: 'Markdown', color: '#37474f',
  desc: 'Escribe Markdown y míralo convertido al momento. Copia el HTML o guárdalo.',
  keywords: 'markdown md readme vista previa preview html convertir editor github gfm tabla',
  icon: '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 15V9l3 3 3-3v6M17 9v6M14.5 12.5 17 15l2.5-2.5"/>',
  render(body, ctx) {
    const src = textarea(ctx, 'md', { rows: 24, value: MD_SAMPLE, label: 'Texto en Markdown', placeholder: 'Escribe aquí en Markdown…' });
    src.classList.add('md-src');
    const preview = h('div', { class: 'md-preview' });
    const counts = h('span', { class: 'note' });
    const remote = check(ctx, 'remote', 'Mostrar imágenes de internet', false, () => paint());
    const paint = () => {
      preview.innerHTML = mdToHtml(src.value, { preview: true, remote: remote.input.checked, idPrefix: 'md-' });
      counts.textContent = `${fmtNum((src.value.match(WORD_RE) || []).length)} palabras · ${fmtNum(graphemes(src.value))} caracteres`;
    };
    src.addEventListener('input', debounce(paint, 120));
    preview.addEventListener('click', e => {
      const a = e.target.closest('a');
      const href = a ? a.getAttribute('href') || '' : '';
      if (!href.startsWith('#')) return;
      // Las anclas llevan a los títulos de la vista previa, sin salir de la herramienta.
      e.preventDefault();
      let id = href.slice(1);
      try { id = decodeURIComponent(id); } catch (err) { /* se usa tal cual */ }
      const target = preview.querySelector(`#md-${CSS.escape(id)}`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });

    // Barra de formato. Con execCommand el cambio entra en el historial de deshacer (Ctrl+Z).
    const insert = (text, selStart, selEnd) => {
      src.focus();
      if (!document.execCommand('insertText', false, text)) {
        src.setRangeText(text);
        src.dispatchEvent(new Event('input', { bubbles: true }));
      }
      if (selStart != null) src.setSelectionRange(selStart, selEnd);
    };
    const wrap = (before, after, placeholder) => {
      const { selectionStart: a, selectionEnd: b, value } = src;
      const sel = value.slice(a, b) || placeholder;
      src.focus();
      src.setSelectionRange(a, b);
      insert(before + sel + after, a + before.length, a + before.length + sel.length);
    };
    const lines = make => {
      const { selectionStart: a, selectionEnd: b, value } = src;
      const start = value.lastIndexOf('\n', a - 1) + 1;
      let end = value.indexOf('\n', b > a ? b - 1 : b);
      if (end < 0) end = value.length;
      const text = value.slice(start, end).split('\n').map(make).join('\n');
      src.focus();
      src.setSelectionRange(start, end);
      insert(text, start, start + text.length);
    };
    const toggle = (re, add) => l => (re.test(l) ? l.replace(re, '') : add(l));
    const actions = {
      bold: () => wrap('**', '**', 'texto en negrita'),
      italic: () => wrap('*', '*', 'texto en cursiva'),
      strike: () => wrap('~~', '~~', 'texto tachado'),
      heading: () => lines(l => (/^#{1,5} /.test(l) ? `#${l}` : /^#{6} /.test(l) ? l.replace(/^#+ /, '') : `## ${l}`)),
      link: () => {
        const { selectionStart: a, selectionEnd: b, value } = src;
        const sel = value.slice(a, b) || 'texto del enlace';
        src.focus();
        src.setSelectionRange(a, b);
        const at = a + sel.length + 3;
        insert(`[${sel}](https://)`, at, at + 8);
      },
      code: () => (src.value.slice(src.selectionStart, src.selectionEnd).includes('\n') ? wrap('```\n', '\n```', '') : wrap('`', '`', 'código')),
      list: () => lines(toggle(/^- (?!\[[ xX]\] )/, l => `- ${l}`)),
      olist: () => lines((l, i) => (/^\d+\. /.test(l) ? l.replace(/^\d+\. /, '') : `${i + 1}. ${l}`)),
      task: () => lines(toggle(/^- \[[ xX]\] /, l => `- [ ] ${l.replace(/^- /, '')}`)),
      quote: () => lines(toggle(/^> ?/, l => `> ${l}`)),
      table: () => insert(`${src.selectionStart > 0 && src.value[src.selectionStart - 1] !== '\n' ? '\n\n' : ''}| Columna 1 | Columna 2 |\n| --- | --- |\n| Dato | Dato |\n`),
    };
    const tools = [['bold', 'Negrita (Ctrl+B)'], ['italic', 'Cursiva (Ctrl+I)'], ['strike', 'Tachado'], ['heading', 'Título'], ['link', 'Enlace (Ctrl+K)'],
      ['code', 'Código'], ['list', 'Lista'], ['olist', 'Lista numerada'], ['task', 'Lista de tareas'], ['quote', 'Cita'], ['table', 'Tabla']];
    const bar = h('div', { class: 'md-tools', role: 'toolbar', 'aria-label': 'Formato' }, tools.map(([k, title]) => btn('', actions[k], { icon: MD_ICON[k], small: true, title })));
    src.addEventListener('keydown', e => {
      if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
      const k = { b: 'bold', i: 'italic', k: 'link' }[e.key.toLowerCase()];
      if (k) { e.preventDefault(); actions[k](); }
    });

    const html = () => mdToHtml(src.value);
    const title = () => {
      const m = /^ {0,3}#{1,6}[ \t]+(.+?)[ \t#]*$/m.exec(src.value);
      return m ? m[1].replace(/[*_`~[\]]/g, '').trim() : 'Documento';
    };
    const fileBase = () => title().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'documento';
    const page = () => `<!doctype html>\n<html lang="es">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n<title>${esc(title())}</title>\n<style>\n${MD_EXPORT_CSS}\n</style>\n</head>\n<body>\n${html()}</body>\n</html>\n`;
    body.append(splitCols(
      panel('Markdown', bar, src, h('div', { class: 'row' }, counts, h('span', { class: 'spacer' }),
        btn('Ejemplo', () => setValue(src, MD_SAMPLE), { icon: 'refresh', small: true }), btn('Limpiar', () => setValue(src, ''), { icon: 'clear', small: true }))),
      panel('Vista previa', preview, remote,
        h('div', { class: 'row' }, copyBtn(html, 'Copiar HTML'),
          downloadBtn('Guardar .md', () => src.value.trim() && { name: `${fileBase()}.md`, data: src.value, type: 'text/markdown' }),
          downloadBtn('Guardar .html', () => src.value.trim() && { name: `${fileBase()}.html`, data: page(), type: 'text/html' }))),
    ));
    paint();
  },
});

function slider(label, value, min, max, step, unit, oninput, reset) {
  const out = h('output');

  r.value = value;

function makeCanvas(w, hgt) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(hgt));
  return c;
}
function smooth(c) {
  const g = c.getContext('2d');
  g.imageSmoothingEnabled = true;
  g.imageSmoothingQuality = 'high';
  return g;
}
// Cambia el tamaño con buena calidad: al reducir mucho, lo hace a la mitad varias veces para que no
// salgan dientes de sierra ni se pierdan detalles finos.
function resample(src, sw, sh, w, hgt) {
  let cur = src;
  let cw = sw;
  let ch = sh;
  while (cw > w * 2 && ch > hgt * 2) {
    const next = makeCanvas(cw / 2, ch / 2);
    smooth(next).drawImage(cur, 0, 0, cw, ch, 0, 0, next.width, next.height);
    cur = next;
    cw = next.width;
    ch = next.height;
  }
  const out = makeCanvas(w, hgt);
  smooth(out).drawImage(cur, 0, 0, cw, ch, 0, 0, out.width, out.height);
  return out;
}
function canvasBlob(c, type = 'image/png', quality) {
  return new Promise((resolve, reject) => c.toBlob(b => (b ? resolve(b) : reject(new Error('El navegador no pudo crear la imagen (puede que sea demasiado grande).'))), type, quality));
}
function flatten(c, color) {
  const out = makeCanvas(c.width, c.height);
  const g = out.getContext('2d');
  g.fillStyle = color;
  g.fillRect(0, 0, out.width, out.height);
  g.drawImage(c, 0, 0);
  return out;
}

// Formatos que este navegador sabe crear (toBlob devuelve PNG cuando no conoce el tipo pedido).
let encoderSupport = { webp: true, avif: false };
let encoderCheck = null;
function checkEncoders() {
  if (!encoderCheck) {
    const c = makeCanvas(2, 2);
    const test = type => canvasBlob(c, type, 0.8).then(b => b.type === type, () => false);
    encoderCheck = Promise.all([test('image/webp'), test('image/avif')]).then(([webp, avif]) => (encoderSupport = { webp, avif }));
  }
  return encoderCheck;
}

// BMP de 24 bits: filas de abajo arriba, en BGR, cada fila rellena hasta múltiplo de 4 bytes.
function encodeBmp(c) {
  const w = c.width;
  const hgt = c.height;
  const px = c.getContext('2d').getImageData(0, 0, w, hgt).data;
  const stride = Math.ceil(w * 3 / 4) * 4;
  const size = 54 + stride * hgt;
  const buf = new Uint8Array(size);
  const dv = new DataView(buf.buffer);
  buf[0] = 0x42; buf[1] = 0x4d;
  dv.setUint32(2, size, true);
  dv.setUint32(10, 54, true);
  dv.setUint32(14, 40, true);
  dv.setInt32(18, w, true);
  dv.setInt32(22, hgt, true);
  dv.setUint16(26, 1, true);
  dv.setUint16(28, 24, true);
  dv.setUint32(34, stride * hgt, true);
  dv.setInt32(38, 2835, true);
  dv.setInt32(42, 2835, true);
  for (let y = 0; y < hgt; y++) {
    let p = 54 + (hgt - 1 - y) * stride;
    for (let x = 0, i = y * w * 4; x < w; x++, i += 4) {
      buf[p++] = px[i + 2];
      buf[p++] = px[i + 1];
      buf[p++] = px[i];
    }
  }
  return new Blob([buf], { type: 'image/bmp' });
}

// Un tamaño del icono: la imagen encajada (con transparencia alrededor) o recortada al centro.
function icoCanvas(src, s, fit) {
  const k = fit === 'cover' ? Math.max(s / src.width, s / src.height) : Math.min(s / src.width, s / src.height);
  const w = Math.max(1, Math.round(src.width * k));
  const hgt = Math.max(1, Math.round(src.height * k));
  const c = makeCanvas(s, s);
  c.getContext('2d').drawImage(resample(src, src.width, src.height, w, hgt), Math.round((s - w) / 2), Math.round((s - hgt) / 2));
  return c;
}
// ICO con un PNG por tamaño (lo admiten Windows Vista y posteriores y todos los navegadores).
// En la cabecera, 256 se escribe como 0.
async function encodeIco(src, sizes, fit) {
  const entries = [];
  for (const s of sizes) entries.push({ s, data: new Uint8Array(await (await canvasBlob(icoCanvas(src, s, fit), 'image/png')).arrayBuffer()) });
  const head = 6 + 16 * entries.length;
  const buf = new Uint8Array(head + entries.reduce((n, e) => n + e.data.length, 0));
  const dv = new DataView(buf.buffer);
  dv.setUint16(2, 1, true);
  dv.setUint16(4, entries.length, true);
  let off = head;
  entries.forEach((e, i) => {
    const p = 6 + i * 16;
    buf[p] = e.s >= 256 ? 0 : e.s;
    buf[p + 1] = e.s >= 256 ? 0 : e.s;
    dv.setUint16(p + 4, 1, true);
    dv.setUint16(p + 6, 32, true);
    dv.setUint32(p + 8, e.data.length, true);
    dv.setUint32(p + 12, off, true);
    buf.set(e.data, off);
    off += e.data.length;
  });
  return new Blob([buf], { type: 'image/x-icon' });
}

/* Imagen abierta: la comparten todas las herramientas de imagen mientras la página siga abierta.
   No se guarda en localStorage (puede pesar varios MB); los ajustes de cada herramienta sí. */
let currentImage = null;
let imageSeq = 0;
const imageListeners = new Set();

async function svgSize(blob) {
  try {
    const tag = /<svg\b[^>]*>/i.exec((await blob.text()).slice(0, 20000));
    if (!tag) return null;
    const attr = n => (new RegExp(`\\s${n}\\s*=\\s*["']([^"']+)["']`, 'i').exec(tag[0]) || [])[1];
    const num = v => (v && /^\s*[\d.]+(px)?\s*$/.test(v) ? parseFloat(v) : 0);
    const vb = (attr('viewBox') || '').trim().split(/[\s,]+/).map(Number);
    let w = num(attr('width'));
    let hgt = num(attr('height'));
    const ratio = vb.length === 4 && vb[2] > 0 && vb[3] > 0 ? vb[2] / vb[3] : (w && hgt ? w / hgt : 1);
    if (!w && !hgt) { w = vb.length === 4 && vb[2] > 0 ? vb[2] : 300; hgt = w / ratio; }
    else if (!w) w = hgt * ratio;
    else if (!hgt) hgt = w / ratio;
    return { w, h: hgt };
  } catch (e) {
    return null;
  }
}

async function openImage(blob, name = 'imagen') {
  const type = (blob.type && blob.type !== 'application/octet-stream' ? blob.type : '') || typeFromName(name);
  if (!type.startsWith('image/')) throw new Error('Ese archivo no es una imagen.');
  const url = URL.createObjectURL(blob);
  const img = new Image();
  img.src = url;
  try {
    await img.decode();
  } catch (e) {
    URL.revokeObjectURL(url);
    throw new Error(/heic|heif|tiff/i.test(type) ? 'Este navegador no sabe abrir fotos HEIC ni TIFF. Conviértelas antes a JPEG o PNG.' : 'No se pudo abrir la imagen: el archivo está dañado o el formato no es compatible.');
  }
  let width = img.naturalWidth;
  let height = img.naturalHeight;
  let src = img;
  let note = type === 'image/gif' ? 'GIF: se usa el primer fotograma.' : '';
  if (type === 'image/svg+xml') {
    // Un SVG es vectorial: se dibuja grande para sacar de él imágenes e iconos nítidos.
    const s = (await svgSize(blob)) || { w: width || 300, h: height || 150 };
    const side = Math.max(s.w, s.h) || 300;
    const k = Math.min(4096 / side, Math.max(1, 1024 / side));
    width = Math.max(1, Math.round(s.w * k));
    height = Math.max(1, Math.round(s.h * k));
    src = makeCanvas(width, height);
    smooth(src).drawImage(img, 0, 0, width, height);
    if (k !== 1) note = `SVG de ${Math.round(s.w)} × ${Math.round(s.h)}: se usa a ${width} × ${height} px.`;
  }
  if (!width || !height) { URL.revokeObjectURL(url); throw new Error('La imagen no tiene tamaño.'); }
  return { id: ++imageSeq, name, base: baseName(name), type, size: blob.size, blob, url, src, width, height, note };
}

function setCurrentImage(image) {
  const old = currentImage;
  currentImage = image;
  if (old && old !== image) setTimeout(() => URL.revokeObjectURL(old.url), 5000);
  for (const fn of [...imageListeners]) fn(image);
}
