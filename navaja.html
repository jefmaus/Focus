<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navaja suiza</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f4f3ef;
  --surface: #ffffff;
  --field: #fbfaf7;
  --line: #e0ddd5;
  --line-strong: #cbc7bd;
  --hover: #eeebe4;
  --text: #1e1f1c;
  --muted: #6a6b64;
  --accent: #1a73e8;
  --accent-text: #ffffff;
  --ok: #188038;
  --ok-bg: #e6f4ea;
  --bad: #c5221f;
  --bad-bg: #fce8e6;
  --add-bg: #e6f4ea;
  --add-mark: #a8dab5;
  --del-bg: #fce8e6;
  --del-mark: #f6aea9;
  --mark1: #fde68a;
  --mark2: #bfdbfe;
  --shadow: 0 1px 2px rgb(0 0 0 / .04), 0 4px 14px -6px rgb(0 0 0 / .12);
  --mono: ui-monospace, "Cascadia Code", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --g1: #4285f4; --g2: #ea4335; --g3: #fbbc05; --g4: #34a853;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101214;
    --surface: #17191c;
    --field: #121417;
    --line: #2a2e33;
    --line-strong: #3a3f46;
    --hover: #20242a;
    --text: #eceded;
    --muted: #9ba0a6;
    --accent: #8ab4f8;
    --accent-text: #0b1220;
    --ok: #81c995;
    --ok-bg: #12301d;
    --bad: #f28b82;
    --bad-bg: #3a1714;
    --add-bg: #11301c;
    --add-mark: #1f6b3a;
    --del-bg: #3a1714;
    --del-mark: #7a2a24;
    --mark1: #6b5310;
    --mark2: #1e3a66;
    --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px -8px rgb(0 0 0 / .6);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: .875rem; }
.wrap { width: min(1180px, 100%); margin: 0 auto; padding: 28px 24px 56px; }

/* ---------- Borde iluminado ---------- */
@property --angle { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@property --fill { syntax: '<percentage>'; inherits: false; initial-value: 0%; }
.glow {
  position: relative;
  isolation: isolate;
  display: inline-flex;
  padding: 1.5px;
  border: 0;
  border-radius: 12px;
  background: var(--line);
  text-decoration: none;
  transition: transform .18s ease, box-shadow .25s ease, background .2s ease;
  -webkit-tap-highlight-color: transparent;
}
.glow::before, .glow::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: conic-gradient(from var(--angle),
    var(--g1) 0%,
    var(--g2) calc(var(--fill) * .28),
    var(--g3) calc(var(--fill) * .52),
    var(--g4) calc(var(--fill) * .78),
    var(--g1) var(--fill),
    transparent var(--fill));
  opacity: 0;
  transition: opacity .3s ease;
}
.glow::before { z-index: -1; }
.glow::after { z-index: -2; filter: blur(12px); }
.glow:hover::before, .glow:focus-visible::before, .glow.lit::before { opacity: 1; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }
.glow:hover::after, .glow:focus-visible::after, .glow.lit::after { opacity: .5; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }
.glow:focus-visible { outline: none; }
@keyframes draw { from { --fill: 0%; } to { --fill: 100%; } }
@keyframes spin { from { --angle: 0deg; } to { --angle: 360deg; } }
.face {
  position: relative;
  flex: 1;
  min-width: 0;
  overflow: hidden;
  border-radius: calc(12px - 1.5px);
  background: var(--surface);
}
.ripple {
  position: absolute;
  width: 20px;
  height: 20px;
  margin: -10px 0 0 -10px;
  border-radius: 50%;
  background: currentColor;
  opacity: .22;
  pointer-events: none;
  transform: scale(0);
  animation: ripple .6s ease-out forwards;
}
@keyframes ripple { to { transform: scale(var(--r, 20)); opacity: 0; } }

/* ---------- Botones ---------- */
.btn { border-radius: 10px; }
.btn .face {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-height: 38px;
  padding: 7px 14px;
  border-radius: 8.5px;
  font-size: .875rem;
  font-weight: 600;
  white-space: nowrap;
  transition: background .2s ease;
}
.btn:hover .face { background: var(--hover); }
.btn:active { transform: scale(.96); }
.btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn.primary { background: transparent; }
.btn.primary .face { background: var(--accent); color: var(--accent-text); }
.btn.primary:hover .face { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
.btn.small .face { min-height: 30px; padding: 4px 10px; font-size: .8125rem; }
.btn.icon .face { padding: 7px 9px; }
.btn:disabled { opacity: .45; pointer-events: none; }

/* ---------- Cabecera ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 30px; }
.hero h1 { margin: 0; font-size: clamp(1.75rem, 4vw, 2.375rem); line-height: 1.1; letter-spacing: -.025em; }
.hero h1 span {
  background: linear-gradient(90deg, var(--g1), var(--g2), var(--g3), var(--g4));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero p { margin: 8px 0 0; color: var(--muted); max-width: 52ch; }
.search { width: min(360px, 100%); border-radius: 14px; }
.search .face { display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 12.5px; }
.search svg { flex: none; width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; }
.search input { flex: 1; min-width: 0; min-height: 46px; padding: 0; background: none; border: 0; outline: none; }
.search kbd { padding: 1px 7px; border: 1px solid var(--line); border-radius: 6px; color: var(--muted); font: .75rem var(--mono); }
.search:focus-within::before { opacity: 1; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }
.search:focus-within::after { opacity: .45; animation: draw .9s cubic-bezier(.4, 0, .2, 1) forwards, spin 3.2s linear infinite; }

/* ---------- Tablero ---------- */
.cat { margin: 0 0 30px; }
.cat h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; font-size: .75rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.cat h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 16px; }
.card { display: flex; border-radius: 18px; box-shadow: var(--shadow); }
.card .face {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-height: 162px;
  padding: 18px 18px 16px;
  border-radius: 16.5px;
  background:
    radial-gradient(260px circle at var(--mx, 50%) var(--my, -40%), color-mix(in srgb, var(--c) 14%, transparent), transparent 70%),
    var(--surface);
}
.card:hover { transform: translateY(-4px); box-shadow: 0 18px 34px -16px color-mix(in srgb, var(--c) 55%, transparent); }
.card:active { transform: translateY(-1px) scale(.975); }
.tile {
  display: grid;
  place-items: center;
  flex: none;
  width: 46px;
  height: 46px;
  margin-bottom: 10px;
  border-radius: 13px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000));
  box-shadow: 0 6px 14px -6px color-mix(in srgb, var(--c) 80%, transparent), inset 0 1px 0 rgb(255 255 255 / .35);
  color: #fff;
  transition: transform .3s cubic-bezier(.34, 1.56, .64, 1);
}
.tile svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.card:hover .tile { transform: scale(1.1) rotate(-6deg); }
.card b { font-size: 1.0625rem; letter-spacing: -.01em; }
.card small { color: var(--muted); font-size: .8125rem; line-height: 1.4; }
.card .go {
  position: absolute;
  right: 16px;
  top: 20px;
  width: 20px;
  height: 20px;
  fill: none;
  stroke: var(--c);
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  opacity: 0;
  transform: translateX(-6px);
  transition: opacity .2s ease, transform .2s ease;
}
.card:hover .go, .card:focus-visible .go { opacity: 1; transform: none; }
.empty { padding: 40px 0; color: var(--muted); text-align: center; }

/* ---------- Vista de herramienta ---------- */
.tool-head { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
.tool-head .tile { margin: 0; }
.tool-head h1 { margin: 0; font-size: 1.5rem; line-height: 1.2; letter-spacing: -.02em; }
.tool-head p { margin: 2px 0 0; color: var(--muted); font-size: .9375rem; }
.tool-body { display: grid; gap: 18px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 18px; align-items: start; }
.panel {
  min-width: 0;
  padding: 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  box-shadow: var(--shadow);
}
.panel > h2 { margin: 0 0 14px; font-size: .9375rem; font-weight: 700; }
.panel > * + * { margin-top: 12px; }
.panel > h2 + * { margin-top: 0; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.row.end { justify-content: flex-end; }
.spacer { flex: 1; }
.field { display: grid; gap: 5px; min-width: 0; }
.field > span { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; }
.input {
  width: 100%;
  min-height: 42px;
  padding: 9px 12px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
textarea.input { display: block; resize: vertical; line-height: 1.5; }
textarea.input[readonly] { background: color-mix(in srgb, var(--field) 60%, var(--hover)); }
select.input { padding-right: 30px; }
input[type="color"].input { width: 52px; padding: 4px; cursor: pointer; }
input[type="range"] { accent-color: var(--accent); }
.check { display: inline-flex; align-items: center; gap: 7px; min-height: 32px; font-size: .875rem; cursor: pointer; user-select: none; }
.check input { width: 17px; height: 17px; margin: 0; accent-color: var(--accent); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 3px; padding: 3px; background: var(--hover); border-radius: 11px; }
.seg button { min-height: 32px; padding: 4px 12px; background: none; border: 0; border-radius: 8px; color: var(--muted); font-size: .8125rem; font-weight: 600; transition: background .15s ease, color .15s ease; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / .14); }
.note { margin: 0; color: var(--muted); font-size: .8125rem; }
.status { margin: 0; padding: 9px 12px; border-radius: 10px; font-size: .875rem; font-weight: 500; }
.status.ok { background: var(--ok-bg); color: var(--ok); }
.status.bad { background: var(--bad-bg); color: var(--bad); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.stat { padding: 12px 14px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; }
.stat b { display: block; font-size: 1.5rem; line-height: 1.2; font-variant-numeric: tabular-nums; letter-spacing: -.02em; overflow-wrap: anywhere; }
.stat span { font-size: .75rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; background: var(--hover); border: 0; border-radius: 99px; font-size: .8125rem; }
button.chip { transition: background .15s ease; }
button.chip:hover { background: var(--line); }
.chip em { font-style: normal; color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr) auto; align-items: center; gap: 6px 14px; margin: 0; }
.kv dt { font-size: .8125rem; font-weight: 600; color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-size: .875rem; overflow-wrap: anywhere; }
.code {
  margin: 0;
  padding: 12px 14px;
  overflow: auto;
  max-height: 460px;
  background: var(--field);
  border: 1px solid var(--line);
  border-radius: 10px;
  font: .875rem/1.55 var(--mono);
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.j-key { color: #a142f4; } .j-str { color: #188038; } .j-num { color: #1a73e8; } .j-lit { color: #e8710a; }
@media (prefers-color-scheme: dark) { .j-key { color: #d7aefb; } .j-str { color: #81c995; } .j-num { color: #8ab4f8; } .j-lit { color: #fcad70; } }
.drop {
  display: grid;
  place-items: center;
  gap: 6px;
  min-height: 150px;
  padding: 20px;
  border: 2px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--muted);
  text-align: center;
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease;
}
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); color: var(--text); }
.drop svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.preview { display: grid; place-items: center; min-height: 120px; padding: 12px; background: repeating-conic-gradient(var(--hover) 0 25%, transparent 0 50%) 0 0 / 16px 16px; border: 1px solid var(--line); border-radius: 12px; }
.preview img { max-width: 100%; max-height: 300px; }
.meter { height: 8px; background: var(--hover); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: inherit; transition: width .25s ease, background .25s ease; }
.list { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.list li { display: flex; align-items: center; gap: 10px; padding: 7px 10px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; }
.list li > :first-child { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.list li.match { border-color: var(--ok); background: var(--ok-bg); }
.list li.miss { border-color: color-mix(in srgb, var(--bad) 45%, transparent); background: var(--bad-bg); }
.hash-name { font-size: .8125rem; font-weight: 700; color: var(--muted); }
.hashes li { display: grid; grid-template-columns: 96px minmax(0, 1fr) auto; gap: 12px; padding: 9px 10px 9px 14px; }
.hashes .mono { word-break: break-all; line-height: 1.5; }
.verdict { flex: none; font-size: .8125rem; font-weight: 700; white-space: nowrap; }
.match .verdict { color: var(--ok); }
.miss .verdict { color: var(--bad); }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 10px; margin: 0; padding: 0; list-style: none; counter-reset: paso; }
.steps li { position: relative; padding: 10px 12px 10px 44px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; font-size: .875rem; counter-increment: paso; }
.steps li::before { content: counter(paso); position: absolute; left: 12px; top: 10px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--c, var(--accent)); color: #fff; font-size: .75rem; font-weight: 700; }
table.grid { width: 100%; border-collapse: collapse; font-size: .875rem; }
table.grid th, table.grid td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.grid th { font-size: .75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
table.grid td.mono { overflow-wrap: anywhere; }
.scroll { overflow: auto; max-height: 420px; border: 1px solid var(--line); border-radius: 10px; }
.scroll table.grid th { position: sticky; top: 0; background: var(--surface); }
mark { padding: 0 1px; border-radius: 3px; background: var(--mark1); color: inherit; }
mark.alt { background: var(--mark2); }

/* Diferencias */
.diff-wrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; }
table.diff { width: 100%; border-collapse: collapse; font: .8125rem/1.5 var(--mono); }
table.diff td { padding: 1px 8px; vertical-align: top; }
table.diff td.n { width: 1%; padding: 1px 6px; color: var(--muted); text-align: right; user-select: none; white-space: nowrap; background: color-mix(in srgb, var(--hover) 60%, transparent); }
table.diff td.s { width: 1%; padding: 1px 4px; color: var(--muted); user-select: none; }
table.diff td.c { white-space: pre-wrap; overflow-wrap: anywhere; }
table.diff.side td.c { width: 49%; }
table.diff .del { background: var(--del-bg); }
table.diff .add { background: var(--add-bg); }
table.diff del { background: var(--del-mark); text-decoration: none; border-radius: 2px; }
table.diff ins { background: var(--add-mark); text-decoration: none; border-radius: 2px; }
table.diff tr.fold td { padding: 4px 10px; color: var(--muted); text-align: center; background: var(--hover); font-family: system-ui, sans-serif; }
table.diff td.blank { background: repeating-linear-gradient(-45deg, transparent 0 5px, var(--hover) 5px 7px); }

/* Colores */
.swatch { height: 120px; border-radius: 14px; border: 1px solid var(--line); background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0 / 16px 16px; overflow: hidden; }
.swatch i { display: block; height: 100%; }
.tones { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
.tones button { aspect-ratio: 1; min-width: 0; border: 1px solid rgb(0 0 0 / .08); border-radius: 9px; transition: transform .15s ease; }
.tones button:hover { transform: scale(1.12); }
.contrast-demo { padding: 18px; border-radius: 12px; border: 1px solid var(--line); }
.contrast-demo b { display: block; font-size: 1.375rem; }
.badge { display: inline-flex; gap: 5px; padding: 3px 10px; border-radius: 99px; font-size: .8125rem; font-weight: 600; }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.bad { background: var(--bad-bg); color: var(--bad); }

/* QR */
.qr-box { display: grid; place-items: center; padding: 16px; background: var(--field); border: 1px solid var(--line); border-radius: 14px; }
.qr-box canvas { max-width: 100%; height: auto; image-rendering: pixelated; border-radius: 6px; }

/* JWT */
.jwt { margin: 0; padding: 12px 14px; background: var(--field); border: 1px solid var(--line); border-radius: 10px; font: .875rem/1.55 var(--mono); overflow-wrap: anywhere; }
.jwt .p0 { color: #d93025; } .jwt .p1 { color: #a142f4; } .jwt .p2 { color: #1a73e8; }
@media (prefers-color-scheme: dark) { .jwt .p0 { color: #f28b82; } .jwt .p1 { color: #d7aefb; } .jwt .p2 { color: #8ab4f8; } }

/* Aviso */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  z-index: 10;
  padding: 10px 18px;
  background: var(--text);
  color: var(--bg);
  border-radius: 99px;
  font-size: .875rem;
  font-weight: 600;
  box-shadow: 0 10px 30px -10px rgb(0 0 0 / .5);
  transform: translate(-50%, 20px);
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.view-enter { animation: enter .22s ease; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } }

@media (max-width: 600px) {
  .wrap { padding: 20px 16px 48px; }
  .hero { margin-bottom: 22px; }
  .search kbd { display: none; }
  .cards { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card .face { min-height: 140px; padding: 14px; }
  .card small { font-size: .75rem; }
  .card .go { display: none; }
  .panel { padding: 14px; }
  .kv { grid-template-columns: minmax(0, 1fr) auto; }
  .kv dt { grid-column: 1 / -1; margin-top: 4px; }
  .tones { grid-template-columns: repeat(5, 1fr); }
  .hashes li { grid-template-columns: minmax(0, 1fr) auto; }
  .hashes .hash-name { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .glow:hover::before, .glow:focus-visible::before, .glow.lit::before,
  .search:focus-within::before { --fill: 100%; }
  .glow::after { display: none; }
  .card:hover, .card:active { transform: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <main id="home">
    <header class="hero">
      <div>
        <h1>Navaja <span>suiza</span></h1>
        <p id="heroText"></p>
      </div>
      <label class="search glow">
        <span class="face">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Buscar herramienta…" autocomplete="off" aria-label="Buscar herramienta">
          <kbd>/</kbd>
        </span>
      </label>
    </header>
    <div id="board"></div>
    <p class="empty" id="empty" hidden>No hay herramientas que coincidan con tu búsqueda.</p>
  </main>

  <main id="view" hidden>
    <header class="tool-head">
      <a class="btn glow icon" href="#" id="btnBack" aria-label="Volver a las herramientas" title="Volver (Esc)">
        <span class="face"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></span>
      </a>
      <span class="tile" id="viewTile"></span>
      <div>
        <h1 id="viewTitle"></h1>
        <p id="viewDesc"></p>
      </div>
    </header>
    <div class="tool-body" id="viewBody"></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ---------- Utilidades generales ---------- */

const $ = id => document.getElementById(id);

function h(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'text') node.textContent = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k === 'style') node.style.cssText = v;
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'readOnly' || k === 'rows' || k === 'spellcheck') node[k] = v;
    else node.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false) node.append(kid);
  return node;
}

function svg(paths, cls) {
  const node = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  node.setAttribute('viewBox', '0 0 24 24');
  node.setAttribute('aria-hidden', 'true');
  if (cls) node.setAttribute('class', cls);
  node.innerHTML = paths;
  return node;
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmtNum = n => new Intl.NumberFormat('es').format(n);
function fmtBytes(n) {
  if (n < 1024) return `${fmtNum(n)} B`;
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(1).replace('.', ',')} KB`;
  return `${(n / 1024 / 1024).toFixed(2).replace('.', ',')} MB`;
}
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
const joinY = list => list.length <= 1 ? list.join('') : `${list.slice(0, -1).join(', ')} y ${list[list.length - 1]}`;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const enc = new TextEncoder();
const bytesToHex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
function bytesToB64(bytes) {
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

let toastTimer;
function toast(message) {
  const node = $('toast');
  node.textContent = message;
  node.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => node.classList.remove('show'), Math.max(1800, message.length * 60));
}

async function copyText(text) {
  if (!text) { toast('No hay nada para copiar'); return; }
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const t = h('textarea', { value: text, style: 'position:fixed;opacity:0' });
    document.body.append(t);
    t.select();
    document.execCommand('copy');
    t.remove();
  }
  toast('Copiado al portapapeles');
}

/*
  Guardar archivos.
  - Donde se puede (Chrome y Edge), se abre la ventana «Guardar como» y la página escribe el archivo
    ella misma. No pasa por el gestor de descargas, que en algunos equipos tarda 15–20 s en mostrar
    la descarga mientras la revisa, y se sabe cuándo terminó.
  - Si no se puede, se usa la descarga normal. Como ahí no se sabe cuándo aparece, el mismo archivo
    pedido otra vez en menos de 30 s se ignora, para no bajar copias por los clics repetidos.
  - Dentro del lanzador lo hace la página principal: el navegador no deja abrir «Guardar como» ni
    descargar desde un marco de otro origen (como pasa al abrir los archivos con file://).
  Resultado: 'saved' (guardado), 'cancelled' (cerró la ventana), 'started' (descarga normal enviada)
  o 'repeated' (ignorado por repetido).
*/
const REPEAT_MS = 30000;
let lastFallback = { key: '', at: 0 };

function pickSaveFile(name, blob) {
  const ext = (/\.([a-z0-9]+)$/i.exec(name) || [])[1];
  const mime = (blob.type || 'application/octet-stream').split(';')[0];
  const opts = { suggestedName: name };
  if (ext) opts.types = [{ description: `Archivo .${ext.toLowerCase()}`, accept: { [mime]: [`.${ext.toLowerCase()}`] } }];
  return window.showSaveFilePicker(opts).catch(e => {
    if (e.name === 'TypeError' && opts.types) return window.showSaveFilePicker({ suggestedName: name });
    throw e;
  });
}

async function saveHere(name, blob) {
  if (typeof window.showSaveFilePicker === 'function') {
    try {
      const handle = await pickSaveFile(name, blob);
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return 'saved';
    } catch (e) {
      if (e.name === 'AbortError') return 'cancelled';
      // Sin permiso para la ventana (por ejemplo, sin clic reciente): se usa la descarga normal.
    }
  }
  const key = `${name}|${blob.size}|${blob.type}`;
  if (key === lastFallback.key && Date.now() - lastFallback.at < REPEAT_MS) return 'repeated';
  lastFallback = { key, at: Date.now() };
  const url = URL.createObjectURL(blob);
  const a = h('a', { href: url, download: name });
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  return 'started';
}

let downloadSeq = 0;
const pendingDownloads = new Map();
window.addEventListener('message', e => {
  const d = e.data;
  if (e.source !== window.parent || !d || d.launcher !== true) return;
  const pending = pendingDownloads.get(d.id);
  if (!pending) return;
  if (d.type === 'download-ack') {
    clearTimeout(pending.timer);
    pending.timer = setTimeout(() => pending.finish('started'), 600000);
  } else if (d.type === 'download-result') {
    pending.finish(String(d.status));
  }
});

function download(name, data, type = 'text/plain') {
  const blob = data instanceof Blob ? data : new Blob([data], { type });
  if (window.parent === window) return saveHere(name, blob);
  return new Promise(resolve => {
    const id = ++downloadSeq;
    const pending = {
      finish(status) { clearTimeout(pending.timer); pendingDownloads.delete(id); resolve(status); },
      // Si el lanzador no confirma enseguida (una versión antigua en caché), se da por enviada.
      timer: setTimeout(() => pending.finish('started'), 1500),
    };
    pendingDownloads.set(id, pending);
    parent.postMessage({ launcher: true, type: 'download', id, name, blob }, location.protocol === 'file:' ? '*' : location.origin);
  });
}

/* ---------- Almacenamiento por herramienta ---------- */

const pendingSaves = new Map();
function makeCtx(id) {
  const key = `navaja.tool.${id}`;
  let data = {};
  try { data = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { data = {}; }
  const write = () => {
    pendingSaves.delete(key);
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { /* sin espacio o sin almacenamiento */ }
  };
  let timer;
  return {
    get: (k, fallback) => (k in data ? data[k] : fallback),
    set(k, v) {
      if (typeof v === 'string' && v.length > 200000) v = '';
      data[k] = v;
      clearTimeout(timer);
      pendingSaves.set(key, write);
      timer = setTimeout(write, 300);
    },
  };
}
window.addEventListener('pagehide', () => { for (const write of [...pendingSaves.values()]) write(); });

function loadPref(k, fallback) {
  try { const v = localStorage.getItem(`navaja.${k}`); return v == null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
}
function savePref(k, v) {
  try { localStorage.setItem(`navaja.${k}`, JSON.stringify(v)); } catch (e) { /* sin preferencia guardada */ }
}

/* ---------- Piezas de interfaz ---------- */

const ICON = {
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>',
  clear: '<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  swap: '<path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/>',
  down: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  up: '<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/>',
  play: '<path d="M7 5l12 7-12 7z"/>',
  upload: '<path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>',
};

function btn(label, onclick, opts = {}) {
  const cls = ['btn', 'glow', opts.primary && 'primary', opts.small && 'small', !label && 'icon'].filter(Boolean).join(' ');
  return h('button', { type: 'button', class: cls, onclick, title: opts.title, 'aria-label': opts.title && !label ? opts.title : null },
    h('span', { class: 'face' }, opts.icon ? svg(ICON[opts.icon] || opts.icon) : null, label ? h('span', { text: label }) : null));
}
const copyBtn = (get, label = 'Copiar', opts = {}) => btn(label, () => copyText(typeof get === 'function' ? get() : get), { icon: 'copy', ...opts });

// Botón de descarga: queda bloqueado con «Guardando…» hasta que el archivo se guardó o se cerró
// la ventana «Guardar como». Con la descarga normal, donde no se sabe cuándo aparece, se bloquea
// 20 s, lo que suele tardar el navegador en mostrarla cuando la revisa.
// getFile devuelve { name, data, type } (o una promesa), o null si no hay nada que descargar.
function downloadBtn(label, getFile, opts = {}) {
  let busy = false;
  let ready = opts.ready !== false;
  const b = btn(label, async () => {
    if (busy) return;
    busy = true;
    paint();
    let status = null;
    try {
      const file = await getFile();
      if (file) status = await download(file.name, file.data, file.type);
      else toast('No hay nada para guardar');
    } catch (e) {
      toast(e.message || 'No se pudo preparar el archivo');
    }
    if (status === 'saved') toast('Archivo guardado');
    else if (status === 'repeated') toast('Esa descarga ya está en camino: revisa la barra de descargas del navegador');
    if (status !== 'started') { busy = false; paint(); return; }
    toast('Descarga enviada. El navegador puede tardar unos segundos en mostrarla: no hace falta pulsar otra vez.');
    setTimeout(() => { busy = false; paint(); }, 20000);
  }, { icon: 'down', ...opts });
  const text = b.querySelector('.face > span:last-child');
  const paint = () => {
    b.disabled = busy || !ready;
    text.textContent = busy ? 'Guardando…' : label;
  };
  b.setReady = value => { ready = value; paint(); };
  paint();
  return b;
}

function textarea(ctx, key, props = {}) {
  const t = h('textarea', {
    class: `input${props.mono === false ? '' : ' mono'}`,
    rows: props.rows || 8,
    placeholder: props.placeholder || '',
    spellcheck: false,
    readOnly: !!props.readonly,
    'aria-label': props.label || props.placeholder || null,
  });
  t.value = ctx && key ? ctx.get(key, props.value || '') : props.value || '';
  if (ctx && key) t.addEventListener('input', () => ctx.set(key, t.value));
  return t;
}

function input(ctx, key, props = {}) {
  const i = h('input', {
    class: `input${props.mono ? ' mono' : ''}`,
    type: props.type || 'text',
    placeholder: props.placeholder || '',
    spellcheck: false,
    autocomplete: 'off',
    min: props.min, max: props.max, step: props.step,
    'aria-label': props.label || props.placeholder || null,
  });
  i.value = ctx && key ? ctx.get(key, props.value ?? '') : props.value ?? '';
  if (ctx && key) i.addEventListener('input', () => ctx.set(key, i.value));
  return i;
}

function select(ctx, key, options, value, onchange) {
  const s = h('select', { class: 'input' }, options.map(([v, label]) => h('option', { value: v, text: label })));
  s.value = ctx && key ? ctx.get(key, value) : value;
  if (s.selectedIndex < 0) s.value = value;
  s.addEventListener('change', () => { if (ctx && key) ctx.set(key, s.value); if (onchange) onchange(s.value); });
  return s;
}

function check(ctx, key, label, value, onchange) {
  const box = h('input', { type: 'checkbox' });
  box.checked = ctx && key ? ctx.get(key, value) : value;
  box.addEventListener('change', () => { if (ctx && key) ctx.set(key, box.checked); if (onchange) onchange(box.checked); });
  const node = h('label', { class: 'check' }, box, label);
  node.input = box;
  return node;
}

function seg(ctx, key, options, value, onchange) {
  const node = h('div', { class: 'seg', role: 'group' });
  let current = ctx && key ? ctx.get(key, value) : value;
  if (!options.some(([v]) => v === current)) current = value;
  const paint = () => { for (const b of node.children) b.setAttribute('aria-pressed', String(b.dataset.v === current)); };
  for (const [v, label] of options) {
    node.append(h('button', { type: 'button', 'data-v': v, text: label, onclick: () => {
      current = v;
      if (ctx && key) ctx.set(key, v);
      paint();
      if (onchange) onchange(v);
    } }));
  }
  paint();
  Object.defineProperty(node, 'value', { get: () => current });
  return node;
}

const field = (label, control, hint) => h('label', { class: 'field' }, h('span', { text: label }), control, hint ? h('small', { class: 'note', text: hint }) : null);
const panel = (title, ...kids) => h('section', { class: 'panel' }, title ? h('h2', { text: title }) : null, ...kids);
const row = (...kids) => h('div', { class: 'row' }, ...kids);
const cols = (...kids) => h('div', { class: 'cols' }, ...kids);

function stats(defs) {
  const cells = {};
  const node = h('div', { class: 'stats' }, defs.map(([k, label]) => {
    cells[k] = h('b', { text: '0' });
    return h('div', { class: 'stat' }, cells[k], h('span', { text: label }));
  }));
  return { node, set(values) { for (const [k, v] of Object.entries(values)) if (cells[k]) cells[k].textContent = v; } };
}

function setValue(control, value) {
  control.value = value;
  control.dispatchEvent(new Event('input', { bubbles: true }));
}

function statusLine() {
  const node = h('p', { class: 'status', hidden: true });
  node.show = (text, kind) => { node.hidden = !text; node.textContent = text || ''; node.className = `status ${kind || ''}`; };
  return node;
}

function dropZone(text, accept, onfile) {
  const file = h('input', { type: 'file', accept, hidden: true });
  const zone = h('label', { class: 'drop', tabindex: '0' },
    svg(ICON.upload),
    h('span', { html: text }),
    file);
  file.addEventListener('change', () => { if (file.files[0]) onfile(file.files[0]); file.value = ''; });
  zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); } });
  zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('over'); });
  zone.addEventListener('dragleave', () => zone.classList.remove('over'));
  zone.addEventListener('drop', e => {
    e.preventDefault();
    zone.classList.remove('over');
    const f = e.dataTransfer.files[0];
    if (f) onfile(f);
  });
  return zone;
}

function highlightJson(s) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g;
  let out = '';
  let last = 0;
  for (const m of s.matchAll(re)) {
    out += esc(s.slice(last, m.index));
    if (m[1]) out += m[2] ? `<span class="j-key">${esc(m[1])}</span>${esc(m[2])}` : `<span class="j-str">${esc(m[1])}</span>`;
    else if (m[3]) out += `<span class="j-lit">${m[3]}</span>`;
    else out += `<span class="j-num">${m[4]}</span>`;
    last = m.index + m[0].length;
  }
  return out + esc(s.slice(last));
}

/* ---------- Registro de herramientas ---------- */

const CATS = [
  ['texto', 'Texto'],
  ['codigo', 'Codificación y seguridad'],
  ['datos', 'Datos y código'],
  ['generar', 'Generadores'],
  ['tiempo', 'Tiempo y color'],
];
const TOOLS = [];
const tool = def => TOOLS.push(def);

/* ===== Texto ===== */

const graphemes = (() => {
  const seg = typeof Intl.Segmenter === 'function' ? new Intl.Segmenter('es', { granularity: 'grapheme' }) : null;
  return text => {
    if (!seg) return [...text].length;
    let n = 0;
    for (const _ of seg.segment(text)) n++;
    return n;
  };
})();
const WORD_RE = /[\p{L}\p{N}][\p{L}\p{N}\p{M}_'’-]*/gu;

tool({
  id: 'contador', cat: 'texto', name: 'Contador de texto', color: '#4285f4',
  desc: 'Caracteres, palabras, líneas, bytes y tokens aproximados.',
  keywords: 'caracteres palabras tokens lineas bytes parrafos contar longitud',
  icon: '<path d="M4 7V5h11v2M9.5 5v14M7 19h5"/><path d="M15 13h6M15 17h6M17 11l-1 8M20 11l-1 8"/>',
  render(body, ctx) {
    const text = textarea(ctx, 'text', { rows: 12, mono: false, placeholder: 'Escribe o pega tu texto aquí…' });
    const result = stats([
      ['chars', 'Caracteres'], ['noSpace', 'Sin espacios'], ['words', 'Palabras'], ['tokens', 'Tokens (aprox.)'],
      ['lines', 'Líneas'], ['paras', 'Párrafos'], ['bytes', 'Bytes UTF-8'], ['read', 'Tiempo de lectura'],
    ]);
    const top = h('div', { class: 'chips' });
    const update = () => {
      const t = text.value;
      const chars = graphemes(t);
      const words = t.match(WORD_RE) || [];
      const tokens = t.trim() ? Math.ceil(Math.max(t.length / 4, words.length * 4 / 3)) : 0;
      const minutes = words.length / 230;
      result.set({
        chars: fmtNum(chars),
        noSpace: fmtNum(graphemes(t.replace(/\s+/g, ''))),
        words: fmtNum(words.length),
        tokens: `≈ ${fmtNum(tokens)}`,
        lines: fmtNum(t ? t.split(/\r\n|\r|\n/).length : 0),
        paras: fmtNum(t.split(/\n\s*\n/).filter(p => p.trim()).length),
        bytes: fmtBytes(enc.encode(t).length),
        read: !words.length ? '0 min' : minutes < 1 ? '< 1 min' : `${Math.round(minutes)} min`,
      });
      const freq = new Map();
      for (const w of words) {
        if (w.length < 3) continue;
        const k = w.toLowerCase();
        freq.set(k, (freq.get(k) || 0) + 1);
      }
      const best = [...freq].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 15);
      top.replaceChildren(...(best.length ? best.map(([w, n]) => h('span', { class: 'chip' }, `${w} `, h('em', { text: `×${n}` })))
        : [h('span', { class: 'note', text: 'Aún no hay palabras.' })]));
    };
    text.addEventListener('input', update);
    update();
    body.append(
      panel('Texto', text, row(btn('Limpiar', () => setValue(text, ''), { icon: 'clear' }), copyBtn(() => text.value))),
      panel('Resultados', result.node,
        h('p', { class: 'note', text: 'Los tokens son una estimación: unos 4 caracteres por token en inglés; el español y el código suelen usar algunos más. El valor exacto depende del tokenizador de cada modelo.' })),
      panel('Palabras más usadas', top),
    );
    text.focus();
  },
});

const splitWords = s => s
  .replace(/([\p{Ll}\p{N}])(\p{Lu})/gu, '$1 $2')
  .replace(/(\p{Lu}+)(\p{Lu}\p{Ll})/gu, '$1 $2')
  .split(/[^\p{L}\p{N}]+/u)
  .filter(Boolean);
const stripAccents = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').normalize('NFC');
const perLine = fn => s => s.split('\n').map(fn).join('\n');
const CASES = [
  ['camelCase', perLine(l => splitWords(l).map((w, i) => i ? cap(w.toLowerCase()) : w.toLowerCase()).join(''))],
  ['PascalCase', perLine(l => splitWords(l).map(w => cap(w.toLowerCase())).join(''))],
  ['snake_case', perLine(l => splitWords(l).map(w => w.toLowerCase()).join('_'))],
  ['CONSTANT_CASE', perLine(l => splitWords(l).map(w => w.toUpperCase()).join('_'))],
  ['kebab-case', perLine(l => splitWords(l).map(w => w.toLowerCase()).join('-'))],
  ['dot.case', perLine(l => splitWords(l).map(w => w.toLowerCase()).join('.'))],
  ['Título', s => s.toLowerCase().replace(/(^|[\s(¿¡"'-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase())],
  ['Oración', s => s.toLowerCase().replace(/(^\s*|[.!?¿¡]\s+|\n\s*)(\p{L})/gu, (m, a, b) => a + b.toUpperCase())],
  ['MAYÚSCULAS', s => s.toUpperCase()],
  ['minúsculas', s => s.toLowerCase()],
  ['iNVERTIR', s => [...s].map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('')],
];
const collator = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
const LINE_OPS = [
  ['Ordenar A → Z', s => s.split('\n').sort(collator.compare).join('\n')],
  ['Ordenar Z → A', s => s.split('\n').sort(collator.compare).reverse().join('\n')],
  ['Invertir orden', s => s.split('\n').reverse().join('\n')],
  ['Mezclar', s => {
    const lines = s.split('\n');
    for (let i = lines.length - 1; i > 0; i--) { const j = randInt(i + 1); [lines[i], lines[j]] = [lines[j], lines[i]]; }

// Diferencia mínima entre dos secuencias (LCS), con atajo por prefijo y sufijo comunes.
function diffSeq(a, b, eq = (x, y) => x === y) {
  let start = 0;
  while (start < a.length && start < b.length && eq(a[start], b[start])) start++;
  let endA = a.length;
  let endB = b.length;
  while (endA > start && endB > start && eq(a[endA - 1], b[endB - 1])) { endA--; endB--; }
  const n = endA - start;
  const m = endB - start;
  if (n * m > 8e6) return null;
  const w = m + 1;
  const L = new Uint32Array((n + 1) * w);
  for (let i = n - 1; i >= 0; i--) {
    for (let j = m - 1; j >= 0; j--) {
      L[i * w + j] = eq(a[start + i], b[start + j]) ? L[(i + 1) * w + j + 1] + 1 : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
    }
  }
  const ops = [];
  for (let k = 0; k < start; k++) ops.push({ t: '=', a: k, b: k });
  let i = 0;
  let j = 0;
  while (i < n || j < m) {
    if (i < n && j < m && eq(a[start + i], b[start + j])) { ops.push({ t: '=', a: start + i, b: start + j }); i++; j++; }
    else if (i < n && (j >= m || L[(i + 1) * w + j] >= L[i * w + j + 1])) { ops.push({ t: '-', a: start + i }); i++; }
    else { ops.push({ t: '+', b: start + j }); j++; }
  }
  for (let k = 0; k < a.length - endA; k++) ops.push({ t: '=', a: endA + k, b: endB + k });
  return ops;
}

const diffTokens = s => s.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]/gu) || [];
function wordDiff(x, y) {
  const ta = diffTokens(x);
  const tb = diffTokens(y);
  const ops = diffSeq(ta, tb);
  if (!ops) return [esc(x), esc(y)];
  let l = '';
  let r = '';
  for (const o of ops) {
    if (o.t === '=') { l += esc(ta[o.a]); r += esc(tb[o.b]); }
    else if (o.t === '-') l += `<del>${esc(ta[o.a])}</del>`;
    else r += `<ins>${esc(tb[o.b])}</ins>`;
  }
  return [l.replaceAll('</del><del>', ''), r.replaceAll('</ins><ins>', '')];
}

function buildDiff(aText, bText, opts) {
  const a = aText.split(/\r?\n/);
  const b = bText.split(/\r?\n/);
  const norm = s => {
    if (opts.ws) s = s.replace(/\s+/g, ' ').trim();
    if (opts.ci) s = s.toLowerCase();
    return s;
  };
  const ops = diffSeq(a.map(norm), b.map(norm));
  if (!ops) return { html: '<p class="note" style="padding:12px">Los textos son demasiado grandes para compararlos aquí.</p>', added: 0, removed: 0 };
  const rows = [];
  for (let k = 0; k < ops.length;) {
    if (ops[k].t === '=') { rows.push({ t: 'eq', ai: ops[k].a, bi: ops[k].b }); k++; continue; }
    const dels = [];
    const adds = [];
    while (k < ops.length && ops[k].t !== '=') { (ops[k].t === '-' ? dels : adds).push(ops[k]); k++; }
    for (let i = 0; i < Math.max(dels.length, adds.length); i++) {
      rows.push({ t: dels[i] && adds[i] ? 'mod' : dels[i] ? 'del' : 'add', ai: dels[i] ? dels[i].a : null, bi: adds[i] ? adds[i].b : null });
    }
  }
  const added = rows.filter(r => r.bi != null && r.t !== 'eq').length;
  const removed = rows.filter(r => r.ai != null && r.t !== 'eq').length;
  // Solo cambios: se dejan 3 líneas de contexto alrededor de cada cambio.
  const keep = rows.map(() => !opts.fold);
  if (opts.fold) rows.forEach((r, i) => { if (r.t !== 'eq') for (let d = -3; d <= 3; d++) if (rows[i + d]) keep[i + d] = true; });
  let html = `<table class="diff ${opts.view === 'side' ? 'side' : 'uni'}">`;
  const td = (cls, content) => `<td class="${cls}">${content}</td>`;
  for (let i = 0; i < rows.length; i++) {
    if (!keep[i]) {
      let j = i;
      while (j < rows.length && !keep[j]) j++;
      html += `<tr class="fold"><td colspan="4">··· ${fmtNum(j - i)} líneas sin cambios ···</td></tr>`;
      i = j - 1;
      continue;
    }
    const r = rows[i];
    const la = r.ai != null ? a[r.ai] : '';
    const lb = r.bi != null ? b[r.bi] : '';
    const [wa, wb] = r.t === 'mod' ? wordDiff(la, lb) : [esc(la), esc(lb)];
    const na = r.ai != null ? r.ai + 1 : '';
    const nb = r.bi != null ? r.bi + 1 : '';
    if (opts.view === 'side') {
      const left = r.t === 'add' ? td('n blank', '') + td('c blank', '') : td(`n${r.t === 'eq' ? '' : ' del'}`, na) + td(`c${r.t === 'eq' ? '' : ' del'}`, wa);
      const right = r.t === 'del' ? td('n blank', '') + td('c blank', '') : td(`n${r.t === 'eq' ? '' : ' add'}`, nb) + td(`c${r.t === 'eq' ? '' : ' add'}`, wb);
      html += `<tr>${left}${right}</tr>`;
    } else if (r.t === 'eq') {
      html += `<tr>${td('n', na)}${td('n', nb)}${td('s', ' ')}${td('c', wa)}</tr>`;
    } else {
      if (r.ai != null) html += `<tr class="del">${td('n', na)}${td('n', '')}${td('s', '−')}${td('c', wa)}</tr>`;
      if (r.bi != null) html += `<tr class="add">${td('n', '')}${td('n', nb)}${td('s', '+')}${td('c', wb)}</tr>`;
    }
  }
  return { html: `${html}</table>`, added, removed };
}

const IMAGE_MAGIC = [['iVBOR', 'image/png'], ['/9j/', 'image/jpeg'], ['R0lGOD', 'image/gif'], ['UklGR', 'image/webp'], ['Qk', 'image/bmp'], ['PHN2Zy', 'image/svg+xml'], ['PD94bW', 'image/svg+xml'], ['AAABAA', 'image/x-icon']];
const EXT = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp', 'image/bmp': 'bmp', 'image/svg+xml': 'svg', 'image/x-icon': 'ico', 'image/avif': 'avif' };

  id: 'imagen', cat: 'codigo', name: 'Imagen ↔ Base64', color: '#00a3a3',

  render(body, ctx) {
    // Imagen → Base64
    let dataUri = '';
    let fileName = 'imagen';
    const preview = h('div', { class: 'preview', hidden: true });
    const info = h('div', { class: 'chips' });
    const out = textarea(null, null, { rows: 6, readonly: true, placeholder: 'Aquí aparecerá el resultado' });
    const format = seg(ctx, 'format', [['uri', 'Data URI'], ['raw', 'Solo Base64'], ['css', 'CSS'], ['img', 'HTML'], ['md', 'Markdown']], 'uri', () => paintOut());
    const paintOut = () => {
      if (!dataUri) { out.value = ''; return; }
      const raw = dataUri.slice(dataUri.indexOf(',') + 1);
      out.value = {
        uri: dataUri,
        raw,
        css: `background-image: url("${dataUri}");`,

        md: `![${fileName}](${dataUri})`,
      }[format.value];
    };

      if (!file.type.startsWith('image/')) { toast('Ese archivo no es una imagen'); return; }
      fileName = file.name.replace(/\.[^.]+$/, '') || 'imagen';

      reader.onload = () => {
        dataUri = reader.result;
        const img = h('img', { src: dataUri, alt: 'Vista previa' });
        img.onload = () => {
          info.replaceChildren(
            h('span', { class: 'chip', text: file.type }),
            h('span', { class: 'chip', text: `${img.naturalWidth} × ${img.naturalHeight} px` }),
            h('span', { class: 'chip', text: `Archivo: ${fmtBytes(file.size)}` }),
            h('span', { class: 'chip', text: `Base64: ${fmtBytes(dataUri.length)} (+${Math.round((dataUri.length / file.size - 1) * 100)} %)` }),
          );
        };
        preview.replaceChildren(img);
        preview.hidden = false;
        paintOut();
      };
      reader.readAsDataURL(file);
    };
    const zone = dropZone('<b>Arrastra una imagen</b>, haz clic para elegirla<br>o pégala con <kbd>Ctrl</kbd>+<kbd>V</kbd>', 'image/*', loadFile);

    // Base64 → Imagen
    const src = textarea(null, null, { rows: 6, placeholder: 'Pega aquí un data URI (data:image/png;base64,…) o Base64 puro' });
    const back = h('div', { class: 'preview', hidden: true });
    const backInfo = statusLine();
    // Se arma el archivo en el mismo clic (sin fetch asíncrono), para que el navegador no bloquee la descarga.
    const save = downloadBtn('Guardar imagen', () => {
      const comma = backUri.indexOf(',');
      const meta = backUri.slice(5, comma);
      const mime = meta.split(';')[0] || 'image/png';
      const payload = backUri.slice(comma + 1);
      let bytes;
      try {
        bytes = /;base64/i.test(meta) ? b64ToBytes(payload.replace(/\s+/g, '')) : enc.encode(decodeURIComponent(payload));
      } catch (e) {
        throw new Error('No se pudo descargar: el Base64 está incompleto o dañado');
      }
      return { name: `imagen.${EXT[mime] || 'png'}`, data: new Blob([bytes], { type: mime }) };
    }, { ready: false });
    let backUri = '';
    const decode = () => {
      let v = src.value.trim();
      back.hidden = true;
      save.setReady(false);
      if (!v) { backInfo.show(''); return; }
      let mime;
      if (v.startsWith('data:')) {
        if (/^data:[^,]*;base64,/i.test(v)) v = v.replace(/\s+/g, '');
        mime = (/^data:([^;,]+)/.exec(v) || [])[1];
      } else {
        v = v.replace(/\s+/g, '');
        mime = (IMAGE_MAGIC.find(([sig]) => v.startsWith(sig)) || [])[1] || 'image/png';
        v = `data:${mime};base64,${v}`;

      backUri = v;
      const img = h('img', { alt: 'Imagen decodificada' });

      panel('Imagen → Base64', zone, preview, info, format, out,
        row(copyBtn(() => out.value), downloadBtn('Guardar .txt',() => out.value && { name: `${fileName}.txt`, data: out.value }))),
      panel('Base64 → Imagen', src, backInfo, back, row(save, btn('Limpiar', () => setValue(src, ''), { icon: 'clear' }))),
    ));
    return () => document.removeEventListener('paste', onPaste);
  },
});

const utf8 = new TextDecoder('utf-8', { fatal: true });
const htmlDecoder = document.createElement('textarea');
const CODECS = {
  b64: {
    label: 'Base64',
    encode: s => bytesToB64(enc.encode(s)),
    decode: s => utf8.decode(b64ToBytes(s.replace(/\s+/g, ''))),
  },
  b64url: {
    label: 'Base64 URL',
    encode: s => bytesToB64(enc.encode(s)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
    decode: s => {
      let v = s.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
      while (v.length % 4) v += '=';
      return utf8.decode(b64ToBytes(v));
    },
  },
  url: { label: 'URL (componente)', encode: encodeURIComponent, decode: s => decodeURIComponent(s.replace(/\+/g, ' ')) },
  uri: { label: 'URL completa', encode: encodeURI, decode: decodeURI },
  html: {
    label: 'Entidades HTML',
    encode: s => s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
      .replace(/[^\x00-\x7f]/gu, c => `&#x${c.codePointAt(0).toString(16).toUpperCase()};`),
    decode: s => { htmlDecoder.innerHTML = s; return htmlDecoder.value; },
  },
  unicode: {
    label: 'Escape Unicode',
    encode: s => s.replace(/[^\x20-\x7e\n\r\t]/g, c => `\\u${c.charCodeAt(0).toString(16).padStart(4, '0')}`),
    decode: s => s.replace(/\\u\{([0-9a-fA-F]{1,6})\}|\\u([0-9a-fA-F]{4})|\\x([0-9a-fA-F]{2})/g, (m, a, b, c) => String.fromCodePoint(parseInt(a || b || c, 16))),
  },
  hex: {
    label: 'Hexadecimal',
    encode: s => bytesToHex(enc.encode(s)),
    decode: s => {
      const v = s.replace(/0x/gi, '').replace(/[\s,:-]+/g, '');
      if (!/^[0-9a-fA-F]*$/.test(v) || v.length % 2) throw new Error('El texto no es hexadecimal válido.');
      return utf8.decode(Uint8Array.from(v.match(/../g) || [], x => parseInt(x, 16)));
    },
  },
  bin: {
    label: 'Binario',
    encode: s => Array.from(enc.encode(s), b => b.toString(2).padStart(8, '0')).join(' '),
    decode: s => {
      const v = s.replace(/\s+/g, '');
      if (!/^[01]*$/.test(v) || v.length % 8) throw new Error('El texto no es binario válido (grupos de 8 bits).');
      return utf8.decode(Uint8Array.from(v.match(/.{8}/g) || [], x => parseInt(x, 2)));
    },
  },
};

function b64urlJson(part) {
  const text = CODECS.b64url.decode(part);
  return { text, json: JSON.parse(text) };
}

// MD5 (RFC 1321). SubtleCrypto no lo incluye, así que va implementado aquí.
const md5 = (() => {
  const K = new Uint32Array(64);
  for (let i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 2 ** 32) >>> 0;
  const S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  return bytes => {
    const len = bytes.length;
    const total = (((len + 8) >>> 6) + 1) * 64;
    const buf = new Uint8Array(total);
    buf.set(bytes);
    buf[len] = 0x80;
    const dv = new DataView(buf.buffer);
    dv.setUint32(total - 8, (len * 8) >>> 0, true);
    dv.setUint32(total - 4, Math.floor(len / 0x20000000), true);
    let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
    const M = new Uint32Array(16);
    for (let off = 0; off < total; off += 64) {
      for (let j = 0; j < 16; j++) M[j] = dv.getUint32(off + j * 4, true);
      let A = a0, B = b0, C = c0, D = d0;
      for (let i = 0; i < 64; i++) {
        let F, g;
        if (i < 16) { F = (B & C) | (~B & D); g = i; }
        else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
        else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
        else { F = C ^ (B | ~D); g = (7 * i) % 16; }
        F = (F + A + K[i] + M[g]) | 0;
        A = D; D = C; C = B;
        const s = S[(i >> 4) * 4 + (i % 4)];
        B = (B + ((F << s) | (F >>> (32 - s)))) | 0;
      }
      a0 = (a0 + A) | 0; b0 = (b0 + B) | 0; c0 = (c0 + C) | 0; d0 = (d0 + D) | 0;
    }
    const out = new Uint8Array(16);
    const odv = new DataView(out.buffer);
    [a0, b0, c0, d0].forEach((v, i) => odv.setUint32(i * 4, v >>> 0, true));
    return out;
  };
})();

function hmacMd5(key, msg) {
  if (key.length > 64) key = md5(key);
  const k = new Uint8Array(64);
  k.set(key);
  const inner = new Uint8Array(64 + msg.length);
  const outer = new Uint8Array(64 + 16);
  for (let i = 0; i < 64; i++) { inner[i] = k[i] ^ 0x36; outer[i] = k[i] ^ 0x5c; }
  inner.set(msg, 64);
  outer.set(md5(inner), 64);
  return md5(outer);
}

const HASHES = ['MD5', 'SHA-1', 'SHA-256', 'SHA-384', 'SHA-512'];
async function digest(alg, data, key) {
  if (alg === 'MD5') return key ? hmacMd5(key, data) : md5(data);
  if (!crypto.subtle) throw new Error('sin SubtleCrypto');
  if (key) {
    const k = await crypto.subtle.importKey('raw', key.length ? key : new Uint8Array(1), { name: 'HMAC', hash: alg }, false, ['sign']);
    return new Uint8Array(await crypto.subtle.sign('HMAC', k, data));
  }
  return new Uint8Array(await crypto.subtle.digest(alg, data));
}

/* ===== Datos y código ===== */

function sortKeys(v) {
  if (Array.isArray(v)) return v.map(sortKeys);
  if (v && typeof v === 'object') return Object.fromEntries(Object.keys(v).sort().map(k => [k, sortKeys(v[k])]));
  return v;
}

function toYaml(value) {
  const plain = s => /^[\p{L}\p{N}_][\p{L}\p{N}_ .\/()@-]*$/u.test(s) && !/\s$/.test(s)
    && !/^(true|false|null|yes|no|on|off|y|n|~)$/i.test(s) && !/^[-+]?(\d|\.\d)/.test(s);
  const scalar = v => v === null || v === undefined ? 'null'
    : typeof v === 'string' ? (plain(v) ? v : JSON.stringify(v))
    : Array.isArray(v) ? '[]' : typeof v === 'object' ? '{}' : String(v);
  const key = k => (/^[\p{L}_][\p{L}\p{N}_.-]*$/u.test(k) && plain(k) ? k : JSON.stringify(k));
  const complex = v => v && typeof v === 'object' && Object.keys(v).length > 0;
  const block = (v, indent) => {
    const pad = ' '.repeat(indent);
    if (Array.isArray(v)) {
      return v.map(item => complex(item) ? `${pad}- ${block(item, indent + 2).slice(indent + 2)}` : `${pad}- ${scalar(item)}`).join('\n');
    }
    return Object.entries(v).map(([k, item]) => complex(item)
      ? `${pad}${key(k)}:\n${block(item, Array.isArray(item) ? indent : indent + 2)}`
      : `${pad}${key(k)}: ${scalar(item)}`).join('\n');
  };
  return complex(value) ? block(value, 0) : scalar(value);
}

function toCsv(value, sep) {
  const rows = Array.isArray(value) ? value : [value];
  const cell = v => {
    if (v == null) return '';
    const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
    return s.includes(sep) || /["\r\n]/.test(s) || /^\s|\s$/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  if (rows.every(Array.isArray)) return rows.map(r => r.map(cell).join(sep)).join('\n');
  if (!rows.every(r => r && typeof r === 'object' && !Array.isArray(r))) throw new Error('Para CSV, el JSON debe ser un arreglo de objetos o de arreglos.');
  const keys = [];
  for (const r of rows) for (const k of Object.keys(r)) if (!keys.includes(k)) keys.push(k);
  return [keys.map(cell).join(sep), ...rows.map(r => keys.map(k => cell(r[k])).join(sep))].join('\n');
}

function parseCsv(text, sep) {
  const rows = [];
  let rowCells = [];
  let cell = '';
  let quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
      } else cell += c;
    } else if (c === '"' && cell === '') quoted = true;
    else if (c === sep) { rowCells.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      rowCells.push(cell); rows.push(rowCells); rowCells = []; cell = '';
      if (c === '\r' && text[i + 1] === '\n') i++;
    } else cell += c;
  }
  if (cell !== '' || rowCells.length) { rowCells.push(cell); rows.push(rowCells); }
  return rows.filter(r => !(r.length === 1 && r[0] === ''));
}

const guessSep = line => [',', ';', '\t', '|'].map(s => [s, line.split(s).length]).sort((a, b) => b[1] - a[1])[0][0];
const typed = s => /^-?(0|[1-9]\d*)(\.\d+)?$/.test(s) ? Number(s) : s === 'true' ? true : s === 'false' ? false : s === 'null' ? null : s;

function jsonError(e, text) {
  let pos = null;
  let m = /line (\d+) column (\d+)/.exec(e.message);
  if (m) {
    const lines = text.split('\n');
    pos = lines.slice(0, +m[1] - 1).reduce((n, l) => n + l.length + 1, 0) + +m[2] - 1;
  } else if ((m = /position (\d+)/.exec(e.message))) pos = +m[1];
  else if (/end of (JSON )?input|Unterminated/i.test(e.message)) pos = text.length;
  if (pos == null) return { message: e.message, pos: null };
  const before = text.slice(0, pos).split('\n');
  return { message: `Error en la línea ${before.length}, columna ${before[before.length - 1].length + 1}: ${e.message.replace(/ in JSON at position \d+.*$/, '').replace(/\s*\(line \d+ column \d+\)/, '')}`, pos };
}

const REGEX_FLAGS = [
  ['g', 'todas las coincidencias', 'Busca todas las coincidencias, no solo la primera.'],
  ['i', 'ignorar mayúsculas', 'Trata «A» y «a» como iguales.'],
  ['m', '^ y $ en cada línea', 'Hace que ^ y $ marquen el inicio y el final de cada línea, no de todo el texto.'],
  ['s', 'el punto incluye saltos', 'Hace que . también coincida con los saltos de línea.'],
  ['u', 'Unicode', 'Modo Unicode estricto: necesario para \\p{…} y emojis, pero rechaza escapes innecesarios como \\@.'],
];

// Nombre de cada grupo de captura, en orden: null si no tiene nombre.
function groupNames(src) {
  const names = [];
  let inClass = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c === '\\') { i++; continue; }
    if (inClass) { if (c === ']') inClass = false; continue; }
    if (c === '[') { inClass = true; continue; }
    if (c !== '(') continue;
    if (src[i + 1] !== '?') names.push(null);
    else {
      const m = /^\(\?<([A-Za-z_$][\w$]*)>/.exec(src.slice(i));
      if (m) names.push(m[1]);
    }
  }
  return names;
}

function regexError(message) {
  const m = message.replace(/^Invalid regular expression: \/[\s\S]*\/[a-z]*: /, '');
  const known = [
    [/Nothing to repeat/i, 'Hay un *, +, ? o {n} sin nada antes que repetir (por ejemplo «\\b*» o «(*»). Si quieres el símbolo literal, escríbelo con barra: \\* \\+ \\?'],
    [/Unterminated group/i, 'Falta cerrar un paréntesis «)».'],
    [/Unmatched '\)'/i, 'Sobra un paréntesis de cierre «)».'],
    [/Unterminated character class/i, 'Falta cerrar un corchete «]».'],
    [/Lone quantifier brackets/i, 'Hay una llave «{» o «}» suelta. Si es literal, escríbela como \\{ o \\}.'],
    [/Invalid escape|Invalid Unicode escape|Invalid property name/i, 'Hay un escape con barra (\\) que no es válido en modo Unicode. Desactiva la bandera u o quita esa barra.'],
    [/Invalid capture group name|Invalid named reference/i, 'El nombre de un grupo no es válido. Se escribe (?<nombre>…), con letras y sin espacios.'],
    [/Invalid group/i, 'La forma de un grupo no es válida. Revisa lo que hay justo después de «(?».'],
    [/Duplicate capture group name/i, 'Hay dos grupos con el mismo nombre.'],
    [/numbers out of order/i, 'En un {mín,máx}, el mínimo es mayor que el máximo.'],
    [/Range out of order/i, 'Un rango entre corchetes está al revés, como [z-a].'],
    [/\\ at end of pattern/i, 'El patrón termina con una barra «\\» sin nada después.'],
  ];
  const hit = known.find(([re]) => re.test(m));
  return hit ? hit[1] : m;
}

/* Cron de 5 campos: minuto hora día-del-mes mes día-de-la-semana */
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const CRON_FIELDS = [
  { name: 'Minuto', min: 0, max: 59, unit: ['minuto', 'minutos'] },
  { name: 'Hora', min: 0, max: 23, unit: ['hora', 'horas'] },
  { name: 'Día del mes', min: 1, max: 31, unit: ['día', 'días'] },
  { name: 'Mes', min: 1, max: 12, unit: ['mes', 'meses'], names: ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'], offset: 1 },
  { name: 'Día de la semana', min: 0, max: 7, unit: ['día', 'días'], names: ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], offset: 0 },
];
const CRON_MACROS = { '@yearly': '0 0 1 1 *', '@annually': '0 0 1 1 *', '@monthly': '0 0 1 * *', '@weekly': '0 0 * * 0', '@daily': '0 0 * * *', '@midnight': '0 0 * * *', '@hourly': '0 * * * *' };

function cronValue(token, f) {
  const up = token.toUpperCase();
  if (f.names && f.names.includes(up)) return f.names.indexOf(up) + f.offset;
  if (!/^\d+$/.test(token)) throw new Error(`${f.name}: «${token}» no es un valor válido.`);
  return +token;
}

function parseCronField(raw, f) {
  const set = new Set();
  for (const part of raw.split(',')) {
    const m = /^(\*|\?|[^/-]+(?:-[^/-]+)?)(?:\/(\d+))?$/.exec(part);
    if (!m) throw new Error(`${f.name}: «${part}» no se entiende.`);
    const step = m[2] ? +m[2] : 1;
    if (step < 1) throw new Error(`${f.name}: el paso debe ser mayor que 0.`);
    let lo, hi;
    if (m[1] === '*' || m[1] === '?') { lo = f.min; hi = f.max; }
    else {
      const [a, b] = m[1].split('-');
      lo = cronValue(a, f);
      hi = b !== undefined ? cronValue(b, f) : m[2] ? f.max : lo;
    }
    if (lo < f.min || hi > f.max || lo > hi) throw new Error(`${f.name}: «${part}» está fuera del rango ${f.min}–${f.max}.`);
    for (let v = lo; v <= hi; v += step) set.add(v);
  }
  if (f === CRON_FIELDS[4] && set.has(7)) { set.delete(7); set.add(0); }
  return set;
}

function describeCronField(raw, f, fmt) {
  if (raw === '*' || raw === '?') return null;
  return joinY(raw.split(',').map(part => {
    const [range, step] = part.split('/');
    const every = step === '1' ? `cada ${f.unit[0]}` : `cada ${step} ${f.unit[1]}`;
    if (range === '*' || range === '?') return every;
    const [a, b] = range.split('-');
    const A = fmt(cronValue(a, f));
    const B = b !== undefined ? fmt(cronValue(b, f)) : null;
    if (step) return B ? `${every} de ${A} a ${B}` : `${every} desde ${A}`;
    return B ? `de ${A} a ${B}` : A;
  }));
}

function describeCron(parts) {
  const [mi, ho, dom, mon, dow] = parts;
  const num = s => /^\d+$/.test(s);
  const p2 = n => String(n).padStart(2, '0');
  let time;
  if (mi.split(',').every(num) && ho.split(',').every(num) && mi.split(',').length * ho.split(',').length <= 6) {
    const times = [];
    for (const hh of ho.split(',')) for (const mm of mi.split(',')) times.push(`${p2(+hh)}:${p2(+mm)}`);
    time = `a las ${joinY(times)}`;
  } else if (num(mi) && ho === '*') {
    time = +mi === 0 ? 'cada hora, en punto' : `en el minuto ${+mi} de cada hora`;
  } else if (num(mi) && /^\*\/\d+$/.test(ho)) {
    time = `cada ${ho.slice(2)} horas, ${+mi === 0 ? 'en punto' : `en el minuto ${+mi}`}`;
  } else {
    const mp = mi === '*' ? 'cada minuto' : num(mi) ? `en el minuto ${+mi}` : /^\*\//.test(mi) ? describeCronField(mi, CRON_FIELDS[0], String) : `en los minutos ${describeCronField(mi, CRON_FIELDS[0], String)}`;
    let hp = '';
    if (/^\d+-\d+$/.test(ho)) { const [a, b] = ho.split('-'); hp = `entre las ${p2(+a)}:00 y las ${p2(+b)}:59`; }
    else if (ho !== '*') hp = /^\*\//.test(ho) ? describeCronField(ho, CRON_FIELDS[1], String) : `durante la${ho.split(',').length > 1 ? 's' : ''} hora${ho.split(',').length > 1 ? 's' : ''} ${describeCronField(ho, CRON_FIELDS[1], String)}`;
    time = [mp, hp].filter(Boolean).join(', ');
  }
  const domD = describeCronField(dom, CRON_FIELDS[2], String);
  const dowD = describeCronField(dow, CRON_FIELDS[4], v => WEEKDAYS[v]);
  const monD = describeCronField(mon, CRON_FIELDS[3], v => MONTHS[v - 1]);
  const plural = s => s.replace(/\b(sábado|domingo)\b/g, '$1s');
  const dowText = dowD && (/^(de|cada) /.test(dowD) ? dowD : `los ${plural(dowD)}`);
  const domText = domD && (/^(de|cada) /.test(domD) ? `${domD} del mes` : `el día ${domD} de cada mes`);
  const days = !domD && !dowD ? 'todos los días' : domD && dowD ? `${domText} o ${dowText}` : dowText || domText;

  return `${cap([time, days, month].filter(Boolean).join(', '))}.`;
}

function nextCronRuns(parts, sets, count) {
  const [, , domRaw, , dowRaw] = parts;
  const domAll = domRaw === '*' || domRaw === '?';
  const dowAll = dowRaw === '*' || dowRaw === '?';
  const d = new Date();
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() + 1);
  const runs = [];
  for (let guard = 0; runs.length < count && guard < 400000; guard++) {
    if (!sets[3].has(d.getMonth() + 1)) { d.setMonth(d.getMonth() + 1, 1); d.setHours(0, 0, 0, 0); continue; }
    const domOk = sets[2].has(d.getDate());
    const dowOk = sets[4].has(d.getDay());
    const dayOk = domAll && dowAll ? true : domAll ? dowOk : dowAll ? domOk : domOk || dowOk;
    if (!dayOk) { d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); continue; }
    if (!sets[1].has(d.getHours())) { d.setHours(d.getHours() + 1, 0, 0, 0); continue; }
    if (!sets[0].has(d.getMinutes())) { d.setMinutes(d.getMinutes() + 1, 0, 0); continue; }
    runs.push(new Date(d));
    d.setMinutes(d.getMinutes() + 1);
  }
  return runs;
}

// Entero aleatorio uniforme en [0, n), sin sesgo de módulo.
function randInt(n) {
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= limit);
  return buf[0] % n;
}

function formatUuid(b) {
  const x = bytesToHex(b);
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}
function uuid4() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  return formatUuid(b);
}
let lastV7 = 0;
function uuid7() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  const ms = Math.max(Date.now(), lastV7);
  lastV7 = ms;
  const hi = Math.floor(ms / 0x100000000);
  b[0] = (hi >>> 8) & 0xff; b[1] = hi & 0xff;
  b[2] = (ms >>> 24) & 0xff; b[3] = (ms >>> 16) & 0xff; b[4] = (ms >>> 8) & 0xff; b[5] = ms & 0xff;
  b[6] = (b[6] & 0x0f) | 0x70;
  b[8] = (b[8] & 0x3f) | 0x80;
  return formatUuid(b);
}

/* Codificador QR (ISO/IEC 18004), modo byte con UTF-8. */
const QR = (() => {

    Q: [-1, 13, 22, 18, 26, 18, 24, 18, 22, 20, 24, 28, 26, 24, 20, 30, 24, 28, 28, 26, 30, 28, 30, 30, 30, 30, 28, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
    H: [-1, 17, 28, 22, 16, 22, 28, 26, 26, 24, 28, 24, 28, 22, 24, 24, 30, 28, 28, 26, 28, 30, 24, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30, 30],
  };
  const BLOCKS = {
    L: [-1, 1, 1, 1, 1, 1, 2, 2, 2, 2, 4, 4, 4, 4, 4, 6, 6, 6, 6, 7, 8, 8, 9, 9, 10, 12, 12, 12, 13, 14, 15, 16, 17, 18, 19, 19, 20, 21, 22, 24, 25],
    M: [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16, 17, 17, 18, 20, 21, 23, 25, 26, 28, 29, 31, 33, 35, 37, 38, 40, 43, 45, 47, 49],
    Q: [-1, 1, 1, 2, 2, 4, 4, 6, 6, 8, 8, 8, 10, 12, 16, 12, 17, 16, 18, 21, 20, 23, 23, 25, 27, 29, 34, 34, 35, 38, 40, 43, 45, 48, 51, 53, 56, 59, 62, 65, 68],
    H: [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  };
  const FORMAT = { L: 1, M: 0, Q: 3, H: 2 };
  const rawModules = ver => {
    let n = (16 * ver + 128) * ver + 64;
    if (ver >= 2) {
      const align = Math.floor(ver / 7) + 2;
      n -= (25 * align - 10) * align - 55;
      if (ver >= 7) n -= 36;
    }
    return n;
  };
  const dataCodewords = (ver, ecl) => Math.floor(rawModules(ver) / 8) - ECC[ecl][ver] * BLOCKS[ecl][ver];
  const gfMul = (x, y) => {
    let z = 0;
    for (let i = 7; i >= 0; i--) {
      z = (z << 1) ^ ((z >>> 7) * 0x11d);
      z ^= ((y >>> i) & 1) * x;
    }
    return z;
  };
  const rsDivisor = degree => {
    const result = new Array(degree).fill(0);
    result[degree - 1] = 1;
    let root = 1;
    for (let i = 0; i < degree; i++) {
      for (let j = 0; j < degree; j++) {
        result[j] = gfMul(result[j], root);
        if (j + 1 < degree) result[j] ^= result[j + 1];
      }
      root = gfMul(root, 0x02);
    }
    return result;
  };
  const rsRemainder = (data, divisor) => {
    const result = new Array(divisor.length).fill(0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => { result[i] ^= gfMul(coef, factor); });
    }
    return result;
  };
  const alignmentPositions = ver => {
    if (ver === 1) return [];
    const count = Math.floor(ver / 7) + 2;
    const step = Math.floor((ver * 8 + count * 3 + 5) / (count * 4 - 4)) * 2;
    const result = [6];
    for (let pos = ver * 4 + 17 - 7; result.length < count; pos -= step) result.splice(1, 0, pos);
    return result;

    let ver = 1;
    for (; ver <= 40; ver++) if (4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 <= dataCodewords(ver, ecl) * 8) break;
    if (ver > 40) throw new Error('El texto es demasiado largo para un código QR con este nivel de corrección.');

    // Datos: modo byte, longitud, contenido, terminador y relleno.
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(0x4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    for (const b of bytes) push(b, 8);

    const data = [];
    for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((v, b) => (v << 1) | b, 0));

    // Bloques con corrección de errores, intercalados.
    const numBlocks = BLOCKS[ecl][ver];
    const eccLen = ECC[ecl][ver];

    }

    // Matriz.
    const size = ver * 4 + 17;
    const mods = Array.from({ length: size }, () => new Array(size).fill(false));
    const isFn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, dark) => { mods[y][x] = dark; isFn[y][x] = true; };
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        const x = cx + dx;
        const y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, dist !== 2 && dist !== 4);
      }
    }
    const align = alignmentPositions(ver);
    const last = align.length - 1;
    align.forEach((ax, i) => align.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));

      const d = (FORMAT[ecl] << 3) | mask;

      setFn(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));

      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,

    ];

    };

}

}
