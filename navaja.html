// Corre dentro de la vista previa, que está aislada de la Navaja: pasa la consola y los errores a la
// herramienta, recuerda el desplazamiento y sustituye lo que el aislamiento no deja usar
// (alert, localStorage). Se inyecta en una sola línea para no mover los números de línea.
// Sin comentarios de línea dentro: se compacta quitando los saltos de línea.
function hvHelper(cfg) {
  var show = function (v) {
    try {
      if (typeof v === 'string') return v;
      if (typeof v === 'function') return 'ƒ ' + (v.name || 'anónima') + '()';
      if (typeof v === 'bigint') return v + 'n';
      if (typeof v === 'symbol') return v.toString();
      if (v instanceof Error) return v.name + ': ' + v.message;
      if (typeof Node !== 'undefined' && v instanceof Node) {
        if (v.nodeType !== 1) return v.nodeName;
        return '<' + v.tagName.toLowerCase() + (v.id ? ' id="' + v.id + '"' : '') + (typeof v.className === 'string' && v.className ? ' class="' + v.className + '"' : '') + '>';
      }
      if (v && typeof v === 'object') {
        var seen = new WeakSet();
        var s = JSON.stringify(v, function (k, x) {
          if (typeof x === 'bigint') return x + 'n';
          if (typeof x === 'function') return 'ƒ ' + (x.name || 'anónima') + '()';
          if (x === undefined) return 'undefined';
          if (x && typeof x === 'object') { if (seen.has(x)) return '[circular]'; seen.add(x); }
          return x;
        }, 2);
        return s === undefined ? String(v) : s;
      }
      return String(v);
    } catch (e) {
      try { return String(v); } catch (e2) { return '[objeto]'; }
    }
  };
  var send = function (t, a, more) {
    var msg = { hv: cfg.id, t: t, a: [] };
    for (var i = 0; i < a.length; i++) { var s = show(a[i]); msg.a.push(s.length > 5000 ? s.slice(0, 5000) + '…' : s); }
    if (more) for (var k in more) msg[k] = more[k];
    try { parent.postMessage(msg, '*'); } catch (e) { }
  };
  var con = window.console;
  ['log', 'info', 'warn', 'error', 'debug', 'table', 'dir'].forEach(function (k) {
    var orig = con[k];
    con[k] = function () {
      var a = Array.prototype.slice.call(arguments);
      send(k === 'table' || k === 'dir' ? 'log' : k, a);
      if (orig) return orig.apply(con, a);
    };
  });
  var origAssert = con.assert;
  con.assert = function (ok) {
    if (!ok) send('error', ['Falló la aserción'].concat(Array.prototype.slice.call(arguments, 1)));
    if (origAssert) origAssert.apply(con, arguments);
  };
  var origClear = con.clear;
  con.clear = function () { send('clear', []); if (origClear) origClear.call(con); };
  window.alert = function (m) { send('info', ['alert: ' + (m === undefined ? '' : show(m))]); };
  window.confirm = function (m) { send('info', ['confirm: ' + (m === undefined ? '' : show(m)) + ' → se responde «Cancelar»']); return false; };
  window.prompt = function (m) { send('info', ['prompt: ' + (m === undefined ? '' : show(m)) + ' → se responde vacío']); return null; };
  window.addEventListener('error', function (e) {
    var el = e.target;
    if (el && el !== window && el.tagName) {
      var url = el.currentSrc || el.src || el.href || '';
      if (!blocked.has(url)) send('warn', ['No se pudo cargar <' + el.tagName.toLowerCase() + '>: ' + url]);
      return;
    }
    send('error', [(e.message || 'Error') + (e.lineno ? ' (línea ' + e.lineno + ')' : '')]);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { send('error', ['Promesa rechazada sin capturar: ' + show(e.reason)]); });
  var blocked = new Set();
  document.addEventListener('securitypolicyviolation', function (e) { blocked.add(e.blockedURI); send('warn', ['Bloqueado, viene de internet: ' + e.blockedURI]); });
  ['localStorage', 'sessionStorage'].forEach(function (n) {
    try { if (window[n].length >= 0) return; } catch (e) { }
    var m = new Map();
    var store = {
      getItem: function (k) { k = String(k); return m.has(k) ? m.get(k) : null; },
      setItem: function (k, v) { m.set(String(k), String(v)); },
      removeItem: function (k) { m.delete(String(k)); },
      clear: function () { m.clear(); },
      key: function (i) { return Array.from(m.keys())[i] || null; }
    };
    Object.defineProperty(store, 'length', { get: function () { return m.size; } });
    try { Object.defineProperty(window, n, { configurable: true, value: store }); } catch (e) { }
  });
  var timer;
  window.addEventListener('scroll', function () {
    clearTimeout(timer);
    timer = setTimeout(function () { send('scroll', [], { x: window.scrollX, y: window.scrollY }); }, 120);
  });
  if (cfg.x || cfg.y) {
    var restore = function () { window.scrollTo(cfg.x, cfg.y); };
    document.addEventListener('DOMContentLoaded', restore);
    window.addEventListener('load', restore);
  }
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a || e.defaultPrevented) return;
    var href = a.getAttribute('href');
    if (href.charAt(0) !== '#') return;
    e.preventDefault();
    var id = href.slice(1);
    try { id = decodeURIComponent(id); } catch (err) { }
    var el = id ? document.getElementById(id) || document.getElementsByName(id)[0] : null;
    if (el) el.scrollIntoView(); else if (!id || id === 'top') window.scrollTo(0, 0);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') send('esc', []); });
}
const HV_HELPER = hvHelper.toString().replace(/\s*\n\s*/g, ' ');
const HV_SANDBOX = 'allow-forms allow-popups allow-popups-to-escape-sandbox';
const HV_OFFLINE = "default-src 'none'; img-src data: blob:; media-src data: blob:; font-src data:; style-src 'unsafe-inline' data: blob:; script-src 'unsafe-inline' 'unsafe-eval' data: blob:; frame-src data: blob:";
const HV_DEVICES = { auto: 0, mobile: 375, tablet: 768, desktop: 1280 };
const HV_ICON = {
  expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  shrink: '<path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>',

// Página que se muestra: lo del usuario, con lo nuestro pegado detrás del doctype y en la misma línea.
// Sin doctype se le pone uno, como hacen los editores en línea, para no caer en el modo «quirks».
function hvDocument(code, opts) {
  let head = '';
  if (opts.offline) head += `<meta http-equiv="Content-Security-Policy" content="${HV_OFFLINE}">`;
  if (opts.scripts) head += `<script>(${HV_HELPER})(${JSON.stringify(opts.cfg)});<\/script>`;
  if (!/<base[\s>]/i.test(code)) head += '<base target="_blank">';
  const m = /^﻿?\s*<!doctype\b[^>]*>/i.exec(code);
  return m ? m[0] + head + code.slice(m[0].length) : `<!doctype html>${head}${code}`;
}

      paintCount();

      if (!entries) log.replaceChildren();

      if (log.childElementCount >= 500) log.firstElementChild.remove();
      log.append(h('li', { class: type, text: text || ' ' }));

    window.addEventListener('message', onMessage);

    // Tamaño de pantalla: la página se dibuja a ese ancho y se reduce si no cabe.
    const device = seg(ctx, 'device', [['auto', 'Ajustable'], ['mobile', 'Móvil'], ['tablet', 'Tablet'], ['desktop', 'Escritorio']], 'auto', () => fit());
    const fit = () => {
      const aw = stage.clientWidth;

      Object.assign(frame.style, { width: `${w}px`, height: `${fh}px`, transform: k < 1 ? `scale(${k})` : '' });
      tag.textContent = `${fmtNum(w)} × ${fmtNum(fh)} px${k < 1 ? ` · al ${Math.round(k * 100)} %` : ''}`;
    };
    const observer = new ResizeObserver(fit);
    observer.observe(stage);

    let full = false;

    const onKey = e => {
      if (e.key !== 'Escape' || !full) return;
      e.preventDefault();
      e.stopPropagation();
      setFull(false);
    };
    window.addEventListener('keydown', onKey, true);

    // Abrir un archivo: con el botón o soltándolo sobre el editor.
    const picker = h('input', { type: 'file', accept: '.html,.htm,.xhtml,.svg,text/html', hidden: true });
    const openFile = async f => {
      if (f.size > 5 * 1024 * 1024) { toast('El archivo pesa más de 5 MB: es demasiado para el editor'); return; }
      const text = await f.text();
      fileName = /\.html?$/i.test(f.name) ? f.name : `${f.name.replace(/\.[^.]*$/, '') || 'pagina'}.html`;
      scroll = { x: 0, y: 0 };
      setValue(src, text);
      render();
      toast(`Abierto: ${f.name}`);
    };
    picker.addEventListener('change', () => { if (picker.files[0]) openFile(picker.files[0]); picker.value = ''; });
    const hasFiles = e => [...(e.dataTransfer?.types || [])].includes('Files');
    const editor = panel('Código HTML', src,
      h('div', { class: 'row' }, counts, h('span', { class: 'spacer' }),
        btn('Abrir .html', () => picker.click(), { icon: 'upload', small: true }),
        btn('Ejemplo', () => { fileName = ''; scroll = { x: 0, y: 0 }; setValue(src, HV_SAMPLE); render(); }, { icon: 'refresh', small: true }),
        btn('Limpiar', () => { fileName = ''; scroll = { x: 0, y: 0 }; setValue(src, ''); render(); src.focus(); }, { icon: 'clear', small: true })),
      picker);
    editor.classList.add('hv-drop');
    editor.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); editor.classList.add('over'); } });
    editor.addEventListener('dragleave', e => { if (!editor.contains(e.relatedTarget)) editor.classList.remove('over'); });
    editor.addEventListener('drop', e => {
      editor.classList.remove('over');
      const f = e.dataTransfer.files[0];
      if (!f) return;
      e.preventDefault();
      openFile(f);
    });

    const saveName = () => {
      if (fileName) return fileName;
      const m = /<title[^>]*>([^<]*)<\/title>/i.exec(src.value);
      const slug = (m ? m[1] : '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
      return `${slug || 'pagina'}.html`;
    };

    body.append(splitCols(
      editor,
      panel('Vista previa', view,
        h('div', { class: 'row opts' }, scripts, live, offline),
        h('div', { class: 'hv-console' },
          h('div', { class: 'hv-con-head' }, h('b', { text: 'Consola' }), logCount, h('span', { class: 'spacer' }), btn('Limpiar', clearLog, { icon: 'clear', small: true })),
          log),
        row(copyBtn(() => src.value, 'Copiar código'),
          downloadBtn('Guardar .html', () => src.value.trim() && { name: saveName(), data: src.value, type: 'text/html' }))),
    ));
    paintCounts();
    render();
    return () => {
      clearTimeout(timer);
      observer.disconnect();
      window.removeEventListener('message', onMessage);
      window.removeEventListener('keydown', onKey, true);
      document.documentElement.classList.remove('hv-lock');
    };
  },
});

];
const REGEX_FLAGS = [
  ['g', 'todas las coincidencias', 'Busca todas las coincidencias, no solo la primera.'],
  ['i', 'ignorar mayúsculas', 'Trata «A» y «a» como iguales.'],
  ['m', '^ y $ en cada línea', 'Hace que ^ y $ marquen el inicio y el final de cada línea, no de todo el texto.'],
  ['s', 'el punto incluye saltos', 'Hace que . también coincida con los saltos de línea.'],
  ['u', 'Unicode', 'Modo Unicode estricto: necesario para \\p{…} y emojis, pero rechaza escapes innecesarios como \\@.'],
];

// Nombre de cada grupo de captura, en orden: null si no tiene nombre.
function groupNames(src) {
  const names = [];
  let inClass = false;
  for (let i = 0; i < src.length; i++) {
    const c = src[i];
    if (c === '\\') { i++; continue; }
    if (inClass) { if (c === ']') inClass = false; continue; }
    if (c === '[') { inClass = true; continue; }
    if (c !== '(') continue;
    if (src[i + 1] !== '?') names.push(null);
    else {
      const m = /^\(\?<([A-Za-z_$][\w$]*)>/.exec(src.slice(i));
      if (m) names.push(m[1]);
    }
  }
  return names;
}

function regexError(message) {
  const m = message.replace(/^Invalid regular expression: \/[\s\S]*\/[a-z]*: /, '');
  const known = [
    [/Nothing to repeat/i, 'Hay un *, +, ? o {n} sin nada antes que repetir (por ejemplo «\\b*» o «(*»). Si quieres el símbolo literal, escríbelo con barra: \\* \\+ \\?'],
    [/Unterminated group/i, 'Falta cerrar un paréntesis «)».'],
    [/Unmatched '\)'/i, 'Sobra un paréntesis de cierre «)».'],
    [/Unterminated character class/i, 'Falta cerrar un corchete «]».'],
    [/Lone quantifier brackets/i, 'Hay una llave «{» o «}» suelta. Si es literal, escríbela como \\{ o \\}.'],
    [/Invalid escape|Invalid Unicode escape|Invalid property name/i, 'Hay un escape con barra (\\) que no es válido en modo Unicode. Desactiva la bandera u o quita esa barra.'],
    [/Invalid capture group name|Invalid named reference/i, 'El nombre de un grupo no es válido. Se escribe (?<nombre>…), con letras y sin espacios.'],
    [/Invalid group/i, 'La forma de un grupo no es válida. Revisa lo que hay justo después de «(?».'],
    [/Duplicate capture group name/i, 'Hay dos grupos con el mismo nombre.'],
    [/numbers out of order/i, 'En un {mín,máx}, el mínimo es mayor que el máximo.'],
    [/Range out of order/i, 'Un rango entre corchetes está al revés, como [z-a].'],
    [/\\ at end of pattern/i, 'El patrón termina con una barra «\\» sin nada después.'],
  ];
  const hit = known.find(([re]) => re.test(m));
  return hit ? hit[1] : m;
}

tool({
  id: 'regex', cat: 'datos', name: 'Probador de regex', color: '#e8710a',
  desc: 'Prueba una expresión regular sobre ejemplos: qué coincide, qué línea valida y qué captura.',
  keywords: 'regex expresion regular regexp probar validar match grupos reemplazar correo',
  icon: '<path d="M17 3v8M13.5 5l7 4M20.5 5l-7 4"/><rect x="3" y="15" width="5" height="5" rx="1"/>',
  render(body, ctx) {
    const first = REGEX_EXAMPLES[0];
    const pattern = input(ctx, 'pattern2', { mono: true, value: first.pattern, placeholder: 'Ejemplo: \\d+   (uno o más dígitos)' });
    pattern.style.fontSize = '1rem';
    let flags = new Set(ctx.get('flags2', first.flags).split(''));

    const flagBox = h('div', { class: 'row' }, REGEX_FLAGS.map(([f, label, tip]) => {
      const c = check(null, null, h('span', { title: tip }, h('b', { class: 'mono', text: f }), ` ${label}`), flags.has(f), on => {
        if (on) flags.add(f); else flags.delete(f);
        ctx.set('flags2', [...flags].join(''));
        run();
      });
      c.title = tip;
      flagChecks[f] = c;
      return c;
    }));
    const setFlags = str => {
      flags = new Set(str.split('').filter(f => flagChecks[f]));
      ctx.set('flags2', [...flags].join(''));

        shown.textContent = s;
        perLine.replaceChildren();
        summary.replaceChildren();
        replaced.textContent = '';
        return;
      }

      // Coincidencias resaltadas en el texto.
      const all = new RegExp(src, f.includes('g') ? f : `${f}g`);
      const matches = [];
      for (const m of s.matchAll(all)) {
        matches.push(m);
        if (!f.includes('g') || matches.length >= 1000) break;
      }
      let html = '';
      let last = 0;
      matches.forEach((m, i) => {
        html += esc(s.slice(last, m.index));
        html += m[0] ? `<mark class="${i % 2 ? 'alt' : ''}">${esc(m[0])}</mark>` : '';

      // Validación línea por línea: ¿cada ejemplo cumple el patrón?

      }));

          h('tbody', {}, matches.slice(0, 300).map((m, i) => h('tr', {},
            h('td', { text: String(i + 1) }), h('td', { class: 'mono', text: m[0] }),
            m.slice(1).map(g => h('td', { class: 'mono', text: g ?? '—' })))))));
        groupsPanel.hidden = false;

    pattern.addEventListener('input', () => {

      setValue(pattern, ex.pattern);
      setFlags(ex.flags);
      setValue(text, ex.text);
      setValue(replace, ex.replace || '');
      run();
    };
    const insert = token => {
      const t = token.replace('…', '');

        h('ol', { class: 'steps' },
          h('li', { text: 'Escribe el patrón que quieres probar, o elige un ejemplo listo de abajo.' }),
          h('li', { text: 'En «Textos de prueba» pon ejemplos, uno por línea: unos que deberían cumplir y otros que no.' }),
          h('li', { text: 'Mira el resultado: ✓ o ✕ por cada línea, y en amarillo lo que coincide.' })),
        h('p', { class: 'note', text: 'Ejemplos listos (cargan el patrón y unos textos de prueba):' }),
        h('div', { class: 'chips' }, REGEX_EXAMPLES.map(ex => h('button', { type: 'button', class: 'chip', text: ex.name, onclick: () => load(ex) })))),
      panel('1. Patrón',

        h('p', { class: 'note', text: 'Puedes pegarlo con o sin las barras: /patrón/gm también funciona.' }),
        flagBox, status, hint,
        row(btn('Borrar patrón', () => { setValue(pattern, ''); pattern.focus(); }, { icon: 'clear', small: true }),
          btn('Restablecer ejemplo', () => load(first), { icon: 'refresh', small: true }))),
      cols(

          row(btn('Borrar textos', () => { setValue(text, ''); text.focus(); }, { icon: 'clear', small: true }))),
        panel('3. Resultado', h('h2', { text: '¿Cada línea cumple el patrón?', style: 'margin:0;font-size:.875rem' }), summary, perLine,
          h('p', { class: 'note', text: 'Para validar que una línea entera cumpla (un correo, un teléfono…), el patrón debe empezar con ^ y terminar con $.' }),
          h('h2', { text: 'Coincidencias en el texto', style: 'margin:16px 0 0;font-size:.875rem' }), shown),

tool({
  id: 'bases', cat: 'datos', name: 'Bases numéricas', color: '#1a73e8',
  desc: 'Decimal, binario, octal y hexadecimal sincronizados, de cualquier tamaño.',
  keywords: 'binario hexadecimal octal decimal base convertir bits bytes hex bin',
  icon: '<path d="M5 4v6M3.5 4H5M3.5 10h3"/><rect x="10" y="4" width="4" height="6" rx="2"/><rect x="5" y="14" width="4" height="6" rx="2"/><path d="M14 14v6M12.5 14H14M12.5 20h3"/><path d="M18 6h3M18 18h3"/>',
  render(body, ctx) {
    const defs = [
      ['dec', 'Decimal', 10, /^\d+$/, ''],
      ['hex', 'Hexadecimal', 16, /^[0-9a-f]+$/i, '0x'],
      ['bin', 'Binario', 2, /^[01]+$/, '0b'],
      ['oct', 'Octal', 8, /^[0-7]+$/, '0o'],
    ];
    const inputs = {};
    const status = statusLine();
    const info = stats([['bits', 'Bits'], ['bytes', 'Bytes'], ['signed', 'Con signo (complemento a 2)']]);
    const grouped = h('pre', { class: 'code' });
    const paint = (value, from) => {
      for (const [k, , base] of defs) if (k !== from) inputs[k].value = value == null ? '' : value.toString(base).toUpperCase();
      if (value == null) { info.set({ bits: '0', bytes: '0', signed: '—' }); grouped.textContent = ''; return; }
      const bits = value === 0n ? 1 : value.toString(2).length;
      const bytes = Math.ceil(bits / 8);
      const width = BigInt(bytes * 8);
      const signed = value >= (1n << (width - 1n)) ? value - (1n << width) : value;
      info.set({ bits: fmtNum(bits), bytes: fmtNum(bytes), signed: signed.toString() });
      grouped.textContent = value.toString(2).padStart(bytes * 8, '0').match(/.{4}/g).join(' ');
    };

/* Cron de 5 campos: minuto hora día-del-mes mes día-de-la-semana */
const MONTHS = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const WEEKDAYS = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado', 'domingo'];
const CRON_FIELDS = [
  { name: 'Minuto', min: 0, max: 59, unit: ['minuto', 'minutos'] },
  { name: 'Hora', min: 0, max: 23, unit: ['hora', 'horas'] },
  { name: 'Día del mes', min: 1, max: 31, unit: ['día', 'días'] },
  { name: 'Mes', min: 1, max: 12, unit: ['mes', 'meses'], names: ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'], offset: 1 },
  { name: 'Día de la semana', min: 0, max: 7, unit: ['día', 'días'], names: ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'], offset: 0 },
];
const CRON_MACROS = { '@yearly': '0 0 1 1 *', '@annually': '0 0 1 1 *', '@monthly': '0 0 1 * *', '@weekly': '0 0 * * 0', '@daily': '0 0 * * *', '@midnight': '0 0 * * *', '@hourly': '0 * * * *' };

function cronValue(token, f) {
  const up = token.toUpperCase();
  if (f.names && f.names.includes(up)) return f.names.indexOf(up) + f.offset;
  if (!/^\d+$/.test(token)) throw new Error(`${f.name}: «${token}» no es un valor válido.`);
  return +token;
}

function parseCronField(raw, f) {
  const set = new Set();
  for (const part of raw.split(',')) {
    const m = /^(\*|\?|[^/-]+(?:-[^/-]+)?)(?:\/(\d+))?$/.exec(part);
    if (!m) throw new Error(`${f.name}: «${part}» no se entiende.`);
    const step = m[2] ? +m[2] : 1;
    if (step < 1) throw new Error(`${f.name}: el paso debe ser mayor que 0.`);
    let lo, hi;
    if (m[1] === '*' || m[1] === '?') { lo = f.min; hi = f.max; }
    else {
      const [a, b] = m[1].split('-');
      lo = cronValue(a, f);
      hi = b !== undefined ? cronValue(b, f) : m[2] ? f.max : lo;
    }
    if (lo < f.min || hi > f.max || lo > hi) throw new Error(`${f.name}: «${part}» está fuera del rango ${f.min}–${f.max}.`);
    for (let v = lo; v <= hi; v += step) set.add(v);
  }
  if (f === CRON_FIELDS[4] && set.has(7)) { set.delete(7); set.add(0); }
  return set;
}

function describeCronField(raw, f, fmt) {
  if (raw === '*' || raw === '?') return null;
  return joinY(raw.split(',').map(part => {
    const [range, step] = part.split('/');
    const every = step === '1' ? `cada ${f.unit[0]}` : `cada ${step} ${f.unit[1]}`;
    if (range === '*' || range === '?') return every;
    const [a, b] = range.split('-');
    const A = fmt(cronValue(a, f));
    const B = b !== undefined ? fmt(cronValue(b, f)) : null;
    if (step) return B ? `${every} de ${A} a ${B}` : `${every} desde ${A}`;
    return B ? `de ${A} a ${B}` : A;
  }));
}

function describeCron(parts) {
  const [mi, ho, dom, mon, dow] = parts;
  const num = s => /^\d+$/.test(s);
  const p2 = n => String(n).padStart(2, '0');
  let time;
  if (mi.split(',').every(num) && ho.split(',').every(num) && mi.split(',').length * ho.split(',').length <= 6) {
    const times = [];
    for (const hh of ho.split(',')) for (const mm of mi.split(',')) times.push(`${p2(+hh)}:${p2(+mm)}`);
    time = `a las ${joinY(times)}`;
  } else if (num(mi) && ho === '*') {
    time = +mi === 0 ? 'cada hora, en punto' : `en el minuto ${+mi} de cada hora`;
  } else if (num(mi) && /^\*\/\d+$/.test(ho)) {
    time = `cada ${ho.slice(2)} horas, ${+mi === 0 ? 'en punto' : `en el minuto ${+mi}`}`;
  } else {
    const mp = mi === '*' ? 'cada minuto' : num(mi) ? `en el minuto ${+mi}` : /^\*\//.test(mi) ? describeCronField(mi, CRON_FIELDS[0], String) : `en los minutos ${describeCronField(mi, CRON_FIELDS[0], String)}`;
    let hp = '';
    if (/^\d+-\d+$/.test(ho)) { const [a, b] = ho.split('-'); hp = `entre las ${p2(+a)}:00 y las ${p2(+b)}:59`; }
    else if (ho !== '*') hp = /^\*\//.test(ho) ? describeCronField(ho, CRON_FIELDS[1], String) : `durante la${ho.split(',').length > 1 ? 's' : ''} hora${ho.split(',').length > 1 ? 's' : ''} ${describeCronField(ho, CRON_FIELDS[1], String)}`;
    time = [mp, hp].filter(Boolean).join(', ');
  }
  const domD = describeCronField(dom, CRON_FIELDS[2], String);
  const dowD = describeCronField(dow, CRON_FIELDS[4], v => WEEKDAYS[v]);
  const monD = describeCronField(mon, CRON_FIELDS[3], v => MONTHS[v - 1]);
  const plural = s => s.replace(/\b(sábado|domingo)\b/g, '$1s');
  const dowText = dowD && (/^(de|cada) /.test(dowD) ? dowD : `los ${plural(dowD)}`);
  const domText = domD && (/^(de|cada) /.test(domD) ? `${domD} del mes` : `el día ${domD} de cada mes`);
  const days = !domD && !dowD ? 'todos los días' : domD && dowD ? `${domText} o ${dowText}` : dowText || domText;
  const month = monD ? (/^(de|cada) /.test(monD) ? monD : `en ${monD}`) : '';
  return `${cap([time, days, month].filter(Boolean).join(', '))}.`;
}

function nextCronRuns(parts, sets, count) {
  const [, , domRaw, , dowRaw] = parts;
  const domAll = domRaw === '*' || domRaw === '?';
  const dowAll = dowRaw === '*' || dowRaw === '?';
  const d = new Date();
  d.setSeconds(0, 0);
  d.setMinutes(d.getMinutes() + 1);
  const runs = [];
  for (let guard = 0; runs.length < count && guard < 400000; guard++) {
    if (!sets[3].has(d.getMonth() + 1)) { d.setMonth(d.getMonth() + 1, 1); d.setHours(0, 0, 0, 0); continue; }
    const domOk = sets[2].has(d.getDate());
    const dowOk = sets[4].has(d.getDay());
    const dayOk = domAll && dowAll ? true : domAll ? dowOk : dowAll ? domOk : domOk || dowOk;
    if (!dayOk) { d.setDate(d.getDate() + 1); d.setHours(0, 0, 0, 0); continue; }
    if (!sets[1].has(d.getHours())) { d.setHours(d.getHours() + 1, 0, 0, 0); continue; }
    if (!sets[0].has(d.getMinutes())) { d.setMinutes(d.getMinutes() + 1, 0, 0); continue; }
    runs.push(new Date(d));
    d.setMinutes(d.getMinutes() + 1);
  }
  return runs;
}

// Entero aleatorio uniforme en [0, n), sin sesgo de módulo.
function randInt(n) {
  const limit = Math.floor(0x100000000 / n) * n;
  const buf = new Uint32Array(1);
  do crypto.getRandomValues(buf); while (buf[0] >= limit);
  return buf[0] % n;
}

function formatUuid(b) {
  const x = bytesToHex(b);
  return `${x.slice(0, 8)}-${x.slice(8, 12)}-${x.slice(12, 16)}-${x.slice(16, 20)}-${x.slice(20)}`;
}
function uuid4() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  return formatUuid(b);
}
let lastV7 = 0;
function uuid7() {
  const b = crypto.getRandomValues(new Uint8Array(16));
  const ms = Math.max(Date.now(), lastV7);
  lastV7 = ms;
  const hi = Math.floor(ms / 0x100000000);
  b[0] = (hi >>> 8) & 0xff; b[1] = hi & 0xff;
  b[2] = (ms >>> 24) & 0xff; b[3] = (ms >>> 16) & 0xff; b[4] = (ms >>> 8) & 0xff; b[5] = ms & 0xff;
  b[6] = (b[6] & 0x0f) | 0x70;
  b[8] = (b[8] & 0x3f) | 0x80;
  return formatUuid(b);
}

    H: [-1, 1, 1, 2, 4, 4, 4, 5, 6, 8, 8, 11, 11, 16, 16, 18, 16, 19, 21, 25, 25, 25, 34, 30, 32, 35, 37, 40, 42, 45, 48, 51, 54, 57, 60, 63, 66, 70, 74, 77, 81],
  };
  const FORMAT = { L: 1, M: 0, Q: 3, H: 2 };

  };
  const rsRemainder = (data, divisor) => {
    const result = new Array(divisor.length).fill(0);
    for (const b of data) {
      const factor = b ^ result.shift();
      result.push(0);
      divisor.forEach((coef, i) => { result[i] ^= gfMul(coef, factor); });
    }
    return result;
  };
  const alignmentPositions = ver => {
    if (ver === 1) return [];
    const count = Math.floor(ver / 7) + 2;
    const step = Math.floor((ver * 8 + count * 3 + 5) / (count * 4 - 4)) * 2;
    const result = [6];
    for (let pos = ver * 4 + 17 - 7; result.length < count; pos -= step) result.splice(1, 0, pos);
    return result;
  };

  function encode(text, ecl = 'M') {
    const bytes = enc.encode(text);
    let ver = 1;
    for (; ver <= 40; ver++) if (4 + (ver <= 9 ? 8 : 16) + bytes.length * 8 <= dataCodewords(ver, ecl) * 8) break;
    if (ver > 40) throw new Error('El texto es demasiado largo para un código QR con este nivel de corrección.');

    // Datos: modo byte, longitud, contenido, terminador y relleno.
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(0x4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    for (const b of bytes) push(b, 8);
    const capacity = dataCodewords(ver, ecl) * 8;
    push(0, Math.min(4, capacity - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < capacity; pad ^= 0xec ^ 0x11) push(pad, 8);

    for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((v, b) => (v << 1) | b, 0));

    // Bloques con corrección de errores, intercalados.
    const numBlocks = BLOCKS[ecl][ver];
    const eccLen = ECC[ecl][ver];
    const rawCodewords = Math.floor(rawModules(ver) / 8);
    const numShort = numBlocks - (rawCodewords % numBlocks);
    const shortLen = Math.floor(rawCodewords / numBlocks);
    const divisor = rsDivisor(eccLen);

    for (let i = 0, k = 0; i < numBlocks; i++) {
      const dat = data.slice(k, k + shortLen - eccLen + (i < numShort ? 0 : 1));
      k += dat.length;
      const ecc = rsRemainder(dat, divisor);
      if (i < numShort) dat.push(0);
      blocks.push(dat.concat(ecc));
    }
    const codewords = [];
    for (let i = 0; i < blocks[0].length; i++) {
      blocks.forEach((block, j) => { if (i !== shortLen - eccLen || j >= numShort) codewords.push(block[i]); });
    }

    const size = ver * 4 + 17;
    const mods = Array.from({ length: size }, () => new Array(size).fill(false));
    const isFn = Array.from({ length: size }, () => new Array(size).fill(false));
    const setFn = (x, y, dark) => { mods[y][x] = dark; isFn[y][x] = true; };
    for (let i = 0; i < size; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    for (const [cx, cy] of [[3, 3], [size - 4, 3], [3, size - 4]]) {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        const x = cx + dx;
        const y = cy + dy;
        if (x >= 0 && x < size && y >= 0 && y < size) setFn(x, y, dist !== 2 && dist !== 4);
      }
    }
    const align = alignmentPositions(ver);
    const last = align.length - 1;
    align.forEach((ax, i) => align.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === last) || (i === last && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setFn(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const drawFormat = mask => {
      const d = (FORMAT[ecl] << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const f = ((d << 10) | rem) ^ 0x5412;
      const bit = i => ((f >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(i));
      setFn(8, 7, bit(6));
      setFn(8, 8, bit(7));
      setFn(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
      setFn(8, size - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const v = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const dark = ((v >>> i) & 1) !== 0;
        const a = size - 11 + (i % 3);
        const b = Math.floor(i / 3);
        setFn(a, b, dark);
        setFn(b, a, dark);
      }
    }
    let idx = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) {

            mods[y][x] = ((codewords[idx >>> 3] >>> (7 - (idx & 7))) & 1) !== 0;
            idx++;
          }
        }
      }
    }

    const MASKS = [
      (x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, x => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
      (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0,
    ];
    const applyMask = m => {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!isFn[y][x] && MASKS[m](x, y)) mods[y][x] = !mods[y][x];
    };
    const addHistory = (len, hist) => { if (hist[0] === 0) len += size; hist.pop(); hist.unshift(len); };
    const countPatterns = hist => {
      const n = hist[1];
      const core = n > 0 && hist[2] === n && hist[3] === n * 3 && hist[4] === n && hist[5] === n;
      return (core && hist[0] >= n * 4 && hist[6] >= n ? 1 : 0) + (core && hist[6] >= n * 4 && hist[0] >= n ? 1 : 0);
    };

      let result = 0;
      const line = get => {
        let color = false;
        let run = 0;
        const hist = [0, 0, 0, 0, 0, 0, 0];

            addHistory(run, hist);
            if (!color) result += countPatterns(hist) * 40;
            color = get(i);
            run = 1;
          }
        }
        if (color) { addHistory(run, hist); run = 0; }
        run += size;
        addHistory(run, hist);
        result += countPatterns(hist) * 40;
      };
      for (let y = 0; y < size; y++) line(x => mods[y][x]);
      for (let x = 0; x < size; x++) line(y => mods[y][x]);
      let dark = 0;
      for (let y = 0; y < size; y++) {
        for (let x = 0; x < size; x++) {
          if (mods[y][x]) dark++;
          if (x < size - 1 && y < size - 1) {
            const c = mods[y][x];
            if (c === mods[y][x + 1] && c === mods[y + 1][x] && c === mods[y + 1][x + 1]) result += 3;
          }
        }
      }
      const total = size * size;
      result += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
      return result;
    };
    let best = 0;
    let bestScore = Infinity;
    for (let m = 0; m < 8; m++) {
      applyMask(m);
      drawFormat(m);
      const score = penalty();
      if (score < bestScore) { best = m; bestScore = score; }
      applyMask(m);
    }
    applyMask(best);
    drawFormat(best);
    return { size, modules: mods, version: ver, mask: best };
  }
  return { encode };
})();

/* ===== Tiempo y color ===== */

const pad = (n, l = 2) => String(n).padStart(l, '0');
const toLocalInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const rtf = new Intl.RelativeTimeFormat('es', { numeric: 'auto' });
function relative(ms) {
  const s = (ms - Date.now()) / 1000;
  const units = [['year', 31536000], ['month', 2592000], ['week', 604800], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
  for (const [u, sec] of units) if (Math.abs(s) >= sec || u === 'second') return rtf.format(Math.round(s / sec), u);
  return '';
}
function durationText(ms) {
  const sign = ms < 0 ? '−' : '';
  let s = Math.abs(Math.round(ms / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const hh = Math.floor(s / 3600); s -= hh * 3600;
  const mm = Math.floor(s / 60); s -= mm * 60;
  const parts = [d && `${fmtNum(d)} d`, hh && `${hh} h`, mm && `${mm} min`, (s || (!d && !hh && !mm)) && `${s} s`].filter(Boolean);
  return sign + parts.join(' ');
}

  const b = probe('#030201');
  if (a !== b) return null;
  if (a.startsWith('#')) return { r: parseInt(a.slice(1, 3), 16), g: parseInt(a.slice(3, 5), 16), b: parseInt(a.slice(5, 7), 16), a: 1 };
  const m = a.match(/[\d.]+/g).map(Number);
  return { r: m[0], g: m[1], b: m[2], a: m[3] ?? 1 };
}
function rgbToHsl({ r, g, b }) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b);
  const min = Math.min(r, g, b);
  const l = (max + min) / 2;
  let hDeg = 0;
  let s = 0;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    hDeg = max === r ? (g - b) / d + (g < b ? 6 : 0) : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    hDeg *= 60;
  }
  return { h: Math.round(hDeg), s: Math.round(s * 100), l: Math.round(l * 100) };
}
function hslToRgb(hh, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + hh / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
  return { r: f(0), g: f(8), b: f(4), a: 1 };
}
const hex2 = n => Math.round(n).toString(16).padStart(2, '0');
const toHex = c => `#${hex2(c.r)}${hex2(c.g)}${hex2(c.b)}${c.a < 1 ? hex2(c.a * 255) : ''}`;
function luminance({ r, g, b }) {
  const ch = v => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; };
  return 0.2126 * ch(r) + 0.7152 * ch(g) + 0.0722 * ch(b);
}
const contrastRatio = (a, b) => { const [x, y] = [luminance(a), luminance(b)].sort((m, n) => n - m); return (x + 0.05) / (y + 0.05); };

tool({
  id: 'colores', cat: 'tiempo', name: 'Colores', color: '#e52592',
  desc: 'HEX ↔ RGB ↔ HSL, tonos de un color y contraste WCAG entre dos.',
  keywords: 'color hex rgb hsl convertir paleta contraste wcag accesibilidad css picker',
  icon: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.9 1.2-1.8-.5-1-.1-2.2 1.2-2.2H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10.5" cy="7" r="1.2"/><circle cx="15.5" cy="8" r="1.2"/>',
  render(body, ctx) {
    const text = input(ctx, 'color', { mono: true, value: '#1a73e8', placeholder: '#1a73e8, rgb(26 115 232), hsl(…), tomato…' });
    const picker = h('input', { type: 'color', class: 'input', 'aria-label': 'Selector de color' });
    const swatch = h('i');
    const status = statusLine();
    const formats = h('dl', { class: 'kv' });
    const tones = h('div', { class: 'tones' });
    const paint = () => {
      const c = parseColor(text.value);
      if (!c) { status.show('No se reconoce ese color.', 'bad'); return; }
      status.show('');
      const hsl = rgbToHsl(c);
      const alpha = c.a < 1 ? Math.round(c.a * 100) / 100 : null;
      swatch.style.background = `rgb(${c.r} ${c.g} ${c.b} / ${c.a})`;
      picker.value = toHex({ ...c, a: 1 });
      const rows = [
        ['HEX', toHex(c)],
        ['RGB', alpha != null ? `rgba(${c.r}, ${c.g}, ${c.b}, ${alpha})` : `rgb(${c.r}, ${c.g}, ${c.b})`],
        ['HSL', alpha != null ? `hsla(${hsl.h}, ${hsl.s}%, ${hsl.l}%, ${alpha})` : `hsl(${hsl.h}, ${hsl.s}%, ${hsl.l}%)`],
        ['CSS moderno', `rgb(${c.r} ${c.g} ${c.b}${alpha != null ? ` / ${alpha}` : ''})`],
        ['Decimal', `${c.r}, ${c.g}, ${c.b}`],
      ];
      formats.replaceChildren(...rows.flatMap(([k, v]) => [h('dt', { text: k }), h('dd', { text: v }), btn('', () => copyText(v), { icon: 'copy', small: true, title: `Copiar ${k}` })]));
      tones.replaceChildren(...[95, 88, 78, 66, 55, 45, 36, 28, 20, 12].map(l => {
        const t = toHex(hslToRgb(hsl.h, hsl.s, l));
        return h('button', { type: 'button', style: `background:${t}`, title: `${t} · luminosidad ${l} %`, 'aria-label': `Copiar ${t}`, onclick: () => copyText(t) });
      }));
    };
    text.addEventListener('input', paint);
    picker.addEventListener('input', () => setValue(text, picker.value));

    const fgText = input(ctx, 'fg', { mono: true, value: '#ffffff' });
    const bgText = input(ctx, 'bg', { mono: true, value: '#1a73e8' });
    const demo = h('div', { class: 'contrast-demo' }, h('b', { text: 'Texto de ejemplo' }), h('span', { text: 'Así se lee un párrafo normal con estos colores.' }));
    const ratio = h('p', { style: 'margin:0;font-size:2rem;font-weight:700;letter-spacing:-.02em' });
    const badges = h('div', { class: 'chips' });
    const contrast = () => {
      const f = parseColor(fgText.value);
      const b = parseColor(bgText.value);
      if (!f || !b) { ratio.textContent = '—'; badges.replaceChildren(h('span', { class: 'badge bad', text: 'Color no válido' })); return; }
      demo.style.color = fgText.value;
      demo.style.background = bgText.value;
      const r = contrastRatio(f, b);
      ratio.textContent = `${r.toFixed(2).replace('.', ',')} : 1`;
      const test = (label, min) => h('span', { class: `badge ${r >= min ? 'ok' : 'bad'}`, text: `${r >= min ? '✓' : '✕'} ${label}` });
      badges.replaceChildren(test('AA texto normal', 4.5), test('AA texto grande', 3), test('AAA texto normal', 7), test('AAA texto grande', 4.5));
    };
    fgText.addEventListener('input', contrast);
    bgText.addEventListener('input', contrast);

    body.append(
      cols(
        panel('Color', h('div', { class: 'row' }, picker, h('div', { style: 'flex:1;min-width:180px' }, text)), status, h('div', { class: 'swatch' }, swatch), formats),
        panel('Tonos', tones, h('p', { class: 'note', text: 'Del más claro al más oscuro, con el mismo matiz y saturación. Haz clic en uno para copiarlo.' }),
          row(btn('Usar como texto del contraste', () => setValue(fgText, toHex(parseColor(text.value) || { r: 0, g: 0, b: 0, a: 1 })), { small: true }),
            btn('Usar como fondo del contraste', () => setValue(bgText, toHex(parseColor(text.value) || { r: 0, g: 0, b: 0, a: 1 })), { small: true }))),
      ),
      panel('Contraste WCAG', h('div', { class: 'fields' }, field('Texto', fgText), field('Fondo', bgText)), demo, ratio, badges,
        row(btn('Intercambiar', () => { const t = fgText.value; setValue(fgText, bgText.value); setValue(bgText, t); }, { icon: 'swap', small: true }))),
    );
    paint();
    contrast();
  },
});

/* ---------- Tablero y navegación ---------- */

const ARROW = '<path d="M5 12h14M13 6l6 6-6 6"/>';
let cleanup = null;

// «Limpiar todo»: borra lo que la herramienta recuerda (textos, opciones e imagen) y la abre de cero.
// Pide un segundo clic para no borrar nada sin querer.
const resetBtn = btn('Limpiar todo', () => {
  if (!resetArmed) {
    resetArmed = setTimeout(disarmReset, 4000);
    resetBtn.classList.add('armed');
    resetText.textContent = '¿Borrar? Pulsa otra vez';
    return;
  }
  disarmReset();
  const t = TOOLS.find(x => x.id === location.hash.slice(1));
  if (t) resetTool(t);
}, { icon: 'clear', small: true, title: 'Borra el texto, la imagen y las opciones que esta herramienta recuerda para la próxima vez' });
const resetText = resetBtn.querySelector('.face > span:last-child');
let resetArmed = 0;
function disarmReset() {
  clearTimeout(resetArmed);
  resetArmed = 0;
  resetBtn.classList.remove('armed');
  resetText.textContent = 'Limpiar todo';
}
resetBtn.classList.add('tool-reset');
document.querySelector('.tool-head').append(resetBtn);

function resetTool(t) {
  if (cleanup) { try { cleanup(); } catch (e) { /* nada que limpiar */ } cleanup = null; }
  forgetTool(t.id);
  if (t.store) forgetTool(t.store);
  if (t.reset) t.reset();
  if (t.usesImage) {
    forgetLogo();
    pickedColors.length = 0;
    resetEdit(null);
    setCurrentImage(null);
  }
  route();
  toast(t.usesImage ? 'Listo: se quitaron la imagen y lo que esta herramienta recordaba.' : 'Listo: se borró lo que esta herramienta recordaba.');
}

function card(t) {
  const a = h('a', { class: 'card glow', href: `#${t.id}`, style: `--c:${t.color}`, 'data-id': t.id },
    h('span', { class: 'face' },
      h('span', { class: 'tile' }, svg(t.icon)),
      h('b', { text: t.name }),
      h('small', { text: t.desc }),
      svg(ARROW, 'go')));
  return a;
}

function buildBoard() {
  const query = $('search').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const board = $('board');
  board.replaceChildren();
  const matches = t => !query || `${t.name} ${t.desc} ${t.keywords}`.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').includes(query);
  let shown = 0;
  if (!query) {
    const recent = loadPref('recent', []).map(id => TOOLS.find(t => t.id === id)).filter(Boolean).slice(0, 4);
    if (recent.length) board.append(h('section', { class: 'cat' }, h('h2', { text: 'Recientes' }), h('div', { class: 'cards' }, recent.map(card))));
  }
  for (const [id, name] of CATS) {
    const list = TOOLS.filter(t => t.cat === id && matches(t));
    if (!list.length) continue;
    shown += list.length;
    board.append(h('section', { class: 'cat' }, h('h2', { text: name }), h('div', { class: 'cards' }, list.map(card))));
  }
  $('empty').hidden = shown > 0;
}

function remember(id) {
  const recent = [id, ...loadPref('recent', []).filter(x => x !== id)].slice(0, 4);
  savePref('recent', recent);
}

// Cabecera de la herramienta abierta. El editor de imágenes la cambia al pasar de una pestaña a otra.
function setHeader(t) {
  $('view').style.setProperty('--c', t.color);
  $('viewTile').replaceChildren(svg(t.icon));
  $('viewTitle').textContent = t.name;
  $('viewDesc').textContent = t.desc;
  document.title = `${t.name} · Navaja suiza`;
}

function route() {
  disarmReset();
  if (cleanup) { try { cleanup(); } catch (e) { /* nada que limpiar */ } cleanup = null; }
  const id = location.hash.slice(1);
  const t = TOOLS.find(x => x.id === id);
  document.querySelector('.wrap').classList.toggle('wide', !!t);
  if (!t) {
    $('view').hidden = true;
    $('viewBody').replaceChildren();
    $('home').hidden = false;
    buildBoard();
    $('home').classList.remove('view-enter');
    void $('home').offsetWidth;
    $('home').classList.add('view-enter');
    document.title = 'Navaja suiza';
    const last = document.querySelector(`.card[data-id="${CSS.escape(loadPref('last', ''))}"]`);
    if (last) last.focus({ preventScroll: false });
    return;
  }
  remember(t.id);
  savePref('last', t.id);
  $('home').hidden = true;
  $('view').hidden = false;
  setHeader(t);
  const body = $('viewBody');
  body.replaceChildren();
  body.classList.remove('view-enter');
  void body.offsetWidth;
  body.classList.add('view-enter');
  window.scrollTo(0, 0);
  try {
    cleanup = t.render(body, makeCtx(t.id)) || null;
  } catch (e) {
    body.append(panel('Error', h('p', { class: 'status bad', text: `No se pudo abrir la herramienta: ${e.message}` })));
  }
  $('btnBack').focus({ preventScroll: true });
}

// Onda al pulsar cualquier botón o card iluminada.
document.addEventListener('pointerdown', e => {
  const target = e.target.closest('.glow');
  if (!target || target.classList.contains('search')) return;
  const face = target.querySelector('.face');
  if (!face) return;
  const rect = face.getBoundingClientRect();
  const dot = h('span', { class: 'ripple', style: `left:${e.clientX - rect.left}px;top:${e.clientY - rect.top}px;--r:${Math.ceil(Math.hypot(rect.width, rect.height) / 10)}` });
  face.append(dot);
  dot.addEventListener('animationend', () => dot.remove());
});

// Brillo de la card que sigue al cursor.
document.addEventListener('pointermove', e => {
  const c = e.target.closest && e.target.closest('.card');
  if (!c) return;
  const face = c.firstElementChild;
  const rect = face.getBoundingClientRect();
  face.style.setProperty('--mx', `${e.clientX - rect.left}px`);
  face.style.setProperty('--my', `${e.clientY - rect.top}px`);
});

const isTyping = el => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
document.addEventListener('keydown', e => {
  if (e.key === '/' && !$('home').hidden && !isTyping(document.activeElement)) {
    e.preventDefault();
    $('search').focus();
    $('search').select();
  } else if (e.key === 'Escape' && !$('view').hidden && !isTyping(document.activeElement)) {
    location.hash = '';
  } else if (e.key === 'Escape' && document.activeElement === $('search')) {
    $('search').value = '';
    buildBoard();
  }
});
$('search').addEventListener('input', buildBoard);
$('search').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const first = $('board').querySelector('.cat:not(:first-child) .card, .card');
    const all = [...$('board').querySelectorAll('.card')];
    const pick = $('search').value.trim() ? all[0] : first;
    if (pick) location.hash = pick.getAttribute('href');
  }
});
window.addEventListener('hashchange', route);

/* ---------- Lanzador (opcional) ---------- */

// Dentro del lanzador, la aplicación le cuenta su título. Abierta sola, esto no hace nada.
const embedded = window.parent !== window;
if (embedded) {
  const tell = () => parent.postMessage({ launcher: true, type: 'title', title: document.title, busy: false }, location.protocol === 'file:' ? '*' : location.origin);
  new MutationObserver(tell).observe(document.querySelector('title'), { childList: true, characterData: true, subtree: true });
  tell();
}

/* ---------- Arranque ---------- */

$('heroText').textContent = `${TOOLS.length} herramientas para tu día en la oficina. Funcionan sin conexión y nada sale de tu navegador.`;
route();
</script>
</body>
</html>
